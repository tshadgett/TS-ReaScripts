        else { const want = Math.max(lo, Math.min(Math.min(hi, 100), r)); S_("mcv", p.g, "r", (p.mc.rf ? 1 / want : want).toFixed(3)); }
      }
    } else if (d.k === "kn") {
      const nk = Math.max(0, d.k0 + (d.s === 1 ? -(y - d.y0) : (y - d.y0)) * 2 * (TOP - BOT) / ch);
      if (d.share) { const n = Math.max(0, Math.min(1, nk / d.share)); S_("mcn", p.g, "k", (p.mc.kr ? 1 - n : n).toFixed(5)); }
      else S_("mcv", p.g, "k", nk.toFixed(2));
    } else if (d.k === "g") {
      d.D.set(d.b0 - (y - d.y0) / ch * (TOP - BOT));
    } else if (d.k === "t") {
      const tgt = d.t0 - (y - d.y0) / ch * (TOP - BOT);
      if (TC) { const x = calFrom(tgt); S_(TC.n ? "mcn" : "mcv", p.g, TK, TC.n ? Math.max(0, Math.min(1, x)).toFixed(5) : x.toFixed(2)); }
      else if ((v.u[TK] === "db" || TD) && !rv) S_("mcv", p.g, TK, tgt.toFixed(2));
      else { const dn = (y - d.y0) / (ch * (TOP - BOT - 12) / (TOP - BOT)); S_("mcn", p.g, TK, Math.max(0, Math.min(1, d.n0 + (rv ? dn : -dn))).toFixed(5)); }
    } else {
      const e2 = st.env, w = d.k === "a" ? e2.AW : d.k === "h" ? e2.HW : e2.RW, r = d.k === "a" ? ATK : d.k === "h" ? HLD : REL;
      const f = Math.max(0, Math.min(1, d.f0 + (x - d.x0) / Math.max(1, w)));
      const es = p.mc.es && p.mc.es[d.k];
      if (es) {
        const s_ = stepNear(es, f);
        if (Math.abs(s_.n - (v.n[d.k] || 0)) > 1e-6) S_("mcn", p.g, d.k, s_.n.toFixed(5));
      } else if (v.u[d.k] === "ms" && v.v[d.k] != null) S_("mcv", p.g, d.k, ft(f, r).toFixed(3));
      else S_("mcn", p.g, d.k, (RA[d.k] ? 1 - f : f).toFixed(5));
    }
  });
  cv.addEventListener("pointerup", () => { st.drag = null; });
  P.mc = ev => { if (!ev) return; st.v = ev; draw(); };
}

// ---------------------------------------------------------------------------
// ReaComp: the transfer-curve canvas, as the desktop draws it
// (TS_CV_CompPanel). The bridge sends real units (vals.fx[g].rc) and takes
// them back with rcset; the plain knobs and switches go through p by their
// parameter index (p.rc.i).
// ---------------------------------------------------------------------------
const RC_W = 560, RC_MW = 66, RC_DB_TOP = 6, RC_DB_BOT = -60;
const RC_ATK = [0.1, 500], RC_REL = [1, 5000], RC_PRE = [0.1, 250];
const rcOpen = new Set();            // ReaComp canvases built: their traces are asked for
const rcDrawer = new Set();          // ...and which have the detector drawer out
function rcTransfer(x, thr, ratio, knee) {
  const slope = ratio < 0 ? 0 : (ratio > 0 ? 1 / ratio : 1);
  knee = Math.max(0, knee || 0);
  if (knee > 0) {
    const h2 = knee / 2;
    if (x <= thr - h2) return x;
    if (x >= thr + h2) return thr + (x - thr) * slope;
    const t = x - thr + h2;
    return x + (slope - 1) * t * t / (2 * knee);
  }
  return x <= thr ? x : thr + (x - thr) * slope;
}
const rcFrac = (ms, r) => (!ms || ms <= r[0]) ? 0 : ms >= r[1] ? 1 : Math.log(ms / r[0]) / Math.log(r[1] / r[0]);
const rcTime = (f, r) => f <= 0 ? 0 : f >= 1 ? r[1] : r[0] * Math.pow(r[1] / r[0], f);
const rcRise = (t, k) => (1 - Math.exp(-t * k)) / (1 - Math.exp(-k));
// a readout's units, when the plugin's own text has none
const rcMs = t => (t && !/[a-z]/i.test(t)) ? t + " ms" : (t || "");

function buildComp(p, bodyH) {
  const W = RC_W + PAD * 2;
  const pnl = h("div", "pnl");
  pnl.style.width = W + "px";
  const head = h("div", "ph");
  const byp = h("button", "hb"); byp.innerHTML = `<svg viewBox="0 0 24 24">${ICON.power}</svg>`;
  byp.addEventListener("click", () => send("byp", p.g));
  const flt = h("button", "hb fl"); flt.innerHTML = `<svg viewBox="0 0 24 24">${ICON.float}</svg>`;
  flt.addEventListener("click", () => send("float", p.g));
  const col = h("button", "hb col"); col.innerHTML = `<svg viewBox="0 0 24 24">${ICON.collapse}</svg>`;
  const fold = () => {
    if (shut.has(p.g)) shut.delete(p.g); else shut.add(p.g);
    saveShut(); pnl.classList.toggle("shut", shut.has(p.g));
  };
  col.addEventListener("click", fold);
  doubleTap(head, fold);
  if (shut.has(p.g)) pnl.classList.add("shut");
  const wet = wetChip(p, W);
  head.append(h("span", "ix", p.i), h("span", "nm", p.n), ...(wet ? [wet] : []), moreBtn(p), col, flt, byp);
  const body = h("div", "pb");
  pnl.append(head, body);
  const cv = h("canvas", "eqc");
  const H = Math.max(200, bodyH - 0);
  const dpr = window.devicePixelRatio || 1;
  cv.width = RC_W * dpr; cv.height = H * dpr; cv.style.height = H + "px"; cv.style.width = RC_W + "px";
  body.append(cv);

  const I = p.rc.i || {}, RNG = p.rc.rng || {};
  const st = { v: null, over: new Map(), trail: [], zones: [], drag: null, tap: null };
  rcOpen.add(p.g); sendGrv();
  // A setting the finger is moving wins over the bridge's echo for a moment.
  const now = () => Date.now();
  const get = k => { const o = st.over.get(k); if (o && now() - o.t < 700) return o.v; return st.v ? st.v[k] : undefined; };
  const put = (k, v) => st.over.set(k, { v, t: now() });
  const clamp = (k, v) => { const r = RNG[k]; return r ? Math.max(r[0], Math.min(r[1], v)) : v; };
  const setReal = (k, v) => { v = clamp(k, v); put(k, v); send("rcset", p.g, k, (+v).toFixed(4)); draw(); };
  const getN = k => { const o = st.over.get("n." + k); if (o && now() - o.t < 700) return o.v; return st.v && st.v.n ? (st.v.n[k] || 0) : 0; };
  const setN = (k, v) => { if (I[k] == null) return; v = Math.max(0, Math.min(1, v)); st.over.set("n." + k, { v, t: now() }); send("p", p.g, I[k], v.toFixed(4)); draw(); };
  const flip = k => setN(k, getN(k) >= 0.5 ? 0 : 1);
  let K = null;
  const colours = () => {
    const cs = getComputedStyle(pnl), v = n => cs.getPropertyValue(n).trim();
    K = { acc: v("--accent"), bi: v("--fill-bi"), cap: v("--cap"), label: v("--label"), dim: v("--dim"),
          value: v("--value"), ring: v("--ring"), panel: v("--panel"), win: v("--win"), toff: v("--toff"),
          ton: v("--ton"), ttext: v("--ttext"), body: v("--body"), track: v("--track"), lo: v("--lo") };
  };

  function draw() {
    if (!K) colours();
    const c = cv.getContext("2d");
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, RC_W, H);
    const zones = st.zones = [];
    const dh = rcDrawer.has(p.g) ? 84 : 22;
    const gw = RC_W - RC_MW, gh = H - dh;
    const v = st.v || {};
    let thr = get("t"); if (thr == null) thr = -20; thr = Math.max(RC_DB_BOT, thr);
    let ratio = get("r"); if (ratio == null) ratio = 1;
    const knee = Math.max(0, get("k") || 0);
    const gr = v.g || 0;
    const X = db => (db - RC_DB_BOT) / (RC_DB_TOP - RC_DB_BOT) * gw;
    const Y = db => (RC_DB_TOP - db) / (RC_DB_TOP - RC_DB_BOT) * gh;
    const out = db => rcTransfer(db, thr, ratio, knee);
    const perDb = gh / (RC_DB_TOP - RC_DB_BOT);
    c.font = "11px -apple-system, system-ui, sans-serif";

    c.save(); c.beginPath(); c.rect(0, 0, gw, gh); c.clip();
    c.fillStyle = "rgba(0,0,0,0.22)"; c.fillRect(0, 0, gw, gh);
    c.lineWidth = 1;
    for (const g of [0, -12, -24, -36, -48]) {
      const y = Math.round(Y(g)) + 0.5;
      c.strokeStyle = withA(K.ring, 0.45); c.beginPath(); c.moveTo(0, y); c.lineTo(gw, y); c.stroke();
      c.fillStyle = withA(K.dim, 0.8); c.fillText(String(g), 4, y - 3);
    }
    // the level history: output filled from the foot, the input a fainter
    // wash above it, the reduction hanging from the top
    const hst = v.h;
    if (hst && !hst.m && hst.o) {
      const N = hst.o.length, cw = gw / N;
      const q = (s, k) => (B64V[s.charCodeAt(k)] || 0) / 63;
      for (let k = 0; k < N; k++) {
        const yo = Y(RC_DB_BOT + q(hst.o, k) * 60), yi = Y(RC_DB_BOT + q(hst.i, k) * 60);
        c.fillStyle = withA(K.label, 0.25); c.fillRect(k * cw, yo, cw + 0.3, gh - yo);
        if (yi < yo - 0.5) { c.fillStyle = withA(K.label, 0.11); c.fillRect(k * cw, yi, cw + 0.3, yo - yi); }
      }
      const pts = [];
      c.fillStyle = withA(K.bi, 0.17);
      for (let k = 0; k < N; k++) {
        const a = B64V[hst.g.charCodeAt(2 * k)], b = B64V[hst.g.charCodeAt(2 * k + 1)];
        if (a < 0 || b < 0) continue;
        const gy = Math.min(gh, (a * 64 + b) / 64 * perDb);
        if (gy > 0.5) c.fillRect(k * cw, 0, cw + 0.3, gy);
        pts.push((k + 0.5) * cw, gy);
      }
      if (pts.length > 2) {
        c.strokeStyle = K.bi; c.lineWidth = 1.5; c.beginPath(); c.moveTo(pts[0], pts[1]);
        for (let k = 2; k < pts.length; k += 2) c.lineTo(pts[k], pts[k + 1]);
        c.stroke();
      }
    }
    // faded on the left, where the curve starts, and at the foot
    let gr1 = c.createLinearGradient(0, 0, gw * 0.7, 0);
    gr1.addColorStop(0, withA(K.panel, 0.7)); gr1.addColorStop(0.64, withA(K.panel, 0.25)); gr1.addColorStop(1, withA(K.panel, 0));
    c.fillStyle = gr1; c.fillRect(0, 0, gw, gh);
    gr1 = c.createLinearGradient(0, gh * 0.55, 0, gh);
    gr1.addColorStop(0, withA(K.panel, 0)); gr1.addColorStop(1, withA(K.panel, 0.88));
    c.fillStyle = gr1; c.fillRect(0, gh * 0.55, gw, gh * 0.45);
    if (hst && hst.m) {
      c.fillStyle = K.dim; c.textAlign = "right";
      c.fillText(hst.m, gw - 6, 14); if (hst.m2) c.fillText(hst.m2, gw - 6, 28);
      c.textAlign = "left";
    }
    // the threshold, widened by the knee into a band fading at its edges
    const ty = Y(thr);
    if (knee > 0) {
      const ta = Y(thr + knee / 2), tb = Y(thr - knee / 2);
      const g2 = c.createLinearGradient(0, ta, 0, tb);
      g2.addColorStop(0, withA(K.acc, 0)); g2.addColorStop(0.5, withA(K.acc, 0.5)); g2.addColorStop(1, withA(K.acc, 0));
      c.fillStyle = g2; c.fillRect(0, ta, gw, tb - ta);
    }
    c.strokeStyle = K.acc; c.lineWidth = 1.6; c.beginPath(); c.moveTo(0, ty); c.lineTo(gw, ty); c.stroke();
    // the reduction wedge and the dotted no-compression line
    const k0 = thr - knee / 2;
    c.beginPath(); c.moveTo(X(k0), Y(k0));
    for (let i = 0; i <= 60; i++) { const d = k0 + (RC_DB_TOP - k0) * i / 60; c.lineTo(X(d), Y(d)); }
    for (let i = 60; i >= 0; i--) { const d = k0 + (RC_DB_TOP - k0) * i / 60; c.lineTo(X(d), Y(out(d))); }
    c.closePath(); c.fillStyle = withA(K.bi, 0.11); c.fill();
    c.setLineDash([3, 4]); c.strokeStyle = withA(K.label, 0.65); c.lineWidth = 1;
    c.beginPath(); c.moveTo(X(k0), Y(k0)); c.lineTo(X(RC_DB_TOP), Y(RC_DB_TOP)); c.stroke(); c.setLineDash([]);
    // the transfer curve
    c.beginPath();
    for (let i = 0; i <= 200; i++) { const d = RC_DB_BOT + (RC_DB_TOP - RC_DB_BOT) * i / 200; i ? c.lineTo(X(d), Y(out(d))) : c.moveTo(X(d), Y(out(d))); }
    c.strokeStyle = K.cap; c.lineWidth = 2.4; c.stroke();
    // the live dot, and its tail
    const tr = st.trail;
    tr.forEach((pt, i) => {
      if (!pt || i === tr.length - 1) return;
      c.fillStyle = withA(K.bi, 0.12 + i * 0.045);
      c.beginPath(); c.arc(X(pt[0]), Y(pt[1]), 1.6 + i * 0.2, 0, Math.PI * 2); c.fill();
    });
    const hd = tr[tr.length - 1];
    if (hd) {
      const hx = X(hd[0]), hy = Y(hd[1]), cy = Y(out(hd[0]));
      if (cy - hy > 2) { c.setLineDash([2, 2]); c.strokeStyle = withA(K.bi, 0.7); c.lineWidth = 1; c.beginPath(); c.moveTo(hx, hy + 6); c.lineTo(hx, cy - 1); c.stroke(); c.setLineDash([]); }
      c.fillStyle = withA(K.bi, 0.2); c.beginPath(); c.arc(hx, hy, 10, 0, Math.PI * 2); c.fill();
      c.fillStyle = "#ffd8b0"; c.strokeStyle = K.bi; c.lineWidth = 1.5;
      c.beginPath(); c.arc(hx, hy, 5, 0, Math.PI * 2); c.fill(); c.stroke();
    }
    // readouts
    const tx = (v.x && v.x.t) || "";
    c.fillStyle = K.value; c.font = "600 15px -apple-system, system-ui, sans-serif";
    c.fillText(st.over.has("t") && now() - st.over.get("t").t < 700 ? thr.toFixed(1) + " dB" : tx, 10, ty - 8);
    c.font = "11px -apple-system, system-ui, sans-serif"; c.fillStyle = K.dim; c.fillText("Threshold", 10, ty + 15);
    const ex = gw - 8, ey = Y(out(RC_DB_TOP));
    const rx = (v.x && v.x.r) || "";
    const dragR = st.over.has("r") && now() - st.over.get("r").t < 700;
    const rl = ratio < 0 ? "∞ : 1" : (dragR || !rx ? (ratio >= 10 ? ratio.toFixed(0) : ratio.toFixed(2)) : rx.replace(/\s*:\s*1\s*$/, "")) + " : 1";
    c.textAlign = "right"; c.fillStyle = K.value; c.font = "600 15px -apple-system, system-ui, sans-serif";
    c.fillText(rl, ex - 12, ey - 9);
    c.font = "11px -apple-system, system-ui, sans-serif"; c.fillStyle = K.dim; c.fillText("Ratio", ex - 12, ey + 15);
    c.textAlign = "left";
    c.restore();

    // the handles
    const kx = X(thr);
    c.fillStyle = K.acc; c.beginPath(); c.roundRect ? c.roundRect(kx - 24, ty - 5, 48, 10, 5) : c.rect(kx - 24, ty - 5, 48, 10); c.fill();
    zones.push({ k: "thr", x: 0, y: ty - 14, w: gw - 26, h: 28 });
    if (I.k != null) {
      const gx = Math.max(80, kx - 96);
      [[thr + knee / 2, -1], [thr - knee / 2, 1]].forEach(([e, s], j) => {
        const yy = Y(e) + s * 4;
        c.fillStyle = withA(K.acc, 0.9); c.fillRect(gx, yy - 2.5, 18, 5);
        zones.push({ k: "knee", s, x: gx - 8, y: yy - 12, w: 34, h: 24 });
        if (j === 0) { c.textAlign = "right"; c.fillStyle = K.label; c.fillText("Knee " + ((v.x && v.x.k) || knee.toFixed(1) + " dB"), gx - 6, yy + 4); c.textAlign = "left"; }
      });
    }
    c.fillStyle = K.cap; c.beginPath(); c.arc(ex, ey, 6, 0, Math.PI * 2); c.fill();
    zones.push({ k: "ratio", x: ex - 18, y: ey - 18, w: 30, h: 36, ey });

    // the envelope and the output, see-through, riding on the canvas's foot
    const ph = 98, ow = 126, ew = 212;
    const py = gh - ph - 8, ox = gw - 8 - ow, el = ox - 8 - ew;
    const panelBox = (x, y, w, hh) => {
      c.fillStyle = withA(K.win, 0.8); c.strokeStyle = K.ring; c.lineWidth = 1;
      c.beginPath(); c.roundRect ? c.roundRect(x + 0.5, y + 0.5, w, hh, 6) : c.rect(x + 0.5, y + 0.5, w, hh); c.fill(); c.stroke();
    };
    if (py > 40 && el > 40) {
      panelBox(el, py, ew, ph);
      const atk = get("a") || 0, rel = get("l") || 0, pre = I.pc != null ? (get("pc") || 0) : 0;
      const auto = I.ar != null && getN("ar") >= 0.5;
      const gx0 = el + 12, gx1 = el + ew - 12, base = py + ph - 28, peak = py + 16;
      const PW = I.pc != null ? 28 : 0, inner = gx1 - gx0 - PW, AW = inner * 0.34, RW = inner * 0.62;
      const on = gx0 + PW, sx = on - rcFrac(pre, RC_PRE) * PW, ak = on + rcFrac(atk, RC_ATK) * AW, re = ak + rcFrac(rel, RC_REL) * RW;
      c.setLineDash([2, 3]); c.strokeStyle = withA(K.dim, 0.6); c.beginPath(); c.moveTo(on, peak - 2); c.lineTo(on, base + 2); c.stroke(); c.setLineDash([]);
      c.strokeStyle = withA(K.ring, 0.8); c.beginPath(); c.moveTo(gx0, base); c.lineTo(gx1, base); c.stroke();
      const A = [[gx0, base], [sx, base]];
      for (let i = 1; i <= 20; i++) { const t = i / 20; A.push([sx + (ak - sx) * t, base + (peak - base) * rcRise(t, 3.2)]); }
      const Rr = [[ak, peak]];
      for (let i = 1; i <= 26; i++) { const t = i / 26; Rr.push([ak + (re - ak) * t, peak + (base - peak) * rcRise(t, 3.5)]); }
      Rr.push([gx1, base]);
      c.beginPath(); c.moveTo(gx0, base); [...A, ...Rr].forEach(q => c.lineTo(q[0], q[1])); c.lineTo(gx1, base); c.closePath();
      c.fillStyle = withA(K.acc, 0.18); c.fill();
      c.strokeStyle = K.acc; c.lineWidth = 2;
      c.beginPath(); A.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.stroke();
      if (auto) c.setLineDash([4, 3]);
      c.beginPath(); Rr.forEach((q, i) => i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1])); c.stroke(); c.setLineDash([]);
      const node = (x, y, hollow) => {
        c.beginPath(); c.arc(x, y, 6, 0, Math.PI * 2);
        c.fillStyle = hollow ? K.win : "#e4e6e9"; c.fill(); c.strokeStyle = K.acc; c.lineWidth = 1.8; c.stroke();
      };
      if (I.pc != null) { node(sx, base, false); zones.push({ k: "env", r: "pc", rng: RC_PRE, w0: PW, dir: -1, x: sx - 14, y: base - 14, w: 28, h: 28 }); }
      node(ak, peak, false); zones.push({ k: "env", r: "a", rng: RC_ATK, w0: AW, dir: 1, x: ak - 14, y: peak - 14, w: 28, h: 28 });
      node(re, base, auto); zones.push({ k: "env", r: "l", rng: RC_REL, w0: RW, dir: 1, x: re - 14, y: base - 14, w: 28, h: 28 });
      c.fillStyle = K.value; c.font = "11px -apple-system, system-ui, sans-serif";
      c.fillText("Atk " + rcMs(v.x && v.x.a), gx0, py + ph - 9);
      c.textAlign = "right"; c.fillText("Rel " + (auto ? "auto" : rcMs(v.x && v.x.l)), gx1, py + ph - 9);
      if (pre > 0) { c.textAlign = "right"; c.fillStyle = K.label; c.fillText("Pre " + rcMs(v.x && v.x.pc), gx1 - (I.ar != null ? 26 : 0), py + 19); }
      c.textAlign = "left";
      const btn = (x, y, w, hh, on, text, k) => {
        c.fillStyle = on ? K.ton : K.toff; c.strokeStyle = on ? K.ton : K.ring;
        c.beginPath(); c.roundRect ? c.roundRect(x, y, w, hh, 4) : c.rect(x, y, w, hh); c.fill(); c.stroke();
        c.fillStyle = on ? "#0d1116" : K.ttext; c.font = "600 10px -apple-system, system-ui, sans-serif"; c.textAlign = "center";
        c.fillText(text, x + w / 2, y + hh / 2 + 3.5); c.textAlign = "left"; c.font = "11px -apple-system, system-ui, sans-serif";
        zones.push({ k: "flip", r: k, x: x - 4, y: y - 4, w: w + 8, h: hh + 8 });
      };
      if (I.ar != null) btn(gx1 - 18, py + 6, 20, 18, auto, "A", "ar");
      panelBox(ox, py, ow, ph);
      const knob = (cx, cy, r, k, name) => {
        const n = getN(k), a0 = Math.PI * 0.75, a1 = a0 + Math.PI * 1.5 * n;
        c.lineWidth = 3; c.strokeStyle = K.track; c.beginPath(); c.arc(cx, cy, r + 3, a0, a0 + Math.PI * 1.5); c.stroke();
        c.strokeStyle = K.acc; c.beginPath(); c.arc(cx, cy, r + 3, a0, a1); c.stroke();
        c.fillStyle = K.body; c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
        c.strokeStyle = "#f0f1f2"; c.lineWidth = 2; c.beginPath();
        c.moveTo(cx + Math.cos(a1) * r * 0.25, cy + Math.sin(a1) * r * 0.25); c.lineTo(cx + Math.cos(a1) * r * 0.8, cy + Math.sin(a1) * r * 0.8); c.stroke();
        c.textAlign = "center"; c.fillStyle = K.label; c.font = "10px -apple-system, system-ui, sans-serif";
        c.fillText(name, cx, cy + r + 14);
        c.fillStyle = K.value; c.fillText((v.nx && v.nx[k]) || "", cx, cy + r + 26);
        c.textAlign = "left"; c.font = "11px -apple-system, system-ui, sans-serif";
        zones.push({ k: "knob", r: k, x: cx - r - 10, y: cy - r - 8, w: 2 * r + 20, h: 2 * r + 36 });
      };
      if (I.we != null) knob(ox + 32, py + 22, 13, "we", "Wet");
      if (I.dr != null) knob(ox + ow - 32, py + 22, 13, "dr", "Dry");
      const bw = I.li != null ? (ow - 18) / 2 : ow - 12;
      if (I.mk != null) btn(ox + 6, py + ph - 24, bw, 18, getN("mk") >= 0.5, "MAKE-UP", "mk");
      if (I.li != null) btn(ox + 12 + bw, py + ph - 24, bw, 18, getN("li") >= 0.5, "LIMIT", "li");

      // the drawer
      const dy = gh;
      c.fillStyle = withA(K.win, 0.6); c.fillRect(0, dy, gw, dh);
      c.strokeStyle = K.ring; c.beginPath(); c.moveTo(0, dy + 0.5); c.lineTo(gw, dy + 0.5); c.stroke();
      const tw = 100, tx0 = (gw - tw) / 2;
      c.fillStyle = K.body; c.beginPath(); c.roundRect ? c.roundRect(tx0, dy, tw, 18, 4) : c.rect(tx0, dy, tw, 18); c.fill();
      c.fillStyle = K.label; c.textAlign = "center"; c.fillText((rcDrawer.has(p.g) ? "▾ " : "▴ ") + "Detector", gw / 2, dy + 13); c.textAlign = "left";
      zones.push({ k: "drawer", x: tx0 - 10, y: dy - 6, w: tw + 20, h: 28 });
      if (rcDrawer.has(p.g)) {
        const yy = dy + 30;
        if (I.de != null) {
          c.fillStyle = K.dim; c.fillText("Detector", 10, yy - 6);
          c.fillStyle = K.body; c.strokeStyle = K.ring;
          c.beginPath(); c.roundRect ? c.roundRect(10, yy, 120, 26, 4) : c.rect(10, yy, 120, 26); c.fill(); c.stroke();
          c.fillStyle = K.ttext; c.fillText(((v.nx && v.nx.de) || "") + "  ▾", 16, yy + 17);
          zones.push({ k: "det", x: 10, y: yy, w: 120, h: 26 });
        }
        let kx2 = 170;
        for (const [k, n] of [["rm", "RMS"], ["lp", "Low-pass"], ["hp", "High-pass"]]) {
          if (I[k] != null) { knob(kx2, yy + 8, 11, k, n); kx2 += 70; }
        }
        if (I.au != null) btn(gw - 118, yy + 2, 108, 24, getN("au") >= 0.5, "PREVIEW FILTER", "au");
      }
    }

    // the meters, full height on the right
    const mx = gw;
    c.fillStyle = withA(K.win, 0.45); c.fillRect(mx, 0, RC_MW, H);
    c.strokeStyle = K.ring; c.beginPath(); c.moveTo(mx + 0.5, 0); c.lineTo(mx + 0.5, H); c.stroke();
    const mh = H - 36, bw2 = 12;
    const gx = mx + 12, ox2 = mx + RC_MW - 12 - bw2;
    c.fillStyle = "#0c0d0e"; c.fillRect(gx, 6, bw2, mh); c.fillRect(ox2, 6, bw2, mh);
    const grR = Math.max(12, Math.ceil(gr / 6) * 6);
    c.fillStyle = K.bi; c.fillRect(gx + 1, 7, bw2 - 2, Math.min(1, gr / grR) * (mh - 2));
    const op = v.op != null ? v.op : -150;
    const of = Math.max(0, Math.min(1, (op + 60) / 66));
    c.fillStyle = op > -0.1 ? css("--clip") : K.lo; c.fillRect(ox2 + 1, 6 + mh - of * mh, bw2 - 2, of * mh);
    c.font = "10px -apple-system, system-ui, sans-serif"; c.textAlign = "center";
    c.fillStyle = K.dim; c.fillText("GR", gx + bw2 / 2, mh + 18); c.fillText("Out", ox2 + bw2 / 2, mh + 18);
    c.fillStyle = K.bi; c.fillText(gr >= 0.05 ? gr.toFixed(1) : "–", gx + bw2 / 2, mh + 30);
    c.fillStyle = K.value; c.fillText(op > -149 ? op.toFixed(1) : "–", ox2 + bw2 / 2, mh + 30);
    c.textAlign = "left";
  }

  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  const hitZone = (x, y) => { for (let i = st.zones.length - 1; i >= 0; i--) { const z = st.zones[i]; if (x >= z.x && x <= z.x + z.w && y >= z.y && y <= z.y + z.h) return z; } return null; };
  cv.addEventListener("pointerdown", e => {
    e.preventDefault();
    const [x, y] = pos(e);
    const z = hitZone(x, y);
    if (!z) return;
    const t = now(), dbl = st.tap && st.tap.z === z.k + (z.r || "") && t - st.tap.t < 350;
    st.tap = { z: z.k + (z.r || ""), t };
    if (z.k === "flip") { flip(z.r); return; }
    if (z.k === "drawer") { if (rcDrawer.has(p.g)) rcDrawer.delete(p.g); else rcDrawer.add(p.g); draw(); return; }
    if (z.k === "det") {
      const list = p.rc.dch || [], cur = (st.v && st.v.nx && st.v.nx.de) || "";
      openSheet(sh => {
        sh.append(h("h3", null, "Detector input"));
        for (const ch of list) {
          const o = h("button", "opt" + (ch.t === cur ? " cur" : ""), ch.t);
          o.addEventListener("click", () => { setN("de", ch.n); closeSheet(); });
          sh.append(o);
        }
      });
      return;
    }
    if (z.k === "knob" && dbl) { send("def", p.g, I[z.r]); return; }
    cv.setPointerCapture(e.pointerId);
    const gh = H - (rcDrawer.has(p.g) ? 84 : 22);
    st.drag = { z, x0: x, y0: y, perDb: (RC_DB_TOP - RC_DB_BOT) / gh, gh,
      t: get("t"), k: get("k") || 0, n: z.r ? getN(z.r) : 0,
      f: z.k === "env" ? rcFrac(get(z.r) || 0, z.rng) : 0 };
  });
  cv.addEventListener("pointermove", e => {
    const d = st.drag;
    if (!d || !cv.hasPointerCapture(e.pointerId)) return;
    const [x, y] = pos(e);
    const fine = e.shiftKey ? 0.25 : 1;
    const dx = (x - d.x0) * fine, dy = (y - d.y0) * fine;
    const z = d.z;
    if (z.k === "thr") setReal("t", d.t - dy * d.perDb);
    else if (z.k === "knee") setReal("k", Math.max(0, d.k + z.s * dy * d.perDb * 2));
    else if (z.k === "ratio") {
      const thr = get("t");
      const endDb = RC_DB_TOP - (z.ey + dy) / d.gh * (RC_DB_TOP - RC_DB_BOT);
      const rise = RC_DB_TOP - thr, hi = (RNG.r && RNG.r[1]) || 100;
      // flat at the top of the range: infinite
      if (rise > 0.01 && endDb - thr <= rise / hi) { put("r", -1); send("rcset", p.g, "r", "-1"); draw(); }
      else setReal("r", rise <= 0.01 ? get("r") : rise / Math.max(0.0001, endDb - thr));
    }
    else if (z.k === "env") {
      const f = Math.max(0, Math.min(1, d.f + z.dir * dx / z.w0));
      setReal(z.r, rcTime(f, z.rng));
    }
    else if (z.k === "knob") setN(z.r, d.n - dy / 160);
  });
  const end = () => { st.drag = null; };
  cv.addEventListener("pointerup", end);
  cv.addEventListener("pointercancel", end);

  const P = { p, ctl: [], byp, head, grEl: null, pl: null, wet,
    rc(rv) {
      if (!rv) return;
      st.v = rv;
      const tr = st.trail;
      if (rv.ip != null && rv.ip > RC_DB_BOT && !(vals.fx[p.g] && vals.fx[p.g].e === false)) tr.push([Math.min(6, rv.ip), Math.min(6, rv.ip) - (rv.g || 0)]);
      else tr.push(null);
      while (tr.length > 14) tr.shift();
      draw();
    } };
  ui.panels.set(p.g, P);
  requestAnimationFrame(draw);
  return pnl;
}

function pickChoice(c, cur, set) {
  const list = c.ch || [];
  if (!list.length) return;
  openSheet(sh => {
    sh.append(h("h3", null, c.l || "Choose"));
    const at = nearestChoice(c, cur);
    list.forEach((name, i) => {
      const o = h("button", "opt" + (i === at ? " cur" : ""), String(name));
      o.addEventListener("click", () => { set(choiceNorm(c, i)); closeSheet(); });
      sh.append(o);
    });
  });
}

// ---------------------------------------------------------------------------
// rendering the values
// ---------------------------------------------------------------------------
function render() {
  renderStatus();
  renderTransport();
  renderMacros();
  if (showNav) drawNav();
  if (!vals || !layout) return;
  showMsg(vals.msg);
  // a conditional control come or gone: that panel is laid out again
  for (const [g, P] of ui.panels) {
    if (P.hsig !== undefined && P.hsig !== hiddenSig(g)) { rebuildKeeping(g); break; }
  }
  for (const [g, P] of ui.panels) {
    const fv = vals.fx && vals.fx[g];
    if (!fv) continue;
    if (P.pf) {
      const t = fv.pn ? fv.pn + (fv.pm ? " *" : "") : "No preset";
      if (P.pf.textContent !== t) P.pf.textContent = t;
      P.pf.classList.toggle("mod", !!fv.pm);
      // the full name on hover (a mouse or trackpad), for when it's cut short
      const tip = fv.pn ? fv.pn + (fv.pm ? " (modified)" : "") : "";
      if (P.pf.title !== tip) P.pf.title = tip;
    }
    const byp = fv.e === false;
    P.byp.classList.toggle("on", byp);
    P.head.style.background = P.off ? "var(--head-off)" : byp ? "var(--head-byp)" : (P.pl ? P.pl.head : "");
    for (const e of P.ctl) {
      const l = held(e.id);
      const v = l ? l.v : (fv.v[e.c.idx] || 0);
      const x = fv.x[e.c.idx] || "";
      if (e.two) {
        // an XY pad's Y, a concentric knob's inner knob
        const l2 = held(e.id + "/2"), k = String(e.c.idx);
        e.set(v, x, l2 ? l2.v : ((fv.v2 && fv.v2[k]) || 0), (fv.x2 && fv.x2[k]) || "");
        continue;
      }
      e.set(v, x);
      if (e.val) e.val.textContent = layout.vals === false ? "" : x;
      // driven by a macro or modulator: its ring / bar
      if (e.ring) { const r = fv.rg && fv.rg[String(e.c.idx)]; if (r) e.ring.set(r[0], r[1], r[2], r[3] || []); }
    }
    paintWet(P, g);
    if (P.eq) P.eq(fv.eq);
    if (P.rc) P.rc(fv.rc);
    if (P.mq) P.mq(fv.mq);
    if (P.mc) P.mc(fv.mc);
    if (P.grEl) {
      const gr = fv.gr || 0, range = Math.max(P.p.gr || 18, gr);
      P.grEl.fill.style.height = `calc(${Math.min(100, gr / range * 100)}% - 4px)`;
      P.grEl.fill.style.background = fv.est ? "var(--grm)" : "var(--fill-bi)";
      P.grEl.gv.textContent = gr >= 0.05 ? gr.toFixed(1) : "–";
      if (P.grEl.cv) drawTrace(P.grEl, fv.tw, gr, fv.est, range, grv.get(g) || P.p.gw);
    }
  }
  if (ui.sends) {
    const sc = layout && layout.outs ? 1 : 0;
    (vals.s || []).forEach((sv, i) => ui.sends[sc][i] && ui.sends[sc][i].set(sv));
    (vals.r || []).forEach((sv, i) => ui.sends[-1][i] && ui.sends[-1][i].set(sv));
  }
  renderMixer();
  renderMr();
  const t = vals.tr, S = ui.strip;
  if (t && S) {
    const pl = held("pan"), vl = held("vol");
    const pan = pl ? pl.v : (t.pan + 1) / 2;
    if (S.pan) {
      S.pan.set(pan); S.setPan(pan);
      S.panLbl.textContent = Math.abs(t.pan) < 0.005 ? "C" : (Math.round(Math.abs(t.pan) * 100) + (t.pan < 0 ? "L" : "R"));
    }
    const f = vl ? vl.v : t.f;
    S.fdr.set(f); S.setVol(f);
    S.vdb.textContent = S.short ? t.db : t.db + " dB";
    const lv = db => Math.max(0, Math.min(100, (db + 60) / 60 * 100));
    S.mlv.style.height = lv(t.pl) + "%"; S.mrv.style.height = lv(t.pr) + "%";
    const col = db => db >= 0 ? "var(--over)" : db >= -6 ? "var(--clip)" : "var(--lo)";
    S.mlv.style.background = col(t.pl); S.mrv.style.background = col(t.pr);
    S.bm.classList.toggle("on", !!t.m); S.bs.classList.toggle("on", !!t.s); S.br.classList.toggle("on", !!t.r);
    if (S.bp) S.bp.classList.toggle("on", !!t.ph);
    if (S.bi) {
      S.bi.textContent = MON_TXT[t.mo || 0];
      S.bi.classList.toggle("on", t.mo === 1); S.bi.classList.toggle("au", t.mo === 2);
    }
    if (S.bmo) paintMono(S.bmo, monoOn());
    if (S.mp) S.mp.set(pan);
  }
}

function renderTransport() {
  if (!ui.tb || !transport) return;
  const ps = +transport[1];
  ui.tb.play.classList.toggle("on", (ps & 1) === 1 && ps !== 5);
  ui.tb.pause.classList.toggle("on", (ps & 2) === 2);
  ui.tb.rec.classList.toggle("on", (ps & 4) === 4);
  ui.tb.loop.classList.toggle("on", transport[3] === "1");
  ui.tb.metro.classList.toggle("on", macroStates["40364"] === 1);
  const clock = $("clock");
  if (beat) {
    const meas = (+beat[4]) + 1, inb = +beat[5];
    clock.firstChild.textContent = `${meas}.${(Math.floor(inb) + 1)}.${String(Math.floor((inb % 1) * 100)).padStart(2, "0")}`;
  }
  const secs = +transport[2];
  const m = Math.floor(secs / 60), s = secs - m * 60;
  clock.lastChild.textContent = `${m}:${s.toFixed(3).padStart(6, "0")}`;
}

function renderMacros() {
  for (const m of macros) if (m.el) {
    const sw = switchOf(m);
    const lit = (sw !== null && sw !== "menu") ? sw === webBars.c : macroStates[m.a] === 1;
    m.el.classList.toggle("on", lit && !macroEdit);
  }
}

function renderStatus() {
  const st = $("status"), ban = $("banner");
  if (!st) return;
  let msg = "";
  if (!reachable) msg = "Can't reach REAPER. Is the web interface still running?";
  else if (!aliveVal || Date.now() - aliveAt > 2500) msg = "Start TS_ChannelView_Web in REAPER to see the panels (Actions list).";
  st.className = msg ? "bad" : "ok";
  ban.textContent = msg;
  ban.style.display = msg ? "block" : "none";
}

// ---------------------------------------------------------------------------
// go
// ---------------------------------------------------------------------------
buildTransport();
loadMacros();
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { applyMix(mixState, false); layout && build(); }, 150); });
applyMix(mixState, false);
if (mixState !== "closed") send("mix", 1);
if (showNav) send("nav", 1);
setInterval(poll, 70);
poll();
</script>
</body>
</html>
