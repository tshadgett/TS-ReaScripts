<!--
  TS_ChannelView.html -- ChannelView in a browser, for a tablet beside the desk.

  Served by REAPER's own web interface (Preferences > Control/OSC/web > Add >
  Web browser interface). Transport and actions go straight to REAPER; the
  plugin panels go through TS_ChannelView_Web.lua, which must be running in
  REAPER (see its header for the ExtState protocol).
-->
<style>
:root {
  --win: #15171a; --panel: #202327; --border: #2d3136; --head: #1a1c20; --head-byp: #3a2420;
  --text: #dfe2e6; --dim: #868b92; --label: #a6abb2; --value: #dfe2e6;
  --track: #34383d; --fill: #4aa3df; --fill-bi: #d9893a; --body: #2a2d32; --pointer: #f0f1f2;
  --ring: #454a50; --toff: #2c3035; --ton: #4aa3df; --ttext: #e4e6e9; --accent: #4aa3df;
  --strip: #181a1d; --sel: #4aa3df; --grm: #d2609b; --cap: #c9ccd0; --byp: #d9673a;
  --mute: #d9673a; --solo: #d9b23a; --rec: #d9433a; --warn: #d9673a; --mon: #4f9c62; --mauto: #4a8fd9; --spec: #5d6f80; --lo: #4f9c62; --clip: #d9493a; --over: #ff3a3a;
  --sw: 100px; --tb-h: 64px; --mac-h: 58px; --trk-h: 54px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--win); color: var(--text);
  font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; font-size: 13px;
  overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; }
/* The bottom safe area (the home indicator) goes to the track bar, which
   carries its background down into it, rather than to an empty band. */
#app { display: flex; flex-direction: column; height: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }

/* transport */
/* three parts: the location and markers on the left, the transport itself
   centred, the view switches on the right */
#tb { height: var(--tb-h); flex-shrink: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 6px; padding: 0 10px; background: var(--strip); border-bottom: 1px solid var(--border); }
#tb .tl, #tb .tc, #tb .tr { display: flex; align-items: center; gap: 6px; min-width: 0; }
#tb .tr { justify-content: flex-end; }
.tbtn { width: 48px; height: 46px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel);
  display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0; }
.tbtn svg { width: 22px; height: 22px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tbtn.on { background: var(--accent); border-color: var(--accent); }
.tbtn.on svg { stroke: #fff; }
.tbtn.rec.on { background: var(--rec); border-color: var(--rec); }
.tbtn.play.on { background: var(--lo); border-color: var(--lo); }
.tbtn:active { filter: brightness(1.3); }
.tsep { width: 10px; flex-shrink: 0; }
/* The transport as the desktop theme draws it: square buttons, a big round
   play with record and loop hugging it on concave edges, filled colour
   when on (record red, play green, loop blue, pause amber). */
.tb2 { width: 50px; height: 46px; padding: 0; border: 0; background: none; flex-shrink: 0; cursor: pointer; }
.tb2 svg, .tcl { display: block; overflow: visible; }
.tcl { flex-shrink: 0; margin: 0 2px; }
.tcl g { cursor: pointer; }
.tsh { fill: var(--panel); stroke: var(--border); stroke-width: 1.2; }
.tic { fill: var(--label); }
.tics { fill: none; stroke: var(--label); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.trec .tic { fill: var(--rec); }
.on.trec .tsh { fill: var(--rec); stroke: rgba(0,0,0,0.35); }
.on.tplay .tsh { fill: var(--lo); stroke: rgba(0,0,0,0.35); }
.on.tloop .tsh { fill: var(--accent); stroke: rgba(0,0,0,0.35); }
.on.tpause .tsh { fill: var(--solo); stroke: rgba(0,0,0,0.35); }
.on .tic { fill: #111; } .on .tics { stroke: #111; }
.tb2:active svg, .tcl g:active { filter: brightness(1.35); }
#clock { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-width: 140px;
  margin-right: 6px; flex-shrink: 0; }
#clock .big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
#clock .small { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
#status { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); flex-shrink: 0; margin-left: 4px; }
#status.ok { background: var(--lo); } #status.bad { background: var(--rec); }

/* macros */
#mac { flex-shrink: 0; height: var(--mac-h); display: flex; align-items: center; gap: 6px; padding: 0 10px;
  background: var(--head); border-bottom: 1px solid var(--border); overflow-x: auto; }
#mac.hidden { display: none; }
/* the navigator: the whole session in a strip, above the transport */
#nav { height: 116px; flex-shrink: 0; position: relative; background: var(--strip);
  border-bottom: 1px solid var(--border); touch-action: none; }
#nav.hidden { display: none; }
#nav canvas { position: absolute; left: 10px; right: 10px; top: 6px; bottom: 6px; width: calc(100% - 20px);
  height: calc(100% - 12px); display: block; }
.mbtn { height: 42px; min-width: 84px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--panel); flex-shrink: 0; cursor: pointer; position: relative; border-bottom-width: 3px; }
.mbtn.on { background: var(--accent); color: #fff; }
.mbtn .x { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--rec); color: #fff; font-size: 13px; line-height: 22px; text-align: center; display: none; }
#mac.edit .mbtn .x { display: block; }
#mac.edit .mbtn { animation: wob 0.25s infinite alternate; }
@keyframes wob { from { transform: rotate(-0.6deg); } to { transform: rotate(0.6deg); } }
.madd { min-width: 46px; color: var(--dim); font-size: 22px; display: none; }
#mac.edit .madd { display: block; }

<script>
"use strict";
// ---------------------------------------------------------------------------
// talking to REAPER
// ---------------------------------------------------------------------------
const NS = "TS_CV_WEB";
const unesc = s => s.replace(/\\(.)/g, (m, c) => c === "t" ? "\t" : c === "n" ? "\n" : c);

async function reaper(cmds) {
  const r = await fetch("/_/" + cmds, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const out = { ext: {}, cmd: {} };
  for (const line of (await r.text()).split("\n")) {
    const f = line.split("\t");
    if (f[0] === "TRANSPORT") out.transport = f;
    else if (f[0] === "BEATPOS") out.beat = f;
    else if (f[0] === "EXTSTATE") out.ext[f[2]] = unesc(f.slice(3).join("\t"));
    else if (f[0] === "CMDSTATE") out.cmd[f[1]] = +f[2];
  }
  return out;
}
const run = id => reaper(encodeURIComponent(String(id))).catch(() => {});

// Commands for the bridge, resent until acknowledged. A run of moves on the
// same control collapses to its latest value.
let seqBase = Date.now();
const outbox = [];
function send(verb, ...args) {
  // A run of moves on one control collapses to its latest: the target is
  // the verb and every argument but the value.
  const coalesce = ["p", "vol", "pan", "svol", "eqf", "eqg", "eqq", "grset", "tvol", "tpan", "mix", "nav", "navview"].includes(verb);
  const target = verb + "|" + args.slice(0, -1).join("|");
  if (coalesce) {
    const i = outbox.findIndex(o => o.target === target);
    if (i >= 0) outbox.splice(i, 1);
  }
  outbox.push({ seq: ++seqBase, target, text: [verb, ...args].join("|") });
  kick();
}
// Send now rather than waiting for the next poll: a knob should answer the
// finger, not the timer.
let kickTimer = null;
function kick() { if (!kickTimer) kickTimer = setTimeout(() => { kickTimer = null; poll(); }, 0); }
function outboxText() {
  return outbox.map(o => o.seq + "|" + o.text).join("~");
}

// ---------------------------------------------------------------------------
// state
// ---------------------------------------------------------------------------
let layout = null, layoutSeq = -1, vals = null, transport = null, beat = null;
let macros = [], macroEdit = false, macroStates = {};
let aliveVal = null, aliveAt = 0, reachable = true;
const local = new Map();     // control id -> { v, t }: what the user is doing right now
const LOCAL_HOLD = 450;      // ms a touched control ignores the echo
const ui = { panels: new Map(), strip: null };

let showMacros = true;
let showNav = false;
try { showNav = localStorage.getItem("tscv.nav") === "1"; } catch (e) {}
// The space below the transport changed (a bar shown or hidden): the mixer
// keeps its share and the panels are laid out again for their new height.
function relayout() { applyMix(mixState, false); if (layout) build(); }
let shut = new Set();
try { shut = new Set(JSON.parse(localStorage.getItem("tscv.shut") || "[]")); } catch (e) {}
function saveShut() { try { localStorage.setItem("tscv.shut", JSON.stringify([...shut])); } catch (e) {} }
// Gain-reduction traces open on this device: guid -> window ("" = the
// layout's own). Per device, like collapsing; the bridge is told which, and
// told again every few seconds so it can drop them when the page goes away.
let grv = new Map();
try { grv = new Map(Object.entries(JSON.parse(localStorage.getItem("tscv.grv") || "{}"))); } catch (e) {}
function saveGrv() {
  try { localStorage.setItem("tscv.grv", JSON.stringify(Object.fromEntries(grv))); } catch (e) {}
  sendGrv();
}
function sendGrv() { send("grset", [...grv].map(([g, w]) => g + "=" + w).join(",")); }
setInterval(() => { if (grv.size) sendGrv(); }, 3000);
setTimeout(() => { if (grv.size) sendGrv(); }, 300);
try { showMacros = localStorage.getItem("tscv.macros") !== "0"; } catch (e) {}

// ---------------------------------------------------------------------------
// polling
// ---------------------------------------------------------------------------
let busy = false;
async function poll() {
  if (busy) return;
  busy = true;
  try {
    let q = `GET/EXTSTATE/${NS}/vals;GET/EXTSTATE/${NS}/alive;TRANSPORT;BEATPOS;GET/40364;GET/1068`;
    for (const m of macros) q += ";GET/" + encodeURIComponent(m.a);
    if (outbox.length) q = `SET/EXTSTATE/${NS}/cmd/` + encodeURIComponent(outboxText()) + ";" + q;
    const r = await reaper(q);
    reachable = true;
    transport = r.transport; beat = r.beat;
    macroStates = r.cmd;
    const alive = r.ext.alive || "";
    if (alive !== aliveVal) { aliveVal = alive; aliveAt = Date.now(); }
    if (r.ext.vals) {
      try { vals = JSON.parse(r.ext.vals); } catch (e) {}
      if (vals) {
        while (outbox.length && outbox[0].seq <= vals.A) outbox.shift();
        if (vals.L !== layoutSeq) await fetchLayout();
        if (vals.nv && vals.nv.N !== navSeq) await fetchNav();
      }
    }
    render();
  } catch (e) {
    reachable = false;
    renderStatus();
  }
  busy = false;
}
async function fetchLayout() {
  const r = await reaper(`GET/EXTSTATE/${NS}/layout`);
  if (!r.ext.layout) return;
  try {
    layout = JSON.parse(r.ext.layout);
    layoutSeq = vals ? vals.L : -1;
    applyPalette(layout.pal || {});
    build();
  } catch (e) { console.error(e); }
}
let nav = null, navSeq = -1;
async function fetchNav() {
  const r = await reaper(`GET/EXTSTATE/${NS}/nav`);
  if (!r.ext.nav) return;
  try { nav = JSON.parse(r.ext.nav); navSeq = vals.nv.N; } catch (e) {}
}

  const p0 = pt(r, a0), p1 = pt(r, a1);

}
function radial(n, r0, r1, a0, a1) {

    d += `M${f2(p[0])} ${f2(p[1])}L${f2(q[0])} ${f2(q[1])}`;

const BODY = { skirted: 38, pointer: 43, trim: 47 };
let gradN = 0;

function el(tag, attrs, parent) {

// Builds a knob face of `size` px; returns { svg, set(v) }.
function makeKnob(size, style, cap, bipolar, tick) {
  style = BODY[style] ? style : "arc";
  const svg = el("svg", { width: size, height: size, viewBox: "0 0 100 100" });
  tick = tick || "var(--ring)";
  if (style === "arc") {
    el("circle", { cx: 50, cy: 50, r: 50, fill: "var(--body)" }, svg);
    el("path", { d: arcPath(44, A0, A1), fill: "none", stroke: "var(--track)", "stroke-width": 7 }, svg);
    const fill = el("path", { fill: "none", stroke: cap || (bipolar ? "var(--fill-bi)" : "var(--fill)"),
      "stroke-width": 7 }, svg);
    if (bipolar) el("line", { x1: 50, y1: 2, x2: 50, y2: 12, stroke: "var(--ring)", "stroke-width": 2 }, svg);
    const ptr = el("g", {}, svg);
    el("line", { x1: 50, y1: 14, x2: 50, y2: 36, stroke: "var(--pointer)", "stroke-width": 6, "stroke-linecap": "round" }, ptr);
    el("circle", { cx: 50, cy: 50, r: 49, fill: "none", stroke: "var(--ring)", "stroke-width": 2 }, svg);
    return { svg, set(v) {
      const a = A0 + (A1 - A0) * v;
      fill.setAttribute("d", bipolar ? arcPath(44, 0, a) : arcPath(44, A0, a));
      ptr.setAttribute("transform", `rotate(${f2(a)} 50 50)`);
    } };
  }
  // hardware faces, in a design space scaled so the body fills the knob
  cap = cap || CAP_DEFAULT[style];
  const ink = lum(cap) > 0.55 ? "#1d1e20" : "#f3f3f1";
  const k = 50 / BODY[style];
  const g = el("g", { transform: `translate(50 50) scale(${f2(k)}) translate(-50 -50)` });
  const id = "sh" + (++gradN);
  const defs = el("defs", {}, svg);
  const rg = el("radialGradient", { id, cx: "0.36", cy: "0.3", r: "0.75" }, defs);
  el("stop", { offset: 0, "stop-color": "#fff", "stop-opacity": style === "skirted" ? 0.12 : 0.3 }, rg);
  el("stop", { offset: 0.6, "stop-color": "#fff", "stop-opacity": 0.02 }, rg);
  el("stop", { offset: 1, "stop-color": "#000", "stop-opacity": 0.25 }, rg);
  // the scale sits just outside the body
  const tk = el("path", { d: radial(11, 53, 60, A0, A1), fill: "none", stroke: tick,
    "stroke-width": 3, "stroke-linecap": "round" });
  svg.appendChild(tk);
  svg.appendChild(g);
  let rot;
  if (style === "skirted") {
    el("circle", { cx: 50, cy: 50, r: 37, fill: "#18191b" }, g);
    el("circle", { cx: 50, cy: 50, r: 26, fill: cap, stroke: "rgba(0,0,0,0.45)", "stroke-width": 1.5 }, g);
    el("circle", { cx: 50, cy: 50, r: 26, fill: `url(#${id})` }, g);
    rot = el("g", {}, g);
    el("line", { x1: 50, y1: 14, x2: 50, y2: 24, stroke: "#f3f3f1", "stroke-width": 4, "stroke-linecap": "round" }, rot);
    el("line", { x1: 50, y1: 28, x2: 50, y2: 42, stroke: ink, "stroke-width": 3.5, "stroke-linecap": "round" }, rot);
  } else if (style === "pointer") {
    rot = el("g", {}, g);
    el("path", { d: "M50 5 C57 5 64 27 66 45 C68 65 61 81 50 81 C39 81 32 65 34 45 C36 27 43 5 50 5 Z",
      fill: cap, stroke: "rgba(0,0,0,0.55)", "stroke-width": 1.5 }, rot);
    el("line", { x1: 50, y1: 10, x2: 50, y2: 33, stroke: ink, "stroke-width": 3.5, "stroke-linecap": "round" }, rot);
    el("circle", { cx: 50, cy: 50, r: 17, fill: cap, stroke: "rgba(0,0,0,0.5)", "stroke-width": 1.5 }, g);
    el("circle", { cx: 50, cy: 50, r: 17, fill: `url(#${id})` }, g);
  } else {
    svg.removeChild(tk);
    el("circle", { cx: 50, cy: 50, r: 40, fill: "#232528", stroke: "#0e0f10", "stroke-width": 2 }, g);
    const kn = el("g", {}, g);
    el("path", { d: radial(24, 31, 37, 0, 345), fill: "none", stroke: "#7b8087", "stroke-width": 3 }, kn);
    el("circle", { cx: 50, cy: 50, r: 30, fill: "#a1a6ac", stroke: "#3c3f44", "stroke-width": 1.5 }, g);
    el("circle", { cx: 50, cy: 43, r: 21, fill: "rgba(255,255,255,0.14)" }, g);
    rot = el("g", {}, g);
    el("line", { x1: 50, y1: 38, x2: 50, y2: 74, stroke: "#2b2d31", "stroke-width": 5, "stroke-linecap": "round" }, rot);
    el("circle", { cx: 50, cy: 29, r: 4.5, fill: cap }, rot);
    return { svg, set(v) {
      const a = A0 + (A1 - A0) * v;
      rot.setAttribute("transform", `rotate(${f2(a)} 50 50)`);
      kn.setAttribute("transform", `rotate(${f2(a)} 50 50)`);
    } };
  }
  return { svg, set(v) { rot.setAttribute("transform", `rotate(${f2(A0 + (A1 - A0) * v)} 50 50)`); } };
}

// ---------------------------------------------------------------------------
// drag: vertical, relative, on any control
// ---------------------------------------------------------------------------
function dragger(node, get, set, opts) {
  opts = opts || {};
  let startY = 0, startV = 0, lastTap = 0, moved = false;
  node.addEventListener("pointerdown", e => {
    e.preventDefault();
    node.setPointerCapture(e.pointerId);
    startY = e.clientY; startV = get(); moved = false;
  });
  node.addEventListener("pointermove", e => {
    if (!node.hasPointerCapture(e.pointerId)) return;
    const dy = startY - e.clientY;
    if (Math.abs(dy) > 2) moved = true;
    if (!moved) return;
    const travel = typeof opts.travel === "function" ? opts.travel() : (opts.travel || 220);
    let v = startV + dy / Math.max(40, travel);
    v = Math.max(0, Math.min(1, v));
    if (opts.steps > 1) v = Math.round(v * (opts.steps - 1)) / (opts.steps - 1);
    set(v);
  });
  node.addEventListener("pointerup", e => {
    if (!moved) {
      const now = Date.now();
      if (now - lastTap < 320) { lastTap = 0; opts.reset && opts.reset(); }
      else lastTap = now;
    }
  });
}

// ---------------------------------------------------------------------------
// panel layout -- TS_CV_Panel.layout, at touch size
// ---------------------------------------------------------------------------
const CELL_W = 84, CELL_H = 100, KNOB = 52, PAD = 8, HEAD = 34, DIV_W = 12, GR_W = 34, MIN_W = 190, TRACE_W = 200;

function placeControls(ctls, bodyH) {
  const rows = Math.max(1, Math.floor(bodyH / CELL_H));
  const halfRows = rows * 2, halfH = CELL_H / 2;
  const items = [], rules = [];
  const sections = [[]], splitters = [];
  ctls.forEach((c, i) => {
    const o = Object.assign({ idx: i }, c);
    if (c.t === "divider" || c.t === "fader") { splitters.push(o); sections.push([]); }
    else sections[sections.length - 1].push(o);
  });
  let x = 0;
  sections.forEach((sec, si) => {
    if (si > 0) {
      const sp = splitters[si - 1];
      if (sp.t === "fader") { items.push({ c: sp, x, y: 0, h: rows * CELL_H }); x += CELL_W; }
      else { if (!sp.nr) rules.push(x + DIV_W / 2); x += DIV_W; }
    }
    if (!sec.some(c => c.t === "half_gap")) {
      const cols = Math.ceil(sec.length / rows);
      sec.forEach((c, i) => items.push({ c, x: x + Math.floor(i / rows) * CELL_W, y: (i % rows) * CELL_H }));
      x += cols * CELL_W;
    } else {
      let col = 0, cur = 0;
      for (const c of sec) {
        const cost = c.t === "half_gap" ? 1 : 2;
        if (cur + cost > halfRows) { col++; cur = 0; }
        if (c.t !== "half_gap") items.push({ c, x: x + col * CELL_W, y: cur * halfH });
        cur += cost;
      }
      x += (col + 1) * CELL_W;
    }
  });
  return { items, rules, width: x, rows };
}

function buildMacros() {
  const bar = $("mac");
  bar.innerHTML = "";
  bar.classList.toggle("edit", macroEdit);
  if (!macros.length && !macroEdit) bar.append(h("div", "mempty", "No macros yet. Tap the pencil to add some."));
  macros.forEach((m, i) => {
    const b = h("button", "mbtn", m.l || m.a);
    b.style.borderBottomColor = m.c || "var(--border)";
    const x = h("span", "x", "×");
    b.append(x);

const CAPS = ["#4aa3df", "#c8453c", "#d98a2f", "#d9be45", "#4f9c62", "#3f74b8", "#8d9298", "#e6e0d2", "#26282b"];

let findSeq = 0, findTimer = null;
function editMacro(i) {
  const m = i >= 0 ? Object.assign({}, macros[i]) : { l: "", a: "", c: "" };
  openSheet(sh => {
    sh.append(h("h3", null, i >= 0 ? "Edit macro" : "New macro"));
    const lab = h("input", "fld"); lab.placeholder = "Label"; lab.value = m.l || "";
    const act = h("input", "fld"); act.placeholder = "Search actions, or an action ID"; act.value = m.a || "";
    const res = h("div", "res");
    const sw = h("div", "sw");
    const paint = () => [...sw.children].forEach((b, k) => b.classList.toggle("cur", CAPS[k] === m.c));
    CAPS.forEach(c => { const b = h("button"); b.style.background = c;
      b.addEventListener("click", () => { m.c = (m.c === c) ? "" : c; paint(); }); sw.append(b); });
    paint();
    act.addEventListener("input", () => {
      m.a = act.value.trim();
      clearTimeout(findTimer);
      findTimer = setTimeout(() => searchActions(act.value, res, (id, name) => {
        m.a = id; act.value = id; if (!lab.value) lab.value = shortName(name); res.innerHTML = "";
      }), 250);
    });
    const acts = h("div", "acts");
    const cancel = h("button", null, "Cancel"); cancel.addEventListener("click", closeSheet);
    const left = h("button", null, "◀"); const right = h("button", null, "▶");
    const ok = h("button", "pri", "Save");
    left.addEventListener("click", () => { if (i > 0) { [macros[i - 1], macros[i]] = [macros[i], macros[i - 1]]; i--; saveMacros(); } });
    right.addEventListener("click", () => { if (i >= 0 && i < macros.length - 1) { [macros[i + 1], macros[i]] = [macros[i], macros[i + 1]]; i++; saveMacros(); } });
    ok.addEventListener("click", () => {
      m.l = lab.value.trim(); m.a = act.value.trim();
      if (!m.a) return;
      const clean = { l: m.l, a: m.a, c: m.c };
      if (i >= 0) macros[i] = clean; else macros.push(clean);
      saveMacros(); closeSheet();
    });
    if (i >= 0) acts.append(left, right);
    acts.append(cancel, ok);
    sh.append(lab, act, res, h("div", "lbl", "Colour"), sw, acts);
    setTimeout(() => lab.focus(), 50);
  });
}
const shortName = n => n.replace(/^[^:]+:\s*/, "").slice(0, 18);

async function searchActions(q, res, pick) {
  if (q.trim().length < 2) { res.innerHTML = ""; return; }
  send("find", q.replace(/[|~]/g, " "));
  const mine = ++findSeq;
  for (let k = 0; k < 20 && mine === findSeq; k++) {
    await new Promise(r => setTimeout(r, 150));
    try {
      const r = await reaper(`GET/EXTSTATE/${NS}/found`);
      const f = r.ext.found ? JSON.parse(r.ext.found) : null;
      if (f && f.q === q.replace(/[|~]/g, " ")) {
        res.innerHTML = "";
        if (!f.r.length) res.append(h("div", "lbl", "Nothing found"));
        for (const a of f.r) {

}

// A panel's background: the plate, gradient and grain included.
function plateFill(pl) {
  if (!pl) return "";
  if (!layout.tex) return pl.bg;
  const sh = pl.sheen || 1;
  const mix = (a, b, t) => { const p = x => parseInt(x.slice(1), 16);
    const A = p(a), B = p(b), out = [16, 8, 0].map(s => Math.round(((A >> s) & 255) + (((B >> s) & 255) - ((A >> s) & 255)) * t));
    return "#" + out.map(v => v.toString(16).padStart(2, "0")).join(""); };
  const g = `linear-gradient(180deg, ${mix(pl.bg, "#ffffff", 0.08 * sh)} 0%, ${pl.bg} 40%, ${mix(pl.bg, "#000000", 0.12 * sh)} 100%)`;
  return pl.brushed
    ? `repeating-linear-gradient(0deg, rgba(255,255,255,0.07) 0 1px, transparent 1px 3px), repeating-linear-gradient(0deg, rgba(0,0,0,0.045) 0 1px, transparent 1px 7px), ${g}`

}

// ---------------------------------------------------------------------------
// the navigator
// ---------------------------------------------------------------------------
// The session at a glance, as REAPER's Navigator: a lane per visible track
// with its items, regions along the top, markers, the time selection, the
// playhead, and a box for what the arrange view on the computer shows.
// Tap to put the edit cursor there (and the playhead, while playing); drag
// the box -- or drag anywhere else, and the box comes to the finger -- to
// scroll the arrange view. Tap a region's name to go to its start.
const NAV_RB = 17;                 // the region band along the top
let navDrag = null, navHold = null;
const navExt = () => Math.max(nav ? nav.L : 60, vals && vals.nv ? vals.nv.b : 0) * 1.02;
function navBox() {
  const nv = vals && vals.nv;
  if (!nv) return null;
  const w = nv.b - nv.a;
  if (navHold && Date.now() - navHold.t < 700) return { a: navHold.a, b: navHold.a + w };
  return { a: nv.a, b: nv.b };
}
function drawNav() {
  const cv = $("nav").querySelector("canvas"), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  const x = cv.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, W, H);
  x.fillStyle = "rgba(0,0,0,0.25)";
  x.fillRect(0, 0, W, H);
  const nv = vals && vals.nv;
  if (!nav || !nv) {
    x.fillStyle = css("--dim"); x.font = "12px -apple-system, system-ui, sans-serif";
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText("connecting…", W / 2, H / 2);
    return;
  }
  const ext = navExt(), X = t => t / ext * W;
  const top = NAV_RB + 2, lh = H - top;
  const ring = css("--ring"), dim = css("--dim"), text = css("--text");
  x.font = "11px -apple-system, system-ui, sans-serif"; x.textBaseline = "middle";
  // regions: a band with names, a faint wash down the lanes
  for (const r of nav.rg || []) {
    const x0 = X(r.s), x1 = Math.max(x0 + 2, X(r.e));
    const c = r.c || ring;
    x.fillStyle = withA(c, 0.07); x.fillRect(x0, top, x1 - x0, lh);
    x.fillStyle = withA(c, 0.55); x.fillRect(x0, 0, x1 - x0, NAV_RB);
    x.save(); x.beginPath(); x.rect(x0, 0, x1 - x0, NAV_RB); x.clip();
    x.fillStyle = text; x.textAlign = "left";
    x.fillText(r.n || ("Region " + r.x), x0 + 4, NAV_RB / 2 + 0.5);
    x.restore();
  }
  // the time selection
  if (nv.t1 > nv.t0) { x.fillStyle = "rgba(255,255,255,0.10)"; x.fillRect(X(nv.t0), top, X(nv.t1) - X(nv.t0), lh); }
  // lanes
  const lanes = nav.lanes || [], n = Math.max(1, lanes.length);
  const lph = lh / n, gap = lph >= 5 ? 1 : 0;
  const colOf = new Map((layout && layout.tracks || []).map(t => [t.i, t.c]));
  const bw = W / nav.n * (nav.L / ext);
  lanes.forEach((ln, k) => {
    const y = top + k * lph;
    x.fillStyle = withA(colOf.get(ln.i) || dim, 0.85);
    for (let j = 0; j < ln.s.length; j += 2) {
      const x0 = ln.s[j] * bw, x1 = (ln.s[j + 1] + 1) * bw;
      x.fillRect(x0, y, Math.max(1, x1 - x0), Math.max(1, lph - gap));
    }
  });
  // markers: a line, and the number and name on a dark tab in the region
  // band, cut short where the next marker's tab begins
  const mks = (nav.mk || []).slice().sort((a, b) => a.p - b.p);
  mks.forEach((m, k) => {
    const mx = Math.round(X(m.p)) + 0.5;
    const col = m.c || "#d94a4a";
    x.fillStyle = withA(col, 0.9);
    x.fillRect(mx - 0.5, 0, 1, H);
    const room = (k + 1 < mks.length ? X(mks[k + 1].p) : W) - mx - 4;
    let label = m.n ? m.x + " " + m.n : String(m.x);
    if (x.measureText(label).width + 8 > room) {
      while (label.length > String(m.x).length && x.measureText(label + "…").width + 8 > room) label = label.slice(0, -1);
      if (label !== String(m.x)) label = label.trimEnd() + "…";
    }
    const tw = x.measureText(label).width + 8;
    x.fillStyle = "rgba(0,0,0,0.55)"; x.fillRect(mx + 0.5, 1, tw, NAV_RB - 2);
    x.fillStyle = withA(col, 0.9); x.fillRect(mx + 0.5, 1, 2, NAV_RB - 2);
    x.textAlign = "left"; x.fillStyle = text;
    x.fillText(label, mx + 5, NAV_RB / 2 + 0.5);
  });
  // the arrange view's box
  const bx = navBox();
  if (bx) {
    const x0 = X(bx.a), x1 = Math.max(x0 + 6, X(bx.b));
    x.fillStyle = withA(css("--accent"), 0.14); x.fillRect(x0, 0, x1 - x0, H);
    x.strokeStyle = css("--accent"); x.lineWidth = 1.5; x.strokeRect(x0 + 0.75, 0.75, x1 - x0 - 1.5, H - 1.5);
  }
  // the edit cursor, and the playhead while playing
  x.fillStyle = withA(dim, 0.9); x.fillRect(Math.round(X(nv.c)), 0, 1, H);
  if (nv.pl) { x.fillStyle = text; x.fillRect(Math.round(X(nv.p)) - 0.5, 0, 2, H); }
}
(function wireNav() {
  const el = $("nav"), cv = el.querySelector("canvas");
  const at = e => {
    const r = cv.getBoundingClientRect();
    return { t: Math.max(0, (e.clientX - r.left) / Math.max(1, r.width) * navExt()), y: e.clientY - r.top, px: e.clientX };
  };
  const moveBox = p => {
    const bx = navBox(); if (!bx) return;
    const w = bx.b - bx.a;
    const a = Math.max(0, Math.min(navExt() - w, p.t - navDrag.off));
    navHold = { a, t: Date.now() };
    send("navview", a.toFixed(3));
    drawNav();
  };
  el.addEventListener("pointerdown", e => {
    if (!nav || !vals || !vals.nv) return;
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const p = at(e), bx = navBox();
    const tol = 12 / Math.max(1, cv.clientWidth) * navExt();
    const inBox = bx && p.y >= NAV_RB && p.t >= bx.a - tol && p.t <= bx.b + tol;
    navDrag = { x0: p.px, moved: false, band: p.y < NAV_RB, box: inBox, off: inBox ? p.t - bx.a : 0 };
  });
  el.addEventListener("pointermove", e => {
    if (!navDrag || !el.hasPointerCapture(e.pointerId)) return;
    const p = at(e);
    if (!navDrag.moved && Math.abs(p.px - navDrag.x0) > 8) {
      navDrag.moved = true;
      if (!navDrag.box) { const bx = navBox(); navDrag.off = bx ? (bx.b - bx.a) / 2 : 0; }
    }
    if (navDrag.moved) moveBox(p);
  });
  const up = e => {
    if (!navDrag) return;
    const d = navDrag; navDrag = null;
    if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
    if (d.moved || e.type === "pointercancel") return;
    const p = at(e);
    if (d.band) {
      const r = (nav.rg || []).find(r => p.t >= r.s && p.t <= r.e);
      if (r) { send("navgo", r.s.toFixed(3)); return; }
    }
    send("navgo", p.t.toFixed(3));
  };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
})();
setInterval(() => { if (showNav) send("nav", 1); }, 3000);

// ---------------------------------------------------------------------------
// the mixer
// ---------------------------------------------------------------------------
// Below the plugins, behind a divider: drag it and it snaps to closed, half
// or full; tap it to open to half or close. Remembered per device. The
// bridge only sends the mixer's values while it's open (verb mix).
let mixState = "closed";
try { mixState = localStorage.getItem("tscv.mix") || "closed"; } catch (e) {}
const mixAvail = () => $("main").offsetHeight + $("mix").offsetHeight;
function applyMix(stateOrPx, rebuild = true) {
  const mix = $("mix"), app = $("app");
  const avail = app.classList.contains("mixfull") ? $("mix").offsetHeight + $("main").offsetHeight : mixAvail();
  let px;
  if (typeof stateOrPx === "number") px = stateOrPx;
  else {
    mixState = stateOrPx;
    try { localStorage.setItem("tscv.mix", mixState); } catch (e) {}
    px = mixState === "full" ? avail : mixState === "half" ? Math.round(avail / 2) : 0;
  }
  app.classList.toggle("mixfull", typeof stateOrPx !== "number" && mixState === "full");
  if (typeof stateOrPx !== "number") app.classList.toggle("mixopen", mixState !== "closed");
  mix.style.height = px + "px";
  mix.classList.toggle("open", px > 0);
  if (rebuild && typeof stateOrPx !== "number") {
    send("mix", mixState === "closed" ? 0 : 1);
    if (layout) { buildPanels(); buildStrip(); buildMixer(); render(); }
  }
}
setInterval(() => { if (mixState !== "closed") send("mix", 1); }, 3000);
(function wireDivider() {
  const d = $("mdiv");
  let sy = 0, sh = 0, avail = 0, moved = false;
  d.addEventListener("pointerdown", e => {
    e.preventDefault(); d.setPointerCapture(e.pointerId);
    sy = e.clientY; sh = $("mix").offsetHeight; moved = false;
    $("app").classList.remove("mixfull");
    avail = mixAvail();
  });
  d.addEventListener("pointermove", e => {
    if (!d.hasPointerCapture(e.pointerId)) return;
    const dy = sy - e.clientY;
    if (Math.abs(dy) > 6) moved = true;
    if (moved) applyMix(Math.max(0, Math.min(avail, sh + dy)), false);
  });
  const up = e => {
    if (!d.hasPointerCapture(e.pointerId)) return;
    d.releasePointerCapture(e.pointerId);
    if (!moved) { applyMix(mixState === "closed" ? "half" : "closed"); return; }
    const hpx = $("mix").offsetHeight, f = hpx / Math.max(1, avail);
    applyMix(f < 0.25 ? "closed" : f > 0.75 ? "full" : "half");
  };
  d.addEventListener("pointerup", up);
  d.addEventListener("pointercancel", up);
})();

const lvPct = db => Math.max(0, Math.min(100, (db + 60) / 60 * 100));

    const bm = h("button", "m", "M"), bs = h("button", "s", "S");
    const sw = (b, key) => { b.dataset.sw = key; b.dataset.i = i; };

    let br = null, bp = null, bi = null, r2 = null;
    if (!master) {
      br = h("button", "r", "R"); sw(br, "arm");

      r2 = h("div", "mrow");

      bi = h("button", "i", "–"); bi.addEventListener("click", () => send("tmon", i));

    }

    dragger(pb, () => pvv, v => { pvv = v; pan.set(v); touch("mp" + i, v); send("tpan", i, (v * 2 - 1).toFixed(3)); },
      { travel: 200, reset: () => send("tpan0", i) });
    dragger(fdr.node, () => fvv, v => { fvv = v; fdr.set(v); touch("mv" + i, v); send("tvol", i, v.toFixed(4)); },
      { travel: () => fdr.node.clientHeight, reset: () => send("tvol0", i) });
    mix.append(el);
    ui.mix.set(i, { el, pan, pv, fdr, mlv, mrv, vdb, bm, bs, br, bp, bi,

// Mute, solo and record arm take a swipe, as on the desktop: press one and
// drag along the row, and every one of the same kind you cross follows the
// first. Not phase or monitoring -- a stray drag flipping six tracks'
// polarity is a bad afternoon.
(function wireSwipe() {
  const mix = $("mix");
  let sw = null;
  const hit = (key, x, y) => {
    const el = document.elementFromPoint(x, y);
    const b = el && el.closest && el.closest("[data-sw]");
    return b && b.dataset.sw === key ? b : null;
  };
  const apply = b => {
    const i = +b.dataset.i;
    if (sw.done.has(i)) return;
    sw.done.add(i);
    b.classList.toggle("on", sw.want);
    touch("sw" + sw.key + i, sw.want);
    send("tset", i, sw.key, sw.want ? 1 : 0);
  };
  mix.addEventListener("pointerdown", e => {
    const b = e.target.closest && e.target.closest("[data-sw]");
    if (!b) return;
    e.preventDefault();
    mix.setPointerCapture(e.pointerId);
    sw = { key: b.dataset.sw, want: !b.classList.contains("on"), done: new Set(), id: e.pointerId };
    apply(b);
  });
  mix.addEventListener("pointermove", e => {
    if (!sw || e.pointerId !== sw.id) return;
    const b = hit(sw.key, e.clientX, e.clientY);
    if (b) apply(b);
  });
  const end = e => { if (sw && e.pointerId === sw.id) sw = null; };
  mix.addEventListener("pointerup", end);
  mix.addEventListener("pointercancel", end);
})();

function renderMixer() {

// Rebuild after a trace opens or closes. The row stays where it was; if the

function buildPanel(p, bodyH) {
  if (p.eq) return buildEq(p, bodyH);

// A choice's position: the bridge sends each one's own (cn), since a list
// can skip positions; evenly spaced only as a fallback.
const choiceNorm = (c, i) => (c.cn && c.cn[i] != null) ? c.cn[i] : (c.ch.length > 1 ? i / (c.ch.length - 1) : 0);
function nearestChoice(c, v) {
  let best = 0, bd = 9;
  c.ch.forEach((_, i) => { const d = Math.abs(choiceNorm(c, i) - v); if (d < bd) { bd = d; best = i; } });
  return best;
}

const B64V = new Int16Array(128).fill(-1);
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_".split("").forEach((c, i) => B64V[c.charCodeAt(0)] = i);
const withA = (col, a) => {
  const m = /^#?([0-9a-f]{6})/i.exec(col || "");
  if (!m) return col;
  const n = parseInt(m[1], 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};

// The columns the bridge sends (TS_CV_Trace's, packed): output peaks and
// troughs and input peaks a character each as a share of full scale, the
// reduction two characters in 1/64 dB. Drawn as ChannelView's window draws it.
function drawTrace(G, t, gr, est, range, win) {
  const cv = G.cv, dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  if (!G.col) {
    const cs = getComputedStyle(G.pnl);
    const v = n => cs.getPropertyValue(n).trim();
    G.col = { dim: v("--dim"), value: v("--value"), ring: v("--ring"), grm: v("--grm"), bi: v("--fill-bi") };
  }
  const K = G.col, x = cv.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, W, H);
  x.fillStyle = "rgba(0,0,0,0.22)";
  x.beginPath(); x.roundRect ? x.roundRect(0.5, 0.5, W - 1, H - 1, 2) : x.rect(0.5, 0.5, W - 1, H - 1); x.fill();
  x.strokeStyle = withA(K.ring, 0.56); x.lineWidth = 1; x.stroke();
  x.font = "10px -apple-system, system-ui, sans-serif";
  x.textBaseline = "middle"; x.textAlign = "center";
  if (!t || t.m) {
    x.fillStyle = K.dim;
    const m1 = t ? t.m : "connecting…", m2 = t && t.m2;
    x.fillText(m1, W / 2, H / 2 - (m2 ? 6 : 0));
    if (m2) x.fillText(m2, W / 2, H / 2 + 7);
  } else {
    const N = t.o.length, ix0 = 2, pw = W - 4, cw = pw / N;
    const mid = H / 2, hh = (H - 6) / 2, top = 2, gh = H - 4;
    if (t.b > 1) {
      x.fillStyle = withA(K.ring, 0.38);
      for (let b = 1; b < t.b; b++) x.fillRect(Math.floor(ix0 + pw * b / t.b), 1, 1, H - 2);
    }
    x.fillStyle = withA(K.ring, 0.31); x.fillRect(ix0, Math.floor(mid), pw, 1);
    const q = (s, k) => (B64V[s.charCodeAt(k)] || 0) / 63;
    x.fillStyle = withA(K.dim, 0.27);
    for (let k = 0; k < N; k++) {
      const e = Math.min(1, q(t.i, k)) * hh;
      if (e > 0) x.fillRect(ix0 + k * cw, mid - e, cw + 0.3, 2 * e);
    }
    x.fillStyle = withA(K.value, 0.66);
    for (let k = 0; k < N; k++) {
      let y0 = mid - q(t.o, k) * hh, y1 = mid + q(t.u, k) * hh;
      if (y1 - y0 < 1) { y0 = mid - 0.5; y1 = mid + 0.5; }
      x.fillRect(ix0 + k * cw, y0, cw + 0.3, y1 - y0);
    }
    const gc = est ? K.grm : K.bi;
    const pts = [];
    x.fillStyle = withA(gc, 0.14);
    for (let k = 0; k < N; k++) {
      const a = B64V[t.g.charCodeAt(2 * k)], b = B64V[t.g.charCodeAt(2 * k + 1)];
      if (a < 0 || b < 0) continue;
      const db = (a * 64 + b) / 64;
      const gy = top + Math.min(1, Math.max(0, db) / range) * gh;
      const xx = ix0 + (k + 0.5) * cw;
      if (gy > top + 0.5) x.fillRect(ix0 + k * cw, top, cw + 0.3, gy - top);
      pts.push(xx, gy);
    }
    if (pts.length > 2) {
      x.strokeStyle = gc; x.lineWidth = 1.6; x.lineJoin = "round";
      x.beginPath(); x.moveTo(pts[0], pts[1]);
      for (let k = 2; k < pts.length; k += 2) x.lineTo(pts[k], pts[k + 1]);
      x.stroke();
    }
  }
  x.textAlign = "right"; x.textBaseline = "alphabetic";
  x.fillStyle = K.dim;
  x.fillText(grvLabel(win), W - 4, H - 4);
}

// Press and hold a panel's header, then drag it along the row. The marker

function wirePanelDrag(pnl, p) {
  const head = pnl.querySelector(".ph");

  const row = $("row");
  const tops = () => [...row.querySelectorAll(".pnl")].map(el => ({ el, p: (layout.fx || []).find(f => f.g === el.dataset.g) }))
    .filter(t => t.p && t.p.ti != null);
  const gapAt = x => {
    const ts = tops();
    for (const t of ts) {
      const r = t.el.getBoundingClientRect();
      if (x < r.left + r.width / 2) return { gap: t.p.ti, x: r.left };

  const cancel = () => { clearTimeout(timer); timer = null; };
  head.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;

    cancel();
    timer = setTimeout(() => {

      head.setPointerCapture(pid);
      pnl.classList.add("lift");
      if (navigator.vibrate) navigator.vibrate(10);
    }, 380);
  });
  head.addEventListener("pointermove", e => {
    if (!dragging) {
      if (Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel();
      return;
    }
    e.preventDefault();
    const g = gapAt(e.clientX);
    const drop = $("drop");
    if (!g) return;
    gap = g.gap;
    const rr = row.getBoundingClientRect();
    drop.style.left = (g.x - rr.left + row.scrollLeft - 4) + "px";
    drop.style.display = "block";

    if (e.clientX > rr.right - 40) row.scrollLeft += 12;
    else if (e.clientX < rr.left + 40) row.scrollLeft -= 12;

  const end = () => {
    cancel();
    if (!dragging) return;
    dragging = false;
    pnl.classList.remove("lift");
    $("drop").style.display = "none";
    if (gap != null && gap !== p.ti && gap !== p.ti + 1) send("fxmove", p.g, gap);
    gap = null;
  };
  head.addEventListener("pointerup", end);
  head.addEventListener("pointercancel", end);
}

// The add-a-plugin sheet: search plus your FX folders, categories and
// developers, as the desktop picker has. `at` is the top-level slot to

let fxSeq = 0;

  let kind = "", val = "", timer = null;
  openSheet(sh => {
    sh.classList.add("pk");

    const q = h("input", "fld"); q.placeholder = "Search plugins (e.g. fab sat)";

    sel.append(new Option("All plugins", ""));
    flt.append(sel);

    sh.append(q, flt, res);
    let treeLoaded = false;
    const fillTree = tree => {
      if (treeLoaded || !tree) return;

      const group = (label, list, k, useId) => {
        if (!list || !list.length) return;
        const g = document.createElement("optgroup"); g.label = label;

      send("fxfind", mine, clean(q.value), kind, clean(val));
      for (let k = 0; k < 30 && mine === fxSeq; k++) {
        await new Promise(r => setTimeout(r, 120));

          const r = await reaper(`GET/EXTSTATE/${NS}/fxfound`);
          const f = r.ext.fxfound ? JSON.parse(r.ext.fxfound) : null;
          if (!f || f.s !== mine) continue;

          res.innerHTML = "";

          if (!f.r.length) res.append(h("div", "lbl", "Nothing found"));
          for (const e of f.r) {
            if (e.r && !recentHdr) { res.append(h("div", "hdr", "Recent")); recentHdr = true; }
            if (!e.r && recentHdr && !allHdr) { res.append(h("div", "hdr", "All")); allHdr = true; }

              if (fc) { fm.style.background = fc.bg; fm.style.color = fc.fg; fm.style.borderColor = fc.bg; }
              o.append(fm);

            o.addEventListener("click", () => { send("fxadd", encodeURIComponent(e.id), at); closeSheet(); });

}

// ---------------------------------------------------------------------------
// ReaEQ -- the canvas the desktop draws (TS_CV_EQPanel), at touch size
// ---------------------------------------------------------------------------
// The curve is computed here from the bands the bridge reads: RBJ cookbook
// biquads, with ReaEQ's inverted Q, exactly as TS_CV_ReaEQ.coeffs does.
const BT = { HP: 0, LS: 1, BELL: 2, NOTCH: 3, HS: 4, LP: 5, BP: 6, PBP: 7 };

function coeffs(bt, f, g, q, sr) {

  else if (bt === BT.LP) { b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = b0; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha; }
  else if (bt === BT.NOTCH) { b0 = 1; b1 = -2 * cw; b2 = 1; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha; }
  else if (bt === BT.BP || bt === BT.PBP) { b0 = alpha; b1 = 0; b2 = -alpha; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha; }
  else if (bt === BT.LS || bt === BT.HS) {

    if (bt === BT.LS) {

    } else {
      b0 = A * ((A + 1) + (A - 1) * cw + 2 * sq * sa); b1 = -2 * A * ((A - 1) + (A + 1) * cw);
      b2 = A * ((A + 1) + (A - 1) * cw - 2 * sq * sa); a0 = (A + 1) - (A - 1) * cw + 2 * sq * sa;
      a1 = 2 * ((A - 1) - (A + 1) * cw); a2 = (A + 1) - (A - 1) * cw - 2 * sq * sa;
    }

const bandHue = i => (200 + i * 137.5) % 360;
const bandCol = (i, a) => `hsla(${bandHue(i)}, 62%, 58%, ${a == null ? 1 : a})`;

function buildEq(p, bodyH) {
  const w = EQ_W + PAD * 2;
  const pnl = h("div", "pnl");
  pnl.style.width = w + "px";
  const head = h("div", "ph");
  const byp = h("button", "hb"); byp.innerHTML = `<svg viewBox="0 0 24 24">${ICON.power}</svg>`;
  byp.addEventListener("click", () => send("byp", p.g));
  const flt = h("button", "hb fl"); flt.innerHTML = `<svg viewBox="0 0 24 24">${ICON.float}</svg>`;
  flt.addEventListener("click", () => send("float", p.g));
  const col = h("button", "hb col"); col.innerHTML = `<svg viewBox="0 0 24 24">${ICON.collapse}</svg>`;
  col.addEventListener("click", () => {
    if (shut.has(p.g)) shut.delete(p.g); else shut.add(p.g);
    saveShut(); pnl.classList.toggle("shut", shut.has(p.g));
  });
  if (shut.has(p.g)) pnl.classList.add("shut");
  head.append(h("span", "ix", p.i), h("span", "nm", p.n), moreBtn(p), col, flt, byp);
  const body = h("div", "pb");
  pnl.append(head, body);
  const cv = h("canvas", "eqc");
  const ch = Math.max(120, bodyH - EQ_STRIP - 8);
  const dpr = window.devicePixelRatio || 1;
  cv.width = EQ_W * dpr; cv.height = ch * dpr; cv.style.height = ch + "px"; cv.style.width = EQ_W + "px";
  const strip = h("div", "eqs");
  body.append(cv, strip);

  const R = layout.eqr || { lo: 20, hi: 20000, g: 18 }, sr = layout.sr || 48000;
  const st = { bands: [], master: 0, sel: null, drag: null, over: new Map(), tap: null };
  const key = b => b.t + ":" + b.i;
  const X = f => Math.log(Math.max(R.lo, Math.min(R.hi, f)) / R.lo) / Math.log(R.hi / R.lo) * EQ_W;
  const F = x => R.lo * Math.pow(R.hi / R.lo, Math.max(0, Math.min(1, x / EQ_W)));
  const top = 10, gh = ch - 20;
  const Y = db => top + gh / 2 - (db / R.g) * gh / 2;
  const G = y => (top + gh / 2 - y) / (gh / 2) * R.g;

  // A band as the user is moving it wins over what the bridge last read,
  // until the bridge catches up or the finger has been still a moment.
  function bandsNow() {
    const now = Date.now();
    return st.bands.map(b => {
      const o = st.over.get(key(b));
      if (o && now - o.t < 700) return Object.assign({}, b, o.v);
      return b;
    });
  }

  function draw() {
    const c = cv.getContext("2d");
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, EQ_W, ch);
    c.fillStyle = "rgba(0,0,0,0.22)"; c.fillRect(0, 0, EQ_W, ch);
    // The track's spectrum behind it all, as the desktop draws it: from
    // Track Analyser's probe when it's running (vals.sp), filled to the
    // bottom of the canvas -- a level backdrop, not another gain curve.
    const sp = vals && vals.sp;
    if (sp && sp.d && sp.d.length > 1) {
      const n = sp.d.length, sc = css("--spec");
      c.beginPath(); c.moveTo(0, ch);
      for (let i = 0; i < n; i++) {
        const f = sp.lo * Math.pow(sp.hi / sp.lo, (i + 0.5) / n);
        c.lineTo(X(f), ch - Math.max(0, B64V[sp.d.charCodeAt(i)]) / 63 * ch);
      }
      c.lineTo(EQ_W, ch); c.closePath();
      c.fillStyle = withA(sc, 0.19); c.fill();
      c.beginPath();
      for (let i = 0; i < n; i++) {
        const f = sp.lo * Math.pow(sp.hi / sp.lo, (i + 0.5) / n);
        const y = ch - Math.max(0, B64V[sp.d.charCodeAt(i)]) / 63 * ch;
        if (i) c.lineTo(X(f), y); else c.moveTo(X(f), y);
      }
      c.strokeStyle = withA(sc, 0.56); c.lineWidth = 1; c.stroke();
    }
    c.lineWidth = 1;
    c.strokeStyle = css("--ring"); c.globalAlpha = 0.5;
    c.font = "11px -apple-system, system-ui, sans-serif"; c.fillStyle = css("--dim");
    for (const f of [50, 100, 200, 500, 1000, 2000, 5000, 10000]) {
      const x = Math.round(X(f)) + 0.5;
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x, ch); c.stroke();
      c.globalAlpha = 0.9; c.fillText(f >= 1000 ? f / 1000 + "k" : String(f), x + 3, ch - 4); c.globalAlpha = 0.5;
    }
    for (let d = -R.g; d <= R.g; d += 6) {
      const y = Math.round(Y(d)) + 0.5;
      c.globalAlpha = d === 0 ? 0.9 : 0.4;
      c.beginPath(); c.moveTo(0, y); c.lineTo(EQ_W, y); c.stroke();
      if (d !== 0) { c.globalAlpha = 0.9; c.fillText((d > 0 ? "+" : "") + d, 4, y - 3); }
    }
    c.globalAlpha = 1;
    const bands = bandsNow();
    const N = 220, xs = [], y0 = Y(0);
    for (let i = 0; i < N; i++) xs.push(i / (N - 1) * EQ_W);
    bands.forEach((b, bi) => {
      if (!b.e) return;
      const ys = xs.map(x => Y(Math.max(-R.g * 1.5, Math.min(R.g * 1.5, bandDb(b, F(x), sr)))));
      c.beginPath(); c.moveTo(xs[0], y0);
      xs.forEach((x, i) => c.lineTo(x, ys[i]));
      c.lineTo(xs[N - 1], y0); c.closePath();
      c.fillStyle = bandCol(bi, 0.16); c.fill();
      c.beginPath(); xs.forEach((x, i) => i ? c.lineTo(x, ys[i]) : c.moveTo(x, ys[i]));
      c.strokeStyle = bandCol(bi, 0.7); c.lineWidth = 1.2; c.stroke();
    });

    c.beginPath(); xs.forEach((x, i) => i ? c.lineTo(x, tot[i]) : c.moveTo(x, tot[i]));

    if (sig === stripSig) return;
    stripSig = sig;
    strip.innerHTML = "";

      st.sel = null;
      strip.append(h("span", null, "Double-tap to add a band · drag a node to move it · tap one to select"));
      return;
    }
    const b = bands[bi];
    const dot = h("span", "dot"); dot.style.background = bandCol(bi);
    const tb = h("button", null, BT_NAME[b.t] || "Band");
    tb.addEventListener("click", () => openSheet(sh => {
      sh.append(h("h3", null, "Band type"));
      for (const t of BT_MENU) {
        const o = h("button", "opt" + (t === b.t ? " cur" : ""), BT_NAME[t]);
        o.addEventListener("click", () => { if (t !== b.t) { send("eqtype", p.g, b.t, b.i, t); st.sel = null; } closeSheet(); });
        sh.append(o);
      }
    }));
    const qd = h("div", "qd", "Q " + b.q.toFixed(2));
    let q0 = b.q, x0 = 0;
    qd.addEventListener("pointerdown", e => { e.preventDefault(); qd.setPointerCapture(e.pointerId); x0 = e.clientX; q0 = bandsNow()[bi].q; st.qdrag = true; });
    qd.addEventListener("pointerup", () => { st.qdrag = false; });
    qd.addEventListener("pointercancel", () => { st.qdrag = false; });
    qd.addEventListener("pointermove", e => {
      if (!qd.hasPointerCapture(e.pointerId)) return;

      st.over.set(key(b), { t: Date.now(), v: Object.assign({}, (st.over.get(key(b)) || {}).v, { q }) });
      qd.textContent = "Q " + q.toFixed(2);
      send("eqq", p.g, b.t, b.i, q.toFixed(3)); draw();
    });
    const rd = h("span", "rd", fmtHz(b.f) + (HAS_GAIN[b.t] ? "   " + (b.g > 0 ? "+" : "") + b.g.toFixed(1) + " dB" : ""));
    const rm = h("button", "rm", "Remove");
    rm.addEventListener("click", () => { send("eqrem", p.g, b.t, b.i); st.sel = null; stripSig = null; paintStrip(); });

    const now = Date.now();
    if (st.tap && now - st.tap.t < 350 && Math.hypot(st.tap.x - x, st.tap.y - y) < 30) {
      st.tap = null;
      send("eqadd", p.g, F(x).toFixed(1), Math.max(-R.g, Math.min(R.g, G(y))).toFixed(2));
    } else {
      st.tap = { t: now, x, y };

    if (HAS_GAIN[st.drag.t]) v.g = g;
    st.over.set(st.drag.k, { t: Date.now(), v: Object.assign({}, (st.over.get(st.drag.k) || {}).v, v) });
    send("eqf", p.g, st.drag.t, st.drag.i, f.toFixed(1));
    if (HAS_GAIN[st.drag.t]) send("eqg", p.g, st.drag.t, st.drag.i, g.toFixed(2));
    draw();
  });
  cv.addEventListener("pointerup", () => { st.drag = null; });

  const P = { p, ctl: [], byp, head, grEl: null, pl: null,
    eq(ev) {
      if (!ev) return;
      st.bands = ev.b || []; st.master = ev.m || 0;
      draw();
      if (!st.drag && !st.qdrag) paintStrip();
    } };
  ui.panels.set(p.g, P);
  paintStrip();
  requestAnimationFrame(draw);
  return pnl;
}

function pickChoice(c, cur, set) {
  const list = c.ch || [];
  if (!list.length) return;
  openSheet(sh => {
    sh.append(h("h3", null, c.l || "Choose"));
    const at = nearestChoice(c, cur);
    list.forEach((name, i) => {
      const o = h("button", "opt" + (i === at ? " cur" : ""), String(name));
      o.addEventListener("click", () => { set(choiceNorm(c, i)); closeSheet(); });
      sh.append(o);
    });

}

// ---------------------------------------------------------------------------
// rendering the values
// ---------------------------------------------------------------------------
function render() {
  renderStatus();
  renderTransport();
  renderMacros();
  if (showNav) drawNav();
  if (!vals || !layout) return;
  for (const [g, P] of ui.panels) {
    const fv = vals.fx && vals.fx[g];
    if (!fv) continue;
    const byp = fv.e === false;
    P.byp.classList.toggle("on", byp);
    P.head.style.background = byp ? "var(--head-byp)" : (P.pl ? P.pl.head : "");
    for (const e of P.ctl) {
      const l = held(e.id);
      const v = l ? l.v : (fv.v[e.c.idx] || 0);
      const x = fv.x[e.c.idx] || "";
      e.set(v, x);
      if (e.val) e.val.textContent = layout.vals === false ? "" : x;
    }
    if (P.eq) P.eq(fv.eq);
    if (P.grEl) {
      const gr = fv.gr || 0, range = Math.max(P.p.gr || 18, gr);
      P.grEl.fill.style.height = `calc(${Math.min(100, gr / range * 100)}% - 4px)`;
      P.grEl.fill.style.background = fv.est ? "var(--grm)" : "var(--fill-bi)";
      P.grEl.gv.textContent = gr >= 0.05 ? gr.toFixed(1) : "–";
      if (P.grEl.cv) drawTrace(P.grEl, fv.tw, gr, fv.est, range, grv.get(g) || P.p.gw);
    }
  }
  if (ui.sends) {
    (vals.s || []).forEach((sv, i) => ui.sends[0][i] && ui.sends[0][i].set(sv));
    (vals.r || []).forEach((sv, i) => ui.sends[-1][i] && ui.sends[-1][i].set(sv));
  }
  renderMixer();
  const t = vals.tr, S = ui.strip;
  if (t && S) {
    const pl = held("pan"), vl = held("vol");
    const pan = pl ? pl.v : (t.pan + 1) / 2;
    S.pan.set(pan); S.setPan(pan);
    S.panLbl.textContent = Math.abs(t.pan) < 0.005 ? "C" : (Math.round(Math.abs(t.pan) * 100) + (t.pan < 0 ? "L" : "R"));
    const f = vl ? vl.v : t.f;
    S.fdr.set(f); S.setVol(f);
    S.vdb.textContent = t.db + " dB";
    const lv = db => Math.max(0, Math.min(100, (db + 60) / 60 * 100));
    S.mlv.style.height = lv(t.pl) + "%"; S.mrv.style.height = lv(t.pr) + "%";
    const col = db => db >= 0 ? "var(--over)" : db >= -6 ? "var(--clip)" : "var(--lo)";
    S.mlv.style.background = col(t.pl); S.mrv.style.background = col(t.pr);
    S.bm.classList.toggle("on", !!t.m); S.bs.classList.toggle("on", !!t.s); S.br.classList.toggle("on", !!t.r);
    if (S.bp) S.bp.classList.toggle("on", !!t.ph);
    if (S.bi) {
      S.bi.textContent = MON_TXT[t.mo || 0];
      S.bi.classList.toggle("on", t.mo === 1); S.bi.classList.toggle("au", t.mo === 2);
    }
  }
}

function renderTransport() {
  if (!ui.tb || !transport) return;
  const ps = +transport[1];
  ui.tb.play.classList.toggle("on", (ps & 1) === 1 && ps !== 5);
  ui.tb.pause.classList.toggle("on", (ps & 2) === 2);
  ui.tb.rec.classList.toggle("on", (ps & 4) === 4);
  ui.tb.loop.classList.toggle("on", transport[3] === "1");
  ui.tb.metro.classList.toggle("on", macroStates["40364"] === 1);
  const clock = $("clock");
  if (beat) {
    const meas = (+beat[4]) + 1, inb = +beat[5];
    clock.firstChild.textContent = `${meas}.${(Math.floor(inb) + 1)}.${String(Math.floor((inb % 1) * 100)).padStart(2, "0")}`;
  }
  const secs = +transport[2];
  const m = Math.floor(secs / 60), s = secs - m * 60;
  clock.lastChild.textContent = `${m}:${s.toFixed(3).padStart(6, "0")}`;
}

function renderMacros() {
  for (const m of macros) if (m.el) m.el.classList.toggle("on", macroStates[m.a] === 1 && !macroEdit);
}

function renderStatus() {
  const st = $("status"), ban = $("banner");
  if (!st) return;
  let msg = "";
  if (!reachable) msg = "Can't reach REAPER. Is the web interface still running?";
  else if (!aliveVal || Date.now() - aliveAt > 2500) msg = "Start TS_ChannelView_Web in REAPER to see the panels (Actions list).";
  st.className = msg ? "bad" : "ok";
  ban.textContent = msg;
  ban.style.display = msg ? "block" : "none";
}

// ---------------------------------------------------------------------------
// go
// ---------------------------------------------------------------------------
buildTransport();
loadMacros();
let resizeTimer = null;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { applyMix(mixState, false); layout && build(); }, 150); });
applyMix(mixState, false);
if (mixState !== "closed") send("mix", 1);
if (showNav) send("nav", 1);
setInterval(poll, 70);
poll();
</script>
