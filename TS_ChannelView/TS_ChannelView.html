<link rel="manifest" href="TS_ChannelView.webapp.json">
<!--
  TS_ChannelView.html -- ChannelView in a browser, for a tablet beside the desk.

  Served by REAPER's own web interface (Preferences > Control/OSC/web > Add >
  Web browser interface). Transport and actions go straight to REAPER; the
  plugin panels go through TS_ChannelView_Web.lua, which must be running in
  REAPER (see its header for the ExtState protocol).
-->
<style>
:root {
  --win: #15171a; --panel: #202327; --border: #2d3136; --head: #1a1c20; --head-byp: #3a2420; --head-off: #2f4a63;
  --text: #dfe2e6; --dim: #868b92; --label: #a6abb2; --value: #dfe2e6;
  --track: #34383d; --fill: #4aa3df; --fill-bi: #d9893a; --body: #2a2d32; --pointer: #f0f1f2;
  --ring: #454a50; --toff: #2c3035; --ton: #4aa3df; --ttext: #e4e6e9; --accent: #4aa3df;
  --strip: #181a1d; --sel: #4aa3df; --grm: #d2609b; --cap: #c9ccd0; --byp: #d9673a;
  --mute: #d9673a; --solo: #d9b23a; --rec: #d9433a; --warn: #d9673a; --mon: #4f9c62; --mauto: #4a8fd9; --spec: #5d6f80; --lo: #4f9c62; --clip: #d9493a; --over: #ff3a3a;
  --brkp: #4aa3df; --brkc: #c58fd6;
  --sw: 100px; --tb-h: 64px; --mac-h: 58px; --trk-h: 54px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--win); color: var(--text);
  font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; font-size: 13px;
  overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; }
/* The bottom safe area (the home indicator) goes to the track bar, which
   carries its background down into it, rather than to an empty band. */
#app { display: flex; flex-direction: column; height: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }

/* transport */
/* three parts: the location and markers on the left, the transport itself
   centred, the view switches on the right */
#tb { height: var(--tb-h); flex-shrink: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 6px; padding: 0 10px; background: var(--strip); border-bottom: 1px solid var(--border); }
#tb .tl, #tb .tc, #tb .tr { display: flex; align-items: center; gap: 6px; min-width: 0; }
#tb .tr { justify-content: flex-end; }
.tbtn { width: 48px; height: 46px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel);
  display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0; }
.tbtn svg { width: 22px; height: 22px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tbtn.on { background: var(--accent); border-color: var(--accent); }
.tbtn.on svg { stroke: #fff; }
.tbtn.rec.on { background: var(--rec); border-color: var(--rec); }
.tbtn.play.on { background: var(--lo); border-color: var(--lo); }
.tbtn:active { filter: brightness(1.3); }
.tsep { width: 10px; flex-shrink: 0; }
/* The transport as the desktop theme draws it: square buttons, a big round
   play with record and loop hugging it on concave edges, filled colour
   when on (record red, play green, loop blue, pause amber). */
.tb2 { width: 50px; height: 46px; padding: 0; border: 0; background: none; flex-shrink: 0; cursor: pointer; }
.tb2 svg, .tcl { display: block; overflow: visible; }
.tcl { flex-shrink: 0; margin: 0 2px; }
.tcl g { cursor: pointer; }
.tsh { fill: var(--panel); stroke: var(--border); stroke-width: 1.2; }
.tic { fill: var(--label); }
.tics { fill: none; stroke: var(--label); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.trec .tic { fill: var(--rec); }
.on.trec .tsh { fill: var(--rec); stroke: rgba(0,0,0,0.35); }
.on.tplay .tsh { fill: var(--lo); stroke: rgba(0,0,0,0.35); }
.on.tloop .tsh { fill: var(--accent); stroke: rgba(0,0,0,0.35); }
.on.tpause .tsh { fill: var(--solo); stroke: rgba(0,0,0,0.35); }
.on .tic { fill: #111; } .on .tics { stroke: #111; }
.tb2:active svg, .tcl g:active { filter: brightness(1.35); }
#clock { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-width: 140px;
  margin-right: 6px; flex-shrink: 0; }
#clock .big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
#clock .small { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
#status { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); flex-shrink: 0; margin-left: 4px; }
#status.ok { background: var(--lo); } #status.bad { background: var(--rec); }

/* macros */
/* centred, and onto a second row (or more) when they don't fit in one */
#mac { flex-shrink: 0; min-height: var(--mac-h); box-sizing: border-box; display: flex; flex-wrap: wrap;
  align-items: center; justify-content: center; gap: 6px; padding: 7px 10px;
  background: var(--head); border-bottom: 1px solid var(--border); }
#mac.hidden { display: none; }
/* the navigator: the whole session in a strip, above the transport */
#nav { height: 116px; flex-shrink: 0; position: relative; background: var(--strip);
  border-bottom: 1px solid var(--border); touch-action: none; }
#nav.hidden { display: none; }
#route.hidden { display: none; }
#nav canvas { position: absolute; left: 10px; right: 10px; top: 6px; bottom: 6px; width: calc(100% - 20px);
  height: calc(100% - 12px); display: block; }
.mbtn { height: 42px; min-width: 84px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--panel); flex-shrink: 0; cursor: pointer; position: relative; border-bottom-width: 3px; }
.mbtn.on { background: var(--accent); color: #fff; }
/* ChannelView's own icons (TS_CV_ActionIcons.json), drawn in the text colour */

  box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--ton) 75%, #fff), inset 0 0 10px color-mix(in srgb, var(--ton) 55%, transparent),

.cmb { margin-top: 10px; height: 38px; border-radius: 6px; border: 1px solid var(--ring); background: var(--toff);
  color: var(--ttext); font-size: 12px; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
.cmb.raised { border-color: rgba(0,0,0,0.6); background: linear-gradient(180deg, color-mix(in srgb, var(--toff) 88%, #fff), var(--toff)); }
.rule { position: absolute; width: 1px; background: var(--ring); }
.xyp { position: relative; margin: 2px auto 0; border-radius: 5px; background-color: rgba(0,0,0,0.35);
  border: 1px solid rgba(0,0,0,0.6); box-shadow: inset 0 1px 2px rgba(0,0,0,0.35); touch-action: none; overflow: hidden;
  background-image: linear-gradient(90deg, transparent calc(50% - 0.5px), rgba(255,255,255,0.13) calc(50% - 0.5px), rgba(255,255,255,0.13) calc(50% + 0.5px), transparent calc(50% + 0.5px)),
    linear-gradient(0deg, transparent calc(50% - 0.5px), rgba(255,255,255,0.13) calc(50% - 0.5px), rgba(255,255,255,0.13) calc(50% + 0.5px), transparent calc(50% + 0.5px)),
    linear-gradient(90deg, rgba(255,255,255,0.06) 1px, transparent 1px), linear-gradient(0deg, rgba(255,255,255,0.06) 1px, transparent 1px);
  background-size: 100% 100%, 100% 100%, 25% 25%, 25% 25%; background-position: 0 0, 0 0, -1px 0, 0 1px; }
.xyp .xv, .xyp .xh { position: absolute; background: var(--xc); opacity: 0.45; pointer-events: none; }
.xyp .xv { top: 0; bottom: 0; width: 1px; }
.xyp .xh { left: 0; right: 0; height: 1px; }
.xyp .xd { position: absolute; width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px; border-radius: 50%;
  background: var(--xc); border: 1px solid rgba(0,0,0,0.6); pointer-events: none; }
.xyp.act .xd { box-shadow: 0 0 0 5px color-mix(in srgb, var(--xc) 30%, transparent); }
.val .hi { color: var(--accent, #e8a23a); }

.miss { color: var(--clip); font-size: 20px; margin-top: 20px; }
.fdr { touch-action: none; cursor: ns-resize; }
.grm { position: absolute; top: 8px; bottom: 8px; width: 26px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.grm .bar { flex-grow: 1; width: 14px; background: var(--body); border: 1px solid var(--ring); border-radius: 3px; position: relative; overflow: hidden; }
.grm .fill { position: absolute; left: 2px; right: 2px; top: 2px; height: 0; border-radius: 1px; background: var(--fill-bi); }
.grm .gv { font-size: 10px; color: var(--value); font-variant-numeric: tabular-nums; align-self: flex-end; width: 26px; text-align: center; }
.grm .row { flex-grow: 1; min-height: 0; width: 100%; display: flex; justify-content: flex-end; }
.grm .row .bar { flex-grow: 0; flex-shrink: 0; margin-right: 6px; }
/* the trace: flush against the bar, its far edge fading into the panel */
.grm .tv { position: relative; flex-grow: 1; min-width: 0;
  -webkit-mask-image: linear-gradient(to right, transparent 0, rgba(0,0,0,.5) 44px, #000 110px);
          mask-image: linear-gradient(to right, transparent 0, rgba(0,0,0,.5) 44px, #000 110px); }
.grm .tv canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* channel strip */
.sname { width: 100%; height: 36px; border-radius: 6px; background: var(--panel); border: 1px solid var(--border);
  border-bottom: 4px solid var(--c, var(--border)); display: flex; align-items: center; justify-content: center;
  font-weight: 600; padding: 0 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sfr { flex-grow: 1; display: flex; gap: 6px; width: 100%; justify-content: center; min-height: 0; }
.mtr { width: calc(8px * var(--mk, 1)); background: #0c0d0e; border-radius: 2px; position: relative; overflow: hidden; }
.mtr .lv { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: var(--lo); }
.mrow { display: flex; gap: 4px; width: 100%; }
.mrow button { flex: 1; height: 38px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel);
  font-weight: 700; cursor: pointer; padding: 0; }
.mrow .m.on { background: var(--mute); color: #fff; } .mrow .s.on { background: var(--solo); color: #111; }
.mrow .r.on { background: var(--rec); color: #fff; }
.mrow .mo svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; vertical-align: middle; }
.mrow .mo.on { background: var(--rec); color: #fff; }
.sbt .md svg { width: 20px; height: 20px; vertical-align: middle; }
.vdb { font-size: 12px; font-variant-numeric: tabular-nums; color: var(--value); }

.mrow .p.on { background: var(--warn); color: #fff; }
.mrow .i.on { background: var(--mon); color: #fff; } .mrow .i.au { background: var(--mauto); color: #fff; }

/* the mixer: under the plugins, behind a divider that drags (and snaps)
   between closed, half and full */
#mdiv { height: 26px; flex-shrink: 0; background: var(--strip); border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: center; gap: 8px; touch-action: none; cursor: ns-resize; }
#mdiv .grip { width: 44px; height: 5px; border-radius: 3px; background: var(--ring); }
#mdiv .ml { font-size: 11px; color: var(--dim); letter-spacing: 0.04em; text-transform: uppercase; }
#mix { height: 0; display: flex; gap: 4px; padding: 0 8px; width: max-content; min-width: 100%; overflow: hidden; }
#mix.open { padding: 6px 8px; }
#app.mixfull #main { display: none; }
/* the mixer has the selected track's strip already: the pinned one gives
   its width to the plugins while the mixer is open */
#app.mixopen #strip { display: none; }
.mxs { width: var(--sw); flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 4px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 5px; padding: 4px; }
.mxs.sel { border-color: var(--sel); box-shadow: inset 0 0 0 1px var(--sel); }
/* no name: the track's button underneath carries it; a colour strip here */
.mxs .mxc { width: 100%; height: 6px; flex-shrink: 0; border-radius: 3px; background: var(--c, var(--border)); }
.mxs .pr { display: flex; align-items: center; gap: 4px; height: 32px; flex-shrink: 0; }
/* The pan knob sits over the fader: both rows are [control | 24px side]
   with the same gap, centred, so the two controls share a centre line. */
/* centred over the meter pair below it, whatever its length ("C", "100L") */
.mxs .pr .val { width: 24px; font-size: 10px; text-align: center; overflow: visible; white-space: nowrap;
  display: flex; justify-content: center; }
.mxs .mm { width: calc(24px * var(--mk, 1)); display: flex; gap: 4px; justify-content: center; flex-shrink: 0; }
.mxs .sfr { gap: 4px; }
.mxs .mtr { width: calc(6px * var(--mk, 1)); }
.mxs .vdb { font-size: 10px; height: 12px; line-height: 12px; flex-shrink: 0; }
.mxs .mrow { gap: 3px; flex-shrink: 0; }
.mxs .mrow button { height: 26px; font-size: 11px; border-radius: 4px; }
.mxs .mrow button[data-sw] { touch-action: none; }

/* adding and moving plugins */
.addt { flex-shrink: 0; width: 76px; border: 2px dashed var(--ring); border-radius: 6px; background: transparent;
  color: var(--dim); font-size: 30px; cursor: pointer; }
.pnl.lift { opacity: 0.55; transform: scale(0.98); transition: transform 0.1s; }
.drop { position: absolute; top: 8px; bottom: 8px; width: 4px; margin-left: -2px; border-radius: 2px;
  background: var(--accent); display: none; z-index: 5; pointer-events: none; }
#row { position: relative; }
/* the bracket strip: FX containers and plugins running in parallel, over
   the panels they hold -- only those panels give up the height */
.brk { position: absolute; top: 8px; left: 0; pointer-events: none; overflow: visible; }
.brk text { font-size: 11px; }
.brk .hit { pointer-events: all; cursor: pointer; }
/* parameter modulation: a corner on a button, dropdown or fader */
.mdk { position: absolute; top: 2px; right: 2px; width: 0; height: 0; border-style: solid;
  border-width: 0 6px 6px 0; border-color: transparent var(--mdc) transparent transparent;
  pointer-events: none; z-index: 3; }
.on > .mdk { border-right-color: var(--mdc-on, var(--mdc)); }
/* a second parameter's link (an XY pad's Y, a dual knob's inner): top left */
.mdk2 { position: absolute; top: 2px; left: 2px; width: 0; height: 0; border-style: solid;
  border-width: 6px 6px 0 0; border-color: var(--mdc2) transparent transparent transparent;
  pointer-events: none; z-index: 3; }
.ph { touch-action: none; }
/* macros and modulators (TS_CV_Mod): their panels, and the rings and bars
   on the controls they drive */
.mrp .pb { overflow: hidden; }
.mrp .mft { height: 26px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; color: var(--dim); background: var(--head); border-top: 1px solid var(--border); }
.pnl.shut.mrp .mft { display: none; }
.mcell { position: absolute; border: 1px solid var(--border); border-radius: 5px; display: flex;
  flex-direction: column; align-items: center; box-sizing: border-box; }
.mcell .mn { font-size: 12px; font-weight: 600; margin-top: 4px; max-width: 92%; overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis; color: var(--mc); }
.mcell .ms { position: absolute; bottom: 3px; font-size: 10px; color: var(--dim); }
.mcell .mv { font-size: 11px; color: var(--value); }
.mcell .tog.on { background: var(--mc); }
.mtile { position: absolute; border: 1px solid var(--border); border-radius: 5px; padding: 5px 7px; box-sizing: border-box; }
.mtile.open { border-color: var(--mc); }
.mtile .mth { display: flex; align-items: center; gap: 6px; height: 22px; cursor: pointer; }
.mtile .sw { width: 10px; height: 10px; border-radius: 2px; background: var(--mc); flex-shrink: 0; }
.mtile .mtn { font-weight: 600; font-size: 13px; flex-grow: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.mtile .mts { font-size: 10px; color: var(--dim); height: 14px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.mtile canvas { display: block; width: 100%; height: 28px; border-radius: 3px; background: #121416; margin-top: 3px; }
.mtile .lvl { height: 8px; border-radius: 2px; background: #121416; margin-top: 6px; position: relative; overflow: hidden; }
.mtile .lvl i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--mc); }
.mtile .pills { display: flex; gap: 3px; margin-top: 6px; }
.mtile .pill { flex: 1; height: 26px; border-radius: 4px; border: 0; background: var(--toff); color: var(--label);
  font-size: 11px; padding: 0; cursor: pointer; }
.mtile .pill.on { background: var(--accent); color: #fff; }
.mtile .pill svg { width: 22px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.4; }
.mtile .kr { display: flex; margin-top: 4px; }
.mtile .kc { display: flex; flex-direction: column; align-items: center; width: 33.3%; touch-action: none; }
.mtile .kc .lbl, .mtile .kc .val { font-size: 10px; max-width: 100%; }
.lkbar { position: absolute; border-radius: 2px; pointer-events: none; z-index: 2; }
.lkdot { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 50%;
  pointer-events: none; z-index: 3; box-sizing: border-box; }
/* the preset bar: the header's twin along the foot of a panel */
.pf { height: 34px; flex-shrink: 0; display: flex; align-items: center; gap: 2px; padding: 0 2px;
  background: var(--head); border-top: 1px solid var(--border); }
.pf .pprev { margin-left: auto; }
.pf .pnext { margin-right: auto; }
.pf .pdd { flex: 0 1 240px; min-width: 0; height: 26px; border-radius: 5px;
  border: 1px solid var(--ring); background: var(--toff); color: var(--ttext); font-size: 12px; padding: 0 18px 0 8px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; cursor: pointer; }
.pf .pdd::after { content: ""; position: absolute; right: 7px; top: 11px; border: 4px solid transparent;
  border-top-color: var(--ttext); opacity: .65; }
.pf .pdd.mod { font-style: italic; }
.pnl.shut .pf { display: none; }
/* a locked layout: its grid scrolls when the panel is too short (the
   meters beside it stay put), and a padlock says so */
.pg { position: absolute; left: 0; top: 0; bottom: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: thin; }
.lk { width: 24px; height: 24px; margin: 0 2px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  border-radius: 5px; background: var(--text); }
.lk svg { width: 15px; height: 15px; fill: none; stroke: var(--head); stroke-width: 2.2; stroke-linecap: round; }
.ph .lk { width: 20px; height: 20px; }
/* REAPER's oversampling: lit like the padlock while on, a quiet "OS" off,
   outlined when a container or the chain oversamples it anyway */
.os { height: 24px; min-width: 26px; padding: 0 4px; margin: 0 2px; flex-shrink: 0; border-radius: 5px;
  border: 0; background: transparent; color: var(--dim); font-size: 11px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center; }
.os.on { background: var(--text); color: var(--head); }
.os.ox { box-shadow: inset 0 0 0 1px var(--text); color: var(--text); }
.ph .os { height: 20px; }
/* offline (unloaded): the head and foot in their own steel blue, and the
   body saying so in place of controls */
.pnl.offl .ph, .pnl.offl .pf { background: var(--head-off) !important; }
.offm { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  height: 100%; color: var(--dim); font-size: 12px; }
.offm b { color: var(--text); font-size: 14px; }
.offm button { margin-top: 8px; height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--head-off);
  background: var(--toff); color: var(--text); font-size: 12px; cursor: pointer; }
.pnl.shut .offm { display: none; }
.osc { position: absolute; left: 6px; bottom: 6px; z-index: 4; }
.pnl.shut .osc { left: 50%; transform: translateX(-50%); }
.mrow .cos { font-size: 12px; font-weight: 700; color: var(--dim); }
.mrow .cos.on { background: var(--text); color: var(--head); }
.mrow .cos.ox { box-shadow: inset 0 0 0 1px var(--text); color: var(--text); }
.sheet .note { color: var(--dim); font-size: 12px; margin: 0 0 8px; line-height: 1.4; }
.sheet .lbl2 { color: var(--dim); font-size: 12px; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.04em; }
.sheet .plist { max-height: 42vh; overflow-y: auto; }
.sheet .opt .star { color: var(--solo); margin-left: 6px; }
.sheet .opt[disabled] { opacity: 0.35; }
#toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--panel);
  border: 1px solid var(--clip); color: var(--text); padding: 10px 16px; border-radius: 8px; z-index: 40;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: none; max-width: 80vw; }
#toast.show { display: block; }   /* hold-to-drag; iOS would otherwise take it as a scroll */
.pk .flt { display: flex; gap: 8px; margin-bottom: 8px; }
.pk select { flex: 1; height: 40px; border-radius: 6px; border: 1px solid var(--border); background: var(--win);
  color: var(--text); padding: 0 8px; font: inherit; font-size: 14px; }
.pk .res { max-height: 52vh; }
.pk .opt { display: flex; align-items: baseline; gap: 8px; }
.pk .opt .fm { font-size: 10px; font-weight: 700; color: var(--dim); border: 1px solid var(--ring); border-radius: 3px; padding: 1px 5px; display: inline-block; min-width: 44px; box-sizing: border-box; text-align: center; flex: none; }
.pk .opt .vn { color: var(--dim); font-size: 12px; margin-left: auto; white-space: nowrap; }
.pk .hdr { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; padding: 8px 10px 2px; }
.pk { width: min(560px, 90vw); }

/* the ReaEQ canvas */
.eqc { position: absolute; left: 8px; right: 8px; top: 8px; touch-action: none; border-radius: 3px; }
.eqs { position: absolute; left: 8px; right: 8px; bottom: 8px; height: 46px; display: flex; align-items: center; gap: 8px;
  font-size: 12px; color: var(--dim); }
.eqs .dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.eqs button { height: 36px; border-radius: 6px; border: 1px solid var(--ring); background: var(--toff); color: var(--ttext);
  padding: 0 10px; cursor: pointer; font-size: 12px; }
.eqs .qd { height: 36px; min-width: 96px; border-radius: 6px; border: 1px solid var(--ring); background: var(--toff);
  color: var(--ttext); display: flex; align-items: center; justify-content: center; touch-action: none; cursor: ew-resize; }
.eqs .qd.sw { min-width: 0; padding: 0 12px; cursor: pointer; }
.eqs .qd.sw.on { background: var(--accent); color: #fff; }
.mbtab { flex: 0 0 auto; height: 26px; padding: 0 10px; border-radius: 5px; border: 1px solid var(--ring); background: var(--toff);
  color: var(--ttext); font-size: 12px; }
.mbtab.on { background: var(--accent); color: #fff; }
/* a canvas is a screen set into the faceplate: on a light plate it gets
   the theme's dark ground (its text is the theme's light ink) */
.pnl.lightplate .eqc { background: var(--panel); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.38); }
.eqs .shp { height: 36px; border-radius: 6px; border: 1px solid var(--ring); background: var(--toff); color: var(--ttext);
  font-size: 12px; padding: 0 8px; max-width: 46%; }
.eqs .rd { color: var(--value); font-variant-numeric: tabular-nums; flex-grow: 1; }
.eqs .rm { color: var(--clip); }

/* sends and receives, pinned right as on the desktop */
#route { width: 206px; flex-shrink: 0; background: var(--strip); border-left: 1px solid var(--border);
  overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 8px; touch-action: pan-y; }
#route:empty { display: none; }
.rsec { border: 1px solid var(--border); border-radius: 4px; background: var(--panel); }
.rhd { height: 34px; display: flex; align-items: center; padding: 0 10px; background: var(--head);
  font-weight: 600; cursor: pointer; border-radius: 4px 4px 0 0; }
.rhd .cnt { color: var(--dim); font-weight: 400; margin-left: 6px; }
.rhd .chev { margin-left: auto; color: var(--dim); transition: transform 0.15s; }
.rsec.shut .chev { transform: rotate(-90deg); }
.rsec.shut .rbd { display: none; }
.rbd { padding: 6px; display: flex; flex-direction: column; gap: 6px; }
.snd { border: 1px solid var(--border); border-radius: 4px; background: var(--win); padding: 4px; }
.snm { height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 4px 0 8px; border-radius: 3px;
  background: var(--panel); border-bottom: 3px solid var(--c, var(--border)); font-size: 12px; }
.snm span { flex-grow: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snm button { width: 30px; height: 22px; border: 0; background: transparent; color: var(--dim); font-size: 16px; padding: 0; cursor: pointer; }
.sbd { display: flex; align-items: center; gap: 6px; padding: 4px 2px 0; }
.sk { display: flex; flex-direction: column; align-items: center; width: 70px; }
.sbt { display: flex; flex-direction: column; gap: 4px; flex-grow: 1; }
.sbt button { height: 26px; border-radius: 5px; border: 1px solid var(--ring); background: var(--toff); color: var(--ttext);
  font-size: 11px; font-weight: 600; cursor: pointer; padding: 0; }
.sbt .mu.on { background: var(--byp); border-color: var(--byp); color: #fff; }
.sbt .md.sc { background: var(--solo); border-color: var(--solo); color: #111; }
.sbt .md.midi { background: #3f74b8; border-color: #3f74b8; color: #fff; }
.sbt .pp.on { background: var(--solo); border-color: var(--solo); color: #111; }
.radd { height: 38px; border-radius: 5px; border: 1px dashed var(--ring); background: transparent; color: var(--dim); cursor: pointer; }
.seg { display: flex; gap: 0; margin-bottom: 10px; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
.seg button { flex: 1; height: 38px; border: 0; background: var(--toff); cursor: pointer; }
.seg button.cur { background: var(--accent); color: #fff; }
.tl { max-height: 50vh; overflow-y: auto; }
.tl .opt { display: flex; align-items: center; gap: 10px; }
.tl .opt i { width: 8px; height: 18px; border-radius: 2px; background: var(--c, var(--border)); flex-shrink: 0; }
.tl .opt[disabled] { opacity: 0.35; }
.tl .gap { height: 8px; }
.tl .rule { height: 1px; background: var(--border); margin: 6px 4px; position: static; width: auto; }

/* sheets and banners */
#banner { position: fixed; left: 50%; top: 76px; transform: translateX(-50%); background: #3a2420; color: #fff;
  padding: 10px 16px; border-radius: 8px; font-size: 13px; display: none; z-index: 20; text-align: center; max-width: 80vw; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 30; display: none;
  align-items: center; justify-content: center; }
.scrim.open { display: flex; }
.sheet { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px;
  min-width: 300px; max-width: 90vw; max-height: 80vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
.sheet h3 { margin: 0 0 10px; font-size: 15px; }
.opt { display: block; width: 100%; text-align: left; padding: 12px; border: 0; border-radius: 6px; background: transparent;
  cursor: pointer; font-size: 14px; }
.opt.cur { background: var(--accent); color: #fff; }
.opt:active { background: var(--toff); }
.fld { width: 100%; height: 40px; border-radius: 6px; border: 1px solid var(--border); background: var(--win);
  color: var(--text); padding: 0 10px; font: inherit; font-size: 14px; margin-bottom: 8px; }
.sw { display: flex; gap: 8px; margin: 6px 0 12px; flex-wrap: wrap; }
.sw button { width: 30px; height: 30px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; padding: 0; }
.sw button.cur { border-color: #fff; }

<script>
"use strict";
// ---------------------------------------------------------------------------
// talking to REAPER
// ---------------------------------------------------------------------------
const NS = "TS_CV_WEB";
const unesc = s => s.replace(/\\(.)/g, (m, c) => c === "t" ? "\t" : c === "n" ? "\n" : c);

async function reaper(cmds) {
  const r = await fetch("/_/" + cmds, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const out = { ext: {}, cmd: {} };
  for (const line of (await r.text()).split("\n")) {
    const f = line.split("\t");
    if (f[0] === "TRANSPORT") out.transport = f;
    else if (f[0] === "BEATPOS") out.beat = f;
    else if (f[0] === "EXTSTATE") out.ext[f[2]] = unesc(f.slice(3).join("\t"));
    else if (f[0] === "CMDSTATE") out.cmd[f[1]] = +f[2];
  }

}
// A plugin or FX chain button (ChannelView's own command, not an action
// REAPER knows) goes through the bridge, which adds it. An FX chain
// button's way with the plugins already there (m.cm, set on the desktop):
// added, "replace" them, or "ask" here which.
const isFxBtn = a => typeof a === "string" && (a.startsWith("_TSCV_FX:") || a.startsWith("_TSCV_CHAIN:"));
const run = (id, m) => {
  if (!isFxBtn(String(id))) { reaper(encodeURIComponent(String(id))).catch(() => {}); return; }
  const way = m && String(id).startsWith("_TSCV_CHAIN:") ? m.cm : null;
  if (way !== "ask") { send("fxb", String(id), way === "replace" ? "replace" : "add"); return; }
  openSheet(sh => {
    sh.append(h("h3", null, macroText(m) || "FX chain"));
    const add = h("button", "opt", "Add it");
    add.addEventListener("click", () => { send("fxb", String(id), "add"); closeSheet(); });
    const rep = h("button", "opt", "Replace the plugins");
    rep.addEventListener("click", () => { send("fxb", String(id), "replace"); closeSheet(); });
    sh.append(add, rep, h("div", "note", "Replacing keeps the probes, Trimmer and ChannelView Modulators."));
  });
};
// The master's mono switch: REAPER's "Master track: Toggle stereo/mono
// (L+R)", read back as that action's toggle state with every poll.
const MONO_CMD = "40917";
const monoOn = () => macroStates && macroStates[MONO_CMD] === 1;
// An open circle on red while the master is mono, two linked circles on the
// plain button while it's stereo.
const MONO_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg>';
const STEREO_SVG = '<svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/></svg>';
function paintMono(b, on) {
  if (b.classList.contains("on") === on && b.innerHTML) return;
  b.classList.toggle("on", on);

  b.setAttribute("aria-label", on ? "Master in mono" : "Master in stereo");
}
function monoButton() {
  const b = h("button", "mo");
  paintMono(b, monoOn());
  b.addEventListener("click", () => { run(MONO_CMD); paintMono(b, !b.classList.contains("on")); });
  return b;
}
// The MIDI mode on a send: a MIDI socket, as on the desktop.
const MIDI_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/>' +
  '<circle cx="7.6" cy="12" r="1.3" fill="currentColor"/><circle cx="16.4" cy="12" r="1.3" fill="currentColor"/>' +
  '<circle cx="8.9" cy="8.9" r="1.3" fill="currentColor"/><circle cx="15.1" cy="8.9" r="1.3" fill="currentColor"/>' +
  '<circle cx="12" cy="7.6" r="1.3" fill="currentColor"/><rect x="10.6" y="18.2" width="2.8" height="2.2" fill="currentColor"/></svg>';

// Commands for the bridge, resent until acknowledged. A run of moves on the
// same control collapses to its latest value.

function send(verb, ...args) {

  // the verb and every argument but the value.

  const target = verb + "|" + args.slice(0, -1).join("|");
  if (coalesce) {
    const i = outbox.findIndex(o => o.target === target);
    if (i >= 0) outbox.splice(i, 1);
  }
  outbox.push({ seq: ++seqBase, target, text: [verb, ...args].join("|") });

// Send now rather than waiting for the next poll: a knob should answer the
// finger, not the timer.
let kickTimer = null;
function kick() { if (!kickTimer) kickTimer = setTimeout(() => { kickTimer = null; poll(); }, 0); }

  return outbox.map(o => o.seq + "|" + o.text).join("~");
}

// ---------------------------------------------------------------------------
// state
// ---------------------------------------------------------------------------
let layout = null, layoutSeq = -1, vals = null, transport = null, beat = null;
let macros = [], macroEdit = false, macroStates = {};
let aliveVal = null, aliveAt = 0, reachable = true;
const local = new Map();     // control id -> { v, t }: what the user is doing right now
const LOCAL_HOLD = 450;      // ms a touched control ignores the echo
const ui = { panels: new Map(), strip: null };

let showMacros = true;
let showNav = false;
try { showNav = localStorage.getItem("tscv.nav") === "1"; } catch (e) {}
// The space below the transport changed (a bar shown or hidden): the mixer
// keeps its share and the panels are laid out again for their new height.
function relayout() { applyMix(mixState, false); if (layout) build(); }

try { shut = new Set(JSON.parse(localStorage.getItem("tscv.shut") || "[]")); } catch (e) {}

// told again every few seconds so it can drop them when the page goes away.
let grv = new Map();
try { grv = new Map(Object.entries(JSON.parse(localStorage.getItem("tscv.grv") || "{}"))); } catch (e) {}

  try { localStorage.setItem("tscv.grv", JSON.stringify(Object.fromEntries(grv))); } catch (e) {}
  sendGrv();
}
// ReaComp canvases (buildComp) always show their trace: they're asked for too.
function sendGrv() {
  const all = new Map(grv);
  for (const g of rcOpen) if (!all.has(g)) all.set(g, "");

setInterval(() => { if (grv.size || rcOpen.size) sendGrv(); }, 3000);
setTimeout(() => { if (grv.size) sendGrv(); }, 300);
try { showMacros = localStorage.getItem("tscv.macros") !== "0"; } catch (e) {}
// the panels besides the plugins, each of which can be hidden (as the
// desktop's View menu; this device's own choice)
const SHOW_ITEMS = [["macros", "Macros"], ["mods", "Modulators"], ["sends", "Sends"], ["recv", "Receives"]];

function showSheet() {
  openSheet(sh => {
    sh.append(h("h3", null, "Show"));
    for (const [k, label] of SHOW_ITEMS) {
      const o = h("button", "opt", (showAux[k] ? "✓ " : "\u2003 ") + label);
      o.addEventListener("click", () => {
        showAux[k] = !showAux[k];
        try { localStorage.setItem("tscv.show", JSON.stringify(showAux)); } catch (e) {}
        relayout();
        showSheet();

    }
  });
}

// ---------------------------------------------------------------------------
// polling
// ---------------------------------------------------------------------------
let busy = false;
// A heartbeat for ChannelView's header: about once a second this page writes
// "<id>.<n>" to TS_CV_WEB/seen. Every page writes the same key, so the
// random id is what tells them apart; ChannelView counts a page as
// connected while its id keeps turning up.
const PAGE_ID = Math.random().toString(36).slice(2, 8) || "p";
let seenN = 0, seenAt = 0;
async function poll() {
  if (busy) return;
  busy = true;
  try {
    let q = `GET/EXTSTATE/${NS}/vals;GET/EXTSTATE/${NS}/alive;TRANSPORT;BEATPOS;GET/40364;GET/1068;GET/${MONO_CMD}`;
    for (const m of flatMacros(macros)) q += ";GET/" + encodeURIComponent(m.a);
    if (Date.now() - seenAt > 1000) {
      seenAt = Date.now(); seenN = (seenN + 1) % 1000;
      q = `SET/EXTSTATE/${NS}/seen/${PAGE_ID}.${seenN};` + q;
    }
    if (outbox.length) q = `SET/EXTSTATE/${NS}/cmd/` + encodeURIComponent(outboxText()) + ";" + q;
    const r = await reaper(q);
    reachable = true;
    transport = r.transport; beat = r.beat;
    macroStates = r.cmd;
    const alive = r.ext.alive || "";
    if (alive !== aliveVal) { aliveVal = alive; aliveAt = Date.now(); }
    if (r.ext.vals) {
      try { vals = JSON.parse(r.ext.vals); } catch (e) {}
      if (vals) {
        while (outbox.length && outbox[0].seq <= vals.A) outbox.shift();
        if (vals.L !== layoutSeq) await fetchLayout();
        if (vals.nv && vals.nv.N !== navSeq) await fetchNav();
        if (vals.br) gotBars(vals.br);
      }
    }
    render();
  } catch (e) {
    reachable = false;
    renderStatus();
  }
  busy = false;
}
async function fetchLayout() {
  const r = await reaper(`GET/EXTSTATE/${NS}/layout`);
  if (!r.ext.layout) return;
  try {
    layout = JSON.parse(r.ext.layout);
    CELL_W = cellW(layout.cw);
    applyStripWidth();
    layoutSeq = vals ? vals.L : -1;
    applyPalette(layout.pal || {});
    build();
  } catch (e) { console.error(e); }
}
let nav = null, navSeq = -1;
async function fetchNav() {
  const r = await reaper(`GET/EXTSTATE/${NS}/nav`);
  if (!r.ext.nav) return;
  try { nav = JSON.parse(r.ext.nav); navSeq = vals.nv.N; } catch (e) {}
}
async function loadMacros() {
  try {
    const r = await reaper(`GET/EXTSTATE/${NS}/macros`);
    macros = r.ext.macros ? JSON.parse(r.ext.macros) : [];
  } catch (e) { macros = []; }
  buildMacros();
}
// Not saved: the button's element, and its vendor look (ChannelView works
// that out again when the bar is saved).
const VSKIP = new Set(["el", "vc", "vl", "vm", "vf"]);
function saveMacros() {
  reaper(`SET/EXTSTATEPERSIST/${NS}/macros/` + encodeURIComponent(JSON.stringify(macros, (k, v) => VSKIP.has(k) ? undefined : v))).catch(() => {});
  buildMacros();
}

// ---------------------------------------------------------------------------
// palette
// ---------------------------------------------------------------------------
const PAL_VARS = { win_bg: "--win", panel_bg: "--panel", panel_border: "--border", header_bg: "--head",
  header_bg_byp: "--head-byp", header_bg_off: "--head-off", header_text: "--text", header_dim: "--dim", label: "--label", value: "--value",
  knob_track: "--track", knob_fill: "--fill", knob_fill_bi: "--fill-bi", knob_body: "--body",
  knob_pointer: "--pointer", knob_ring: "--ring", toggle_off: "--toff", toggle_on: "--ton",
  toggle_text: "--ttext", accent: "--accent", strip_bg: "--strip", strip_sel: "--sel",
  gr_measured: "--grm", fader_cap: "--cap", bypass_on: "--byp", mute_on: "--mute", solo_on: "--solo",
  rec_on: "--rec", warn: "--warn", mon_on: "--mon", mon_auto: "--mauto", eq_spectrum: "--spec", level_lo: "--lo", level_clip: "--clip", level_over: "--over",
  brk_parallel: "--brkp", brk_container: "--brkc" };
let PAL = {};
function applyPalette(p) {
  PAL = p;

  for (const k in PAL_VARS) if (p[k]) st.setProperty(PAL_VARS[k], p[k]);
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ---------------------------------------------------------------------------
// knob faces -- the same four as the desktop (TS_CV_Widgets.knob_face)
// ---------------------------------------------------------------------------
const SVGNS = "http://www.w3.org/2000/svg";
const A0 = -135, A1 = 135;
const rad = d => d * Math.PI / 180;

const f2 = n => n.toFixed(2);

  if (a1 < a0) [a0, a1] = [a1, a0];

}
const lum = hex => { const h = hex.replace("#", ""); const c = i => parseInt(h.substr(i, 2), 16) / 255;
  return 0.2126 * c(0) + 0.7152 * c(2) + 0.0722 * c(4); };

// unless it would vanish on what's under it -- then black or white.
function modCol(under) {

  if (under && under[0] === "#" && Math.abs(lum(a) - lum(under)) < 0.235)

function modCorner(node, under, underOn) {

  node.append(h("i", "mdk"));
}
const CAP_DEFAULT = { skirted: "#26282b", pointer: "#26282b", trim: "#8d9298", nose: "#26282b", bar: "#c9ccd0",
  fluted: "#26282b", bezel: "#26282b", rbezel: "#c9ccd0", hifi: "#c9ccd0" };
const BODY = { skirted: 38, pointer: 43, trim: 47, nose: 40, bar: 37, fluted: 38, bezel: 38, rbezel: 38, hifi: 38, led: 40 };
// Light falls from the top left on every hardware face (SVG degrees: 0 is
// up, clockwise), and how much of it a surface facing `d` catches
const LIGHT_D = -36.87;
const litD = d => (Math.cos((d - LIGHT_D) * Math.PI / 180) + 1) / 2;

  }
}
// a turned metal cap: lit top left, the bow-tie sheen of brushed metal
// across it (fixed to the light), a few machining rings
function metalCap(g, defs, r, cap, id) {
  el("circle", { cx: 50, cy: 50, r, fill: mixHex(cap, "#000000", 0.28) }, g);
  el("circle", { cx: 50 - r * 0.06, cy: 50 - r * 0.08, r: r * 0.9, fill: cap }, g);
  const s = LIGHT_D + 90, w = 14, rr = r * 0.9, P = d => pt(rr, d).map(f2).join(" ");

// a colour pulled toward white by `t` (0..1)
const lighten = (hex, t) => { const h = hex.replace("#", "").slice(0, 6);

    return Math.round(c + (255 - c) * t).toString(16).padStart(2, "0"); }).join(""); };

// in a 40 x 36 box, lit in the toggle's colour; `flat` is the theme's
// look (3D effect off), where the levers are pill sliders.

function hexMix(a, b, t) {
  const p = x => parseInt(x.replace("#", "").slice(0, 6), 16);

function switchSVG(st, on, col, flat, text) {

  const S = ["roundbtn", "jewel", "lamp"].includes(st) ? Math.min(W, H)
    : (st === "pill" || (flat && ["bat", "paddle", "guarded"].includes(st))) ? SP : SL;
  const o = [], defs = [];
  const f = v => +v.toFixed(2);
  const rect = (x1, y1, x2, y2, fill, r = 0, extra = "") => o.push(`<rect x="${f(x1)}" y="${f(y1)}" width="${f(x2 - x1)}" height="${f(y2 - y1)}" rx="${f(Math.min(r, (x2 - x1) / 2, (y2 - y1) / 2))}" fill="${fill}" ${extra}/>`);
  const srect = (x1, y1, x2, y2, stroke, r = 0, w = 1) => o.push(`<rect x="${f(x1)}" y="${f(y1)}" width="${f(x2 - x1)}" height="${f(y2 - y1)}" rx="${f(Math.min(r, (x2 - x1) / 2, (y2 - y1) / 2))}" fill="none" stroke="${stroke}" stroke-width="${w}"/>`);
  const circ = (x, y, r, fill, extra = "") => o.push(`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="${fill}" ${extra}/>`);
  const ring = (x, y, r, stroke, w = 1) => o.push(`<circle cx="${f(x)}" cy="${f(y)}" r="${f(r)}" fill="none" stroke="${stroke}" stroke-width="${w}"/>`);
  const poly = (pts, fill) => o.push(`<polygon points="${pts.map(p => f(p[0]) + "," + f(p[1])).join(" ")}" fill="${fill}"/>`);

    if (L > 1) return [mix(lo, B, Math.min(1, 0.4 * (L - 1))), mix(hi, W, Math.min(1, 0.4 * (L - 1)))];
    const m = mix(lo, hi, 0.5); return [mix(m, lo, L), mix(m, hi, L)];
  };
  // a lit band: the disc of radius R0, lit on the light's side
  const litRing = (R0, lo, hi, glint, yy = cy) => {
    [lo, hi] = contrast(lo, hi);
    E("circle", { cx, cy: yy, r: f2(R0), fill: lin([[0, hi], [0.5, mix(lo, hi, 0.5)], [1, lo]]) });
    if (glint) {
      const a0 = KP_LA + Math.PI - 0.5, a1 = KP_LA + Math.PI + 0.5, rr = R0 * 0.96;
      const [x0, y0] = at(a0, rr, yy), [x1, y1] = at(a1, rr, yy);
      E("path", { d: `M${f2(x0)} ${f2(y0)} A${f2(rr)} ${f2(rr)} 0 0 1 ${f2(x1)} ${f2(y1)}`, fill: "none",
        stroke: hi, "stroke-opacity": (0.56 * glint).toFixed(2), "stroke-width": f2(Math.max(px, R0 * 0.05)) });
    }
  };
  // a disc lit from the top left: darker at the bottom right, lighter toward the light
  const litDisc = (yy, Rr, col, lift) => {
    const dark = mix(col, B, Math.min(0.8, 0.32 * L));
    const light = mix(col, W, Math.min(0.85, (0.06 + 0.16 * lift) * L + 0.1 * Math.max(0, L - 1)));
    E("circle", { cx, cy: yy, r: f2(Rr), fill: grad("radialGradient", { cx: "0.41", cy: "0.38", r: "0.66" },
      [[0, light], [0.55, col], [1, dark]]) });
  };
  // a flat face: an even fall of light across it, its edge lit top left
  const flatFace = (yy, Rr, col, lift) => {
    const up = Math.max(0, L - 1);
    const dark = mix(col, B, Math.min(0.7, 0.14 * Math.min(1, L) + 0.18 * up));
    const light = mix(col, W, Math.min(0.7, (0.05 + 0.10 * lift) * Math.min(1, L) + 0.12 * up));
    E("circle", { cx, cy: yy, r: f2(Rr), fill: lin([[0, light], [1, dark]]) });
    const w = Math.max(px, Rr * 0.05), rr = Rr - w / 2;
    const arc = (a0, a1, c, op) => { const [x0, y0] = at(a0, rr, yy), [x1, y1] = at(a1, rr, yy);
      E("path", { d: `M${f2(x0)} ${f2(y0)} A${f2(rr)} ${f2(rr)} 0 0 1 ${f2(x1)} ${f2(y1)}`, fill: "none", stroke: c,
        "stroke-opacity": op, "stroke-width": f2(w) }); };
    arc(KP_LA - 1.2, KP_LA + 1.2, W, 0.22);
    arc(KP_LA + Math.PI - 1.2, KP_LA + Math.PI + 1.2, B, 0.19);
  };
  const sheen = (yy, Rr, col) => {
    const d = KP_LA + Math.PI / 2, w = 14 * Math.PI / 180;
    for (const s of [d, d + Math.PI]) {
      const [x1, y1] = at(s - w, Rr, yy), [x2, y2] = at(s + w, Rr, yy);
      E("path", { d: `M${cx} ${f2(yy)}L${f2(x1)} ${f2(y1)}L${f2(x2)} ${f2(y2)}Z`, fill: W,
        "fill-opacity": lum(col) > 0.5 ? 0.33 : 0.15 });
    }
    for (const k of [0.35, 0.57, 0.79]) E("circle", { cx, cy: yy, r: f2(Rr * k), fill: "none", stroke: B, "stroke-opacity": 0.05, "stroke-width": f2(px) });
  };
  const chrome = (yy, Rr, col) => {
    E("circle", { cx, cy: yy, r: f2(Rr), fill: mix(col, B, 0.55) });
    const [x0, y0] = at(Math.PI * 1.06, Rr, yy), [x1, y1] = at(Math.PI * 1.94, Rr, yy);
    E("path", { d: `M${f2(x0)} ${f2(y0)} A${f2(Rr)} ${f2(Rr)} 0 0 1 ${f2(x1)} ${f2(y1)}Z`, fill: mix(col, W, 0.55) });
    E("circle", { cx: f2(cx - Rr * 0.3), cy: f2(yy - Rr * 0.45), r: f2(Rr * 0.22), fill: W, "fill-opacity": 0.44 });
  };
  const ring = (yy, Rr, c, op, w) => E("circle", { cx, cy: yy, r: f2(Rr), fill: "none", stroke: c, "stroke-opacity": op, "stroke-width": f2(w) });
  // a group that turns with the knob, about (cx, yy)
  const turning = (yy = cy, pre = "") => { const g = E("g", {}); turners.push([g, cx, yy, pre]); return g; };
  const line = (par, x1, y1, x2, y2, c, w, op = 1) => el("line", { x1: f2(x1), y1: f2(y1), x2: f2(x2), y2: f2(y2),
    stroke: c, "stroke-opacity": op, "stroke-width": f2(w), "stroke-linecap": "round" }, par);
  const a0 = KP_AMIN;                // everything that turns is drawn at the value 0 and turned
  let dial = null;

  // a turned washer, a hex nut
  if (p.washer) { litRing(outer, "#6c7075", "#e2e4e6", 0.5); ring(cy, outer, B, 0.38, px); }
  if (p.nut) {
    const pts = []; for (let i = 0; i < 6; i++) pts.push(at(i * Math.PI / 3, Rs * 1.12));
    E("path", { d: "M" + pts.map(q => f2(q[0]) + " " + f2(q[1])).join("L") + "Z", fill: "#8d9196", stroke: "rgba(0,0,0,0.44)", "stroke-width": f2(px) });
  }
  // the skirt
  if (p.skirt) {
    const scol = p.scol || mix(body, B, 0.2);
    if (p.smat === "clear") {
      E("circle", { cx, cy, r: f2(Rs), fill: "#e8ecef", "fill-opacity": 0.16 });
      ring(cy, Rs - px / 2, W, 0.44, 1.2 * px); ring(cy, Rs * 0.86, W, 0.13, px);
    } else {
      const metal = p.smat === "metal", k = p.smat === "matte" ? 0.08 : (metal ? 0.45 : 0.14);
      litRing(Rs, mix(scol, B, k), mix(scol, W, k), metal ? 0.6 : 0);
      ring(cy, Rs, B, 0.44, px);
    }
    if (p.sgrip === "knurled") {
      const g = turning(), nk = Math.min(90, Math.floor(Rs * 2.2 / px));
      for (let i = 0; i < nk; i++) { const t = a0 + i * 2 * Math.PI / nk, [x1, y1] = at(t, Rs * 0.95), [x2, y2] = at(t, Rs);
        line(g, x1, y1, x2, y2, B, px, 0.31); }
    }
    // its print: ticks turning with the knob (a dial's round its own index)
    const sink = p.sink || (lum(p.scol || "#000000") > 0.5 ? "#1a1a1a" : "#f0efe9");
    const w = Math.max(px, R * 0.05);
    if (p.skirt === "printed") {
      // a scale's worth of ticks from the pointer round, turning with it
      const g = turning(), n = 20;
      for (let k = 0; k <= n; k++) {
        const t = a0 + KP_ASPAN * k / n, major = k % 5 === 0;
        const [x1, y1] = at(t, major ? R * 1.08 : R + (Rs - R) * 0.35), [x2, y2] = at(t, Rs * 0.95);
        line(g, x1, y1, x2, y2, sink, w);
      }
    } else if (p.skirt === "dial") {
      dial = turning();
      const span = 300 * Math.PI / 180, top = -Math.PI / 2;
      for (let k = 0; k <= 50; k += (Rs / px >= 30 ? 1 : 5)) {
        const t = top - span * k / 50, major = k % 5 === 0;
        const [x1, y1] = at(t, Rs * (major ? 0.78 : 0.86)), [x2, y2] = at(t, Rs * 0.93);
        line(dial, x1, y1, x2, y2, sink, major ? w : Math.max(px, w * 0.6));
      }
    }
  }
  // fins through the body (a wing knob)
  if (p.ptr === "wing") {
    const g = turning(), fl = R * 1.38, fw = R * 0.20, ca = Math.cos(a0), sa = Math.sin(a0), vx = -sa * fw, vy = ca * fw;
    const x1 = cx + ca * fl, y1 = cy + sa * fl, x2 = cx - ca * fl, y2 = cy - sa * fl;
    const quad = (k, oy, c) => el("path", { d: `M${f2(x1 + vx * k)} ${f2(y1 + vy * k + oy)}L${f2(x1 - vx * k)} ${f2(y1 - vy * k + oy)}L${f2(x2 - vx * k)} ${f2(y2 - vy * k + oy)}L${f2(x2 + vx * k)} ${f2(y2 + vy * k + oy)}Z`, fill: c }, g);
    quad(1, 0, side); quad(0.85, 0, body);
    line(g, cx + ca * R * 1.02, cy + sa * R * 1.02, cx + ca * (fl - R * 0.08), cy + sa * (fl - R * 0.08), p.ink || "#f0f0ee", Math.max(1.2 * px, R * 0.07));
    line(g, cx - ca * R * 1.02, cy - sa * R * 1.02, cx - ca * (fl - R * 0.08), cy - sa * (fl - R * 0.08), B, Math.max(px, R * 0.04), 0.56);
  }
  let topR = p.top_r || ({ straight: 0.93, slight: 0.86, tapered: 0.78, domed: 0.90 })[p.profile || "straight"] || 0.93;
  if (p.grip === "fluted") topR = Math.min(topR, 0.80);

  // a chicken-head: modelled as the desktop's pointer_body
  if (p.ptr === "chicken") {
    const mat = p.mat || "plastic", shine = KP_SHINE[mat] || 0.2;
    const tail = R * 0.42, rt = R * 0.56, tip = R * 1.04, rp = R * 0.13, hh = R * 0.14;
    const ca = Math.cos(a0), sa = Math.sin(a0);
    const hull = (grow) => kpHull(cx - ca * tail, cy - sa * tail, Math.max(0.3, rt + grow), cx + ca * tip, cy + sa * tip, Math.max(0.3, rp + grow));
    const n = rt / px < 8 ? 2 : 4;
    for (let j = n; j >= 1; j--) {
      const g = turning(cy, `translate(0 ${f2(hh * j / n)}) `);
      el("path", { d: hull(0), fill: mix(body, B, 0.30 + 0.30 * j / n) }, g);
    }
    const bv = Math.max(0.6 * px, rt * 0.10);
    const [lo, hi] = contrast(mix(body, B, 0.32), mix(body, W, shine));
    el("path", { d: hull(0), fill: lo }, turning(cy, `translate(${f2(-KP_UX * bv * 0.6)} ${f2(-KP_UY * bv * 0.6)}) `));
    el("path", { d: hull(0), fill: hi }, turning(cy, `translate(${f2(KP_UX * bv * 0.6)} ${f2(KP_UY * bv * 0.6)}) `));
    const steps = rt / px < 8 ? 3 : 7;
    const dark = mix(body, B, Math.min(0.6, 0.20 * L)), light = mix(body, W, Math.min(0.8, (0.05 + 0.5 * shine) * L));
    for (let i = 0; i < steps; i++) {
      const t = i / (steps - 1), off = rt * 0.22 * t;
      const c = t < 0.3 ? mix(dark, body, t / 0.3) : mix(body, light, (t - 0.3) / 0.7);
      el("path", { d: hull(-(bv + rt * 0.5 * t)), fill: c }, turning(cy, `translate(${f2(KP_UX * off)} ${f2(KP_UY * off)}) `));
    }
    // the ridge's highlight, on whichever side faces the light: redrawn as it turns
    const sop = (KP_STREAK[mat] || 0x26) / 255;
    const streak = E("path", { fill: W, "fill-opacity": (sop * 0.45).toFixed(3) });
    const core = (mat === "gloss" || mat === "chrome" || mat === "enamel") ? E("path", { fill: W, "fill-opacity": sop.toFixed(3) }) : null;
    const ig = turning();
    const w = Math.max(1.2 * px, rt * 0.16);
    line(ig, cx + ca * R * 0.05, cy + sa * R * 0.05 + 0.6 * px, cx + ca * R * 0.96, cy + sa * R * 0.96 + 0.6 * px, B, w + 0.8 * px, 0.44);
    line(ig, cx + ca * R * 0.05, cy + sa * R * 0.05, cx + ca * R * 0.96, cy + sa * R * 0.96, ink, w);
    const turnAll = a => { for (const [g, gx, gy, pre] of turners) g.setAttribute("transform", `${pre}rotate(${f2((a - a0) * 180 / Math.PI)} ${f2(gx)} ${f2(gy)})`); };
    return v => {
      const a = KP_AMIN + KP_ASPAN * v;
      turnAll(a);
      const c = Math.cos(a), s = Math.sin(a);
      let vx = -s, vy = c; if (vx * KP_UX + vy * KP_UY < 0) { vx = -vx; vy = -vy; }
      const so = rt * 0.34, tx = cx - c * tail, tyy = cy - s * tail;
      const x1 = tx + c * rt * 0.15 + vx * so, y1 = tyy + s * rt * 0.15 + vy * so;
      const x2 = cx + c * tip * 0.78 + vx * so * 0.35, y2 = cy + s * tip * 0.78 + vy * so * 0.35;
      streak.setAttribute("d", kpHull(x1, y1, rt * 0.16, x2, y2, Math.max(0.3, rp * 0.35), 6));
      if (core) core.setAttribute("d", kpHull(x1, y1, rt * 0.06, x2, y2, 0.3, 6));
    };
  }

  // the body's sides
  if (p.grip === "fluted") {
    const g = turning(), n = p.n || 12, segs = n * 6, pts = [];
    for (let i = 0; i < segs; i++) {
      const t = a0 + i * 2 * Math.PI / segs;
      const rr = R * (1 - 0.07 * Math.pow(0.5 - 0.5 * Math.cos(n * (t - a0) + Math.PI), 0.9));
      pts.push(at(t, rr));
    }
    el("path", { d: "M" + pts.map(q => f2(q[0]) + " " + f2(q[1])).join("L") + "Z", fill: mix(side, B, 0.25) }, g);
    litRing(R * 0.92, mix(side, B, 0.2), mix(side, W, p.mat === "gloss" ? 0.30 : 0.12), 0);
  } else if (p.grip === "grooves") {
    // square-cut grooves out of the side's edge: the lit side seen
    // through its cut outline (a mask that turns with the knob, so the
    // light stays put), and the outline round it
    const shine = p.mat === "gloss" ? 0.30 : ((p.mat === "metal" || p.mat === "chrome") ? 0.35 : 0.12);
    const [lo, hi] = contrast(mix(side, B, 0.25), mix(side, W, shine));
    const pts = kpNotches(cx, cy, R, a0, p.n || 6, R * 0.09);
    let d = "";
    for (let i = 0; i < pts.length; i += 2) d += (i ? "L" : "M") + f2(pts[i]) + " " + f2(pts[i + 1]);
    d += "Z";
    const id = "kpm" + (++gradN);
    const m = el("mask", { id, maskUnits: "userSpaceOnUse", x: f2(cx - R * 1.2), y: f2(cy - R * 1.2), width: f2(R * 2.4), height: f2(R * 2.4) }, defs);
    const mg = el("g", {}, m);
    turners.push([mg, cx, cy, ""]);
    el("path", { d, fill: "#fff" }, mg);
    E("circle", { cx, cy, r: f2(R), fill: lin([[0, hi], [0.5, mix(lo, hi, 0.5)], [1, lo]]), mask: `url(#${id})` });
    el("path", { d, fill: "none", stroke: B, "stroke-opacity": 0.44, "stroke-width": f2(px) }, turning());
  } else {
    const shine = p.mat === "gloss" ? 0.30 : ((p.mat === "metal" || p.mat === "chrome") ? 0.35 : 0.12);
    litRing(R, mix(side, B, 0.25), mix(side, W, shine), 0);
    ring(cy, R, B, 0.44, px);
  }
  // grip marks on the sides
  if (p.grip === "knurled" || p.grip === "ridged" || p.grip === "coin") {
    const g = turning();
    const n = p.grip === "knurled" ? Math.min(48, Math.floor(R * 1.6 / px))
      : p.grip === "ridged" ? Math.min(p.n || 32, Math.max(8, Math.floor(R * 1.6 / px))) : Math.min(72, Math.floor(R * 2 / px));
    const r0 = p.grip === "coin" ? R * 0.93 : R * topR;
    for (let i = 0; i < n; i++) {
      const t = a0 + i * 2 * Math.PI / n, [x1, y1] = at(t, r0), [x2, y2] = at(t, R * 0.995);
      line(g, x1, y1, x2, y2, B, px, p.grip === "ridged" ? 0.25 : 0.28);
    }
  }
  // the top
  const Rt = R * topR, mat = p.mat || "plastic";
  if (mat === "chrome") {
    chrome(cy, Rt, body);
    ring(cy, Rt * 0.94, mix(body, B, 0.45), 1, Math.max(px, Rt * 0.12));
  } else if (mat === "metal") {
    litDisc(cy, Rt, body, 0);
    sheen(cy, Rt * 0.92, body);
  } else {
    const lift = ({ plastic: 0.22, gloss: 0.9, matte: 0.08, rubber: 0.04, enamel: 0.45 })[mat] ?? 0.2;
    if (p.face === "flat") flatFace(cy, Rt, body, lift); else litDisc(cy, Rt, body, lift);
    if (p.profile === "domed") for (let i = 1; i <= 4; i++)
      E("circle", { cx: f2(cx - Rt * 0.06 * i), cy: f2(cy - Rt * 0.08 * i), r: f2(Rt * (0.9 - 0.17 * i)), fill: W, "fill-opacity": 0.05 });
    if (mat === "gloss") {
      E("circle", { cx: f2(cx - Rt * 0.36), cy: f2(cy - Rt * 0.42), r: f2(Rt * 0.16), fill: W, "fill-opacity": 0.44 });
      E("circle", { cx: f2(cx - Rt * 0.36), cy: f2(cy - Rt * 0.42), r: f2(Rt * 0.08), fill: W, "fill-opacity": 0.56 });
    } else if (mat === "enamel") {
      E("circle", { cx: f2(cx - Rt * 0.36), cy: f2(cy - Rt * 0.42), r: f2(Rt * 0.12), fill: W, "fill-opacity": 0.22 });
    }
  }
  if (p.top === "insert") {
    const ic = p.insert || "#c9ccd0";
    litDisc(cy, Rt * 0.56, ic, 0.5);
    if (lum(ic) > 0.5) sheen(cy, Rt * 0.5, ic);
    ring(cy, Rt * 0.56, B, 0.5, px);
  } else if (p.top === "recessed") {
    ring(cy, Rt * 0.82, W, 0.16, Math.max(px, R * 0.05));
    E("circle", { cx: f2(cx + 0.5 * px), cy: f2(cy + 0.6 * px), r: f2(Rt * 0.78), fill: "none", stroke: B, "stroke-opacity": 0.31, "stroke-width": f2(px) });
  }
  if (p.rim) {
    ring(cy, Rt * 0.88, p.rim, 1, Math.max(1.5 * px, R * 0.12));
    E("circle", { cx: f2(cx - 0.4 * px), cy: f2(cy - 0.5 * px), r: f2(Rt * 0.88), fill: "none", stroke: W, "stroke-opacity": 0.31, "stroke-width": f2(px) });
  }
  let screws = null;
  if (p.inner) {
    const ri = R * (p.inner.r || 0.62);
    E("circle", { cx, cy: f2(cy), r: f2(ri * 1.18), fill: "#1c1d1f" });
    litDisc(cy, ri, p.inner.col || "#9b9b97", p.inner.mat === "bead" ? 0.3 : 0.6);
    if (p.inner.screws) {
      screws = turning(cy);
      const sr = (ri * 1.18 + Rt) * 0.5;
      for (const s of [a0 + 0.7, a0 + 0.7 + Math.PI]) { const [x, y] = at(s, sr, cy);
        el("circle", { cx: f2(x), cy: f2(y), r: f2(Math.max(0.8 * px, R * 0.04)), fill: "#303134" }, screws); }
    }
  }
  if (p.face !== "flat") ring(cy, Rt, B, 0.31, px);
  // the light over it all
  if (p.ptr !== "wing" && L > 1) {
    const up = L - 1;
    E("circle", { cx, cy, r: f2(outer), fill: lin([[0, W, Math.min(0.5, 0.28 * up)], [0.5, W, 0], [1, B, Math.min(0.5, 0.25 * up)]]),
      "pointer-events": "none" });
  }
  // the pointer
  const ptr = p.ptr || "line";
  const pw = Math.max(1.5 * px, R * (p.pw || 0.10));
  const pg = turning(cy);
  const pl = (r0, r1, c, w, op = 1) => { const [x1, y1] = at(a0, r0, cy), [x2, y2] = at(a0, r1, cy); line(pg, x1, y1, x2, y2, c, w, op); };
  if (ptr === "line") pl(Rt * (p.p0 ?? 0.30), Rt * 0.92, ink, pw);
  else if (ptr === "dot") { const [x, y] = at(a0, Rt * 0.68, cy); el("circle", { cx: f2(x), cy: f2(y), r: f2(Math.max(1.5 * px, R * 0.09)), fill: ink }, pg); }
  else if (ptr === "inset") { pl(Rt * 0.24, Rt * 0.86, B, pw * 1.3, 0.63); pl(Rt * 0.26, Rt * 0.84, ink, Math.max(px, pw * 0.6)); }
  else if (ptr === "notch") pl(Rt * 0.40, Rt * 0.95, mix(body, B, 0.65), pw);
  else if (ptr === "skirtline") { const [x1, y1] = at(a0, R * 0.5), [x2, y2] = at(a0, Rs * 0.96); line(pg, x1, y1, x2, y2, ink, Math.max(1.2 * px, R * 0.07)); }

  return v => {
    const a = KP_AMIN + KP_ASPAN * v;
    for (const [g, gx, gy, pre] of turners) {
      // a dial's print turns the other way round its top index
      const deg = g === dial ? 300 * v : (a - a0) * 180 / Math.PI;
      g.setAttribute("transform", `${pre}rotate(${f2(deg)} ${f2(gx)} ${f2(gy)})`);
    }
  };
}

// the scale round a parts knob: ticks, or a ring of printed dots
function partsScale(svg, p, noTicks) {
  if (noTicks) return;
  if (p.scale === "dots") {
    for (let i = 0; i <= 10; i++) { const t = -135 + 27 * i, q = pt(57, t);
      el("circle", { cx: f2(q[0]), cy: f2(q[1]), r: 2.4, fill: "var(--ring)" }, svg); }
  } else {
    el("path", { d: radial(11, 53, 60, A0, A1), fill: "none", stroke: "var(--ring)", "stroke-width": 3, "stroke-linecap": "round" }, svg);
  }
}

// A knob built from parts, `size` px: { svg, set(v) }. Its own shadow
// setting: none sits it flush (no drop shadow), tall throws a longer one.
function makePartsKnob(size, look, cap, noTicks) {
  const svg = el("svg", { width: size, height: size, viewBox: "0 0 100 100" });
  svg.style.overflow = "visible";

    const sx = e.clientX, sy = e.clientY;
    let dragging = false, to = null, mark = null;
    const move = ev => {
      if (!dragging) {
        if (Math.hypot(ev.clientX - sx, ev.clientY - sy) < 8) return;
        dragging = true;
        el.classList.add("drag");
        mark = h("div"); mark.id = "macmark"; bar.append(mark);
      }
      to = macroDropAt(ev.clientX, ev.clientY);
      if (to) {
        const br = bar.getBoundingClientRect();
        mark.style.left = (to.x - br.left) + "px";
        mark.style.top = (to.r.top - br.top) + "px";
        mark.style.height = to.r.height + "px";
      }
    };
    const end = () => {
      el.removeEventListener("pointermove", move);
      el.removeEventListener("pointerup", end);
      el.removeEventListener("pointercancel", end);
      if (!dragging) return;
      macroDragAt = Date.now();
      el.classList.remove("drag");
      if (mark) mark.remove();
      if (to) {
        let j = to.idx;
        if (j > i) j--;                   // the item leaves its own place first
        if (j !== i) {
          const [it] = macros.splice(i, 1);
          macros.splice(j, 0, it);
          saveMacros();
        }
      }
    };
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  });
}

async function searchActions(q, res, pick) {
  if (q.trim().length < 2) { res.innerHTML = ""; return; }
  send("find", q.replace(/[|~]/g, " "));
  const mine = ++findSeq;
  for (let k = 0; k < 20 && mine === findSeq; k++) {
    await new Promise(r => setTimeout(r, 150));
    try {
      const r = await reaper(`GET/EXTSTATE/${NS}/found`);
      const f = r.ext.found ? JSON.parse(r.ext.found) : null;
      if (f && f.q === q.replace(/[|~]/g, " ")) {
        res.innerHTML = "";
        if (!f.r.length) res.append(h("div", "lbl", "Nothing found"));
        for (const a of f.r) {

}

// Metal flake: a tile of fine speckle, bright and dark grains scattered
// evenly with no direction (brushed metal has one), the way metallic paint
// or powder coat looks close up. Seeded, so it's the same every time and
// never shimmers; one tile for light plates and one for dark, where white
// grains show far more.
const flakeCache = {};
// The flake's strength, and the 3D effect's shadows': the desktop's
// C.METAL_K.
const METAL_K = 0.8;
// View > Shadows (layout.shk): how deep and far the shadows fall, 1 as
// designed, 0 none, 2 deep
let SHADOW_K = 1;
// View > Lighting (layout.lt): how strongly the light models plates and
// knobs, 1 as designed; above it the studio-lit look
let LIGHT_K = 1;
const shadowAlpha = k => k <= 0 ? 0 : Math.min(2, METAL_K * k + 0.2) / Math.min(2, METAL_K + 0.2);
// { url, css }: the tile as an image, and as a CSS background layer
function flakeTile(light) {
  const k = light ? "l" : "d";
  if (flakeCache[k]) return flakeCache[k];
  // drawn at the screen's own pixel density, so a grain is one real pixel
  const dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
  const T = 128, N = T * dpr, c = document.createElement("canvas"); c.width = c.height = N;
  const g = c.getContext("2d"), img = g.createImageData(N, N), d = img.data;
  let seed = 0x5eed1234;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const K = METAL_K;
  const hiA = Math.min(0.9, (light ? 0.22 : 0.10) * K), loA = Math.min(0.9, (light ? 0.07 : 0.14) * K);
  const dens = 0.035 * Math.min(2.2, 0.6 + 0.4 * K);
  for (let i = 0; i < N * N; i++) {
    const r = rnd(), o = i * 4;
    let v = 0, a = 0;
    if (r < dens) { v = 255; a = hiA * (0.3 + 0.7 * rnd()); }           // a grain catching the light
    else if (r < dens * 2) { v = 0; a = loA * (0.3 + 0.7 * rnd()); }         // one turned away from it
    else { v = rnd() < 0.5 ? 255 : 0; a = 0.02 * K * rnd(); }                // the satin in between
    d[o] = d[o + 1] = d[o + 2] = v; d[o + 3] = Math.round(a * 255);
  }
  g.putImageData(img, 0, 0);
  const url = c.toDataURL();
  return (flakeCache[k] = { url, css: `url(${url}) 0 0 / ${T}px ${T}px` });
}
// metallic paint's sheen: a soft broad highlight high on the left
const METAL_SHEEN = `radial-gradient(140% 70% at 25% 0%, rgba(255,255,255,${(0.16 * Math.min(2, METAL_K)).toFixed(2)}), rgba(255,255,255,0) 65%),
  radial-gradient(120% 60% at 85% 100%, rgba(0,0,0,${(0.08 * Math.min(2.5, METAL_K)).toFixed(2)}), rgba(0,0,0,0) 70%)`;

// A surface finish (the desktop's C.FINISHES): a tile of light and shade
// with no colour of its own, served beside this page, so it lies over any
// plate. Tiles repeat every FIN_TILE px from the origin given; Bright and
// Satin are one reflection stretched over the whole surface, Satin's over
// a tiled grain.
const FIN_TILE = 256;
const FIN_STRETCH = { bright: 1, satin: 1 };
const FIN_UNDER = { satin: "satin_grain" };
function finUrl(f) { return `url(TS_CV_finish_${f}.png)`; }
// the CSS layers, top first
function finLayers(f, ox, oy) {
  if (!f || f === "plain") return [];
  const tile = k => ({ img: finUrl(k), pos: `${ox || 0}px ${oy || 0}px`, size: `${FIN_TILE}px ${FIN_TILE}px`, rep: "repeat" });
  const out = [FIN_STRETCH[f] ? { img: finUrl(f), pos: "0 0", size: "100% 100%", rep: "no-repeat" } : tile(f)];
  if (FIN_UNDER[f]) out.push(tile(FIN_UNDER[f]));
  return out;
}
// ... as SVG fills, bottom first: patterns from the user space's origin
// (a stretched one: over the shape's box)
function finFills(svg, f) {
  if (!f || f === "plain") return [];
  let defs = svg.querySelector("defs");
  if (!defs) defs = el("defs", {}, svg);
  const one = (k, stretch) => {
    const id = "fin" + (++gradN);
    if (stretch) {
      const pat = el("pattern", { id, patternUnits: "objectBoundingBox", patternContentUnits: "objectBoundingBox", width: 1, height: 1 }, defs);
      el("image", { href: `TS_CV_finish_${k}.png`, width: 1, height: 1, preserveAspectRatio: "none" }, pat);
    } else {
      const pat = el("pattern", { id, patternUnits: "userSpaceOnUse", width: FIN_TILE, height: FIN_TILE }, defs);
      el("image", { href: `TS_CV_finish_${k}.png`, width: FIN_TILE, height: FIN_TILE }, pat);
    }
    return `url(#${id})`;
  };
  const out = [];
  if (FIN_UNDER[f]) out.push(one(FIN_UNDER[f], false));
  out.push(one(f, !!FIN_STRETCH[f]));
  return out;
}

// A panel's background: the plate, with the 3D effect's light (the
// gradient) and its own finish, and the metallic flake over it.
// a light faceplate (its colour more than half way to white)
function plateLight(pl) {
  const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})/i.exec(pl.bg || "");
  if (!m) return false;
  return (0.299 * parseInt(m[1], 16) + 0.587 * parseInt(m[2], 16) + 0.114 * parseInt(m[3], 16)) / 255 > 0.5;
}
function plateFill(pl) {
  if (!pl) return "";
  const sh = pl.sheen || 1;
  const mix = (a, b, t) => { const p = x => parseInt(x.slice(1), 16);
    const A = p(a), B = p(b), out = [16, 8, 0].map(s => Math.round(((A >> s) & 255) + (((B >> s) & 255) - ((A >> s) & 255)) * t));
    return "#" + out.map(v => v.toString(16).padStart(2, "0")).join(""); };
  const L = layout.tex ? ((typeof layout.lt === "number") ? layout.lt : 1) : 1;
  const g = layout.tex
    ? `linear-gradient(180deg, ${mix(pl.bg, "#ffffff", Math.min(0.5, 0.08 * sh * L))} 0%, ${pl.bg} 40%, ${mix(pl.bg, "#000000", Math.min(0.6, 0.12 * sh * L))} 100%)`
    : pl.bg;
  const layers = [];
  if (layout.tex && L > 1) {
    // View > Lighting above 100%: the light across the plate, bright top
    // left to deep bottom right, its edges falling away (as the desktop)
    const up = Math.min(1.5, L - 1), sk = Math.max(0.5, pl.sheen || 1);
    const wa = Math.min(0x50, 0x2a * up * sk) / 255, ba = Math.min(0x80, 0x48 * up * sk) / 255, va = Math.min(0x60, 0x30 * up) / 255;
    layers.push(`radial-gradient(ellipse at 30% 25%, transparent 55%, rgba(0,0,0,${va.toFixed(3)}) 100%)`,
      `linear-gradient(135deg, rgba(255,255,255,${wa.toFixed(3)}) 0%, transparent 50%, rgba(0,0,0,${ba.toFixed(3)}) 100%)`);
  }
  if (pl.metal) layers.push(flakeTile(lum(pl.bg) > 0.45).css, METAL_SHEEN);
  for (const fin of finLayers(pl.fin || (pl.brushed ? "brushed" : null), 0, 0))
    layers.push(`${fin.img} ${fin.pos} / ${fin.size} ${fin.rep}`);
  layers.push(g);
  return layers.join(", ");
}

// ---------------------------------------------------------------------------
// sends and receives (TS_CV_Sends on the desktop)
// ---------------------------------------------------------------------------
const MODE_LABEL = { direct: "DIR", sidechain: "SC", midi: "MIDI" };
const MODE_NEXT = { direct: "sidechain", sidechain: "midi", midi: "direct" };
const MODE_NAME = { direct: "Direct", sidechain: "Sidechain", midi: "MIDI" };
const isSpacer = n => /^[-_=~.*\s]+$/.test((n || "").trim()) && (n || "").trim() !== "";
let routeOpen = { 0: true, "-1": false, 1: true };
try { const r = JSON.parse(localStorage.getItem("tscv.route") || "null"); if (r) routeOpen = r; } catch (e) {}

function buildRoute() {
  const col = $("route");
  col.innerHTML = "";
  ui.sends = { 0: [], "-1": [], 1: [] };
  if (!layout.track) return;
  // With the master selected the first section is its hardware outputs
  // (category 1): the master has nothing to send to.
  const first = layout.outs ? [1, layout.sends || [], "Outputs", "output"] : [0, layout.sends || [], "Sends", "send"];
  // The master has no Receives section: every track feeds it.
  let secs = layout.track.m ? [first] : [first, [-1, layout.recv || [], "Receives", "receive"]];
  // (either can be hidden: Show; none left, the column goes)
  secs = secs.filter(([cat]) => cat === -1 ? showAux.recv : showAux.sends);
  col.classList.toggle("hidden", secs.length === 0);
  for (const [cat, list, title, noun] of secs) {
    if (routeOpen[cat] === undefined) routeOpen[cat] = true;
    const sec = h("div", "rsec" + (routeOpen[cat] ? "" : " shut"));
    const hd = h("div", "rhd", title);
    hd.append(h("span", "cnt", list.length ? String(list.length) : ""), h("span", "chev", "▾"));
    hd.addEventListener("click", () => {
      routeOpen[cat] = !routeOpen[cat];
      sec.classList.toggle("shut", !routeOpen[cat]);
      try { localStorage.setItem("tscv.route", JSON.stringify(routeOpen)); } catch (e) {}
    });
    const bd = h("div", "rbd");
    list.forEach((sd, i) => bd.append(buildSend(cat, i, sd, noun)));
    const add = h("button", "radd", "+ Add " + noun);
    add.addEventListener("click", () => addSend(cat, noun));
    bd.append(add);
    sec.append(hd, bd);
    col.append(sec);
  }
}

function buildSend(cat, i, sd, noun) {
  const box = h("div", "snd");
  const nm = h("div", "snm");
  if (sd.c) nm.style.setProperty("--c", sd.c);
  const more = h("button", null, "⋯");
  more.addEventListener("click", () => sendMenu(cat, i, sd, noun));
  nm.append(h("span", null, (sd.n ? sd.n + "  " : "") + sd.nm), more);
  const bd = h("div", "sbd");
  const kb = h("div", "sk");
  const k = makeKnob(46, "arc", null, false);
  const kn = h("div", "knob"); kn.append(k.svg);
  const val = h("div", "val", "");
  kb.append(kn, val);
  const bt = h("div", "sbt");
  const hw = cat === 1;
  const mu = h("button", "mu", "ON"), md = h("button", "md", hw ? "" : "DIR"), pp = h("button", "pp", "POST");
  mu.addEventListener("click", () => send("smute", cat, i));
  pp.addEventListener("click", () => send("spre", cat, i));
  let mode = "direct";
  // an output's middle button is where it goes; a tap moves it
  md.addEventListener("click", () => hw ? sendMenu(cat, i, sd, noun) : send("smode", cat, i, MODE_NEXT[mode]));
  bt.append(mu, md, pp);
  bd.append(kb, bt);
  box.append(nm, bd);
  const id = "s" + cat + ":" + i;
  let cur = 0;
  dragger(kn, () => cur, v => { cur = v; k.set(v); touch(id, v); send("svol", cat, i, v.toFixed(4)); },
    { reset: () => send("sv0", cat, i) });
  ui.sends[cat][i] = { set(sv) {
    const l = held(id);
    cur = l ? l.v : sv.f; k.set(cur);
    val.textContent = sv.db + " dB";
    mu.classList.toggle("on", !!sv.m); mu.textContent = sv.m ? "OFF" : "ON";
    if (hw) { md.textContent = sv.ch || ""; md.className = "md"; }
    else {
      mode = sv.md || "direct";
      if (mode === "midi") { if (!md.querySelector("svg")) md.innerHTML = MIDI_SVG; }
      else md.textContent = MODE_LABEL[mode];
      md.className = "md" + (mode === "sidechain" ? " sc" : mode === "midi" ? " midi" : "");
    }
    pp.classList.toggle("on", !!sv.pre); pp.textContent = sv.pre ? "PRE" : "POST";
  } };
  return box;
}

function sendMenu(cat, i, sd, noun) {

// ---------------------------------------------------------------------------
// the navigator
// ---------------------------------------------------------------------------
// The session at a glance, as REAPER's Navigator: a lane per visible track
// with its items, regions along the top, markers, the time selection, the
// playhead, and a box for what the arrange view on the computer shows.
// Tap to put the edit cursor there (and the playhead, while playing); drag
// the box -- or drag anywhere else, and the box comes to the finger -- to
// scroll the arrange view. Tap a region's name to go to its start.
const NAV_RB = 17;                 // the region band along the top

const navExt = () => Math.max(nav ? nav.L : 60, vals && vals.nv ? vals.nv.b : 0) * 1.02;
function navBox() {
  const nv = vals && vals.nv;
  if (!nv) return null;
  const w = nv.b - nv.a;
  if (navHold && Date.now() - navHold.t < 700) return { a: navHold.a, b: navHold.a + w };
  return { a: nv.a, b: nv.b };
}
function drawNav() {
  const cv = $("nav").querySelector("canvas"), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  const x = cv.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, W, H);
  x.fillStyle = "rgba(0,0,0,0.25)";
  x.fillRect(0, 0, W, H);
  const nv = vals && vals.nv;
  if (!nav || !nv) {
    x.fillStyle = css("--dim"); x.font = "12px -apple-system, system-ui, sans-serif";
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText("connecting…", W / 2, H / 2);
    return;
  }
  const ext = navExt(), X = t => t / ext * W;
  const top = NAV_RB + 2, lh = H - top;
  const ring = css("--ring"), dim = css("--dim"), text = css("--text");
  x.font = "11px -apple-system, system-ui, sans-serif"; x.textBaseline = "middle";
  // regions: a band with names, a faint wash down the lanes
  for (const r of nav.rg || []) {
    const x0 = X(r.s), x1 = Math.max(x0 + 2, X(r.e));
    const c = r.c || ring;
    x.fillStyle = withA(c, 0.07); x.fillRect(x0, top, x1 - x0, lh);
    x.fillStyle = withA(c, 0.55); x.fillRect(x0, 0, x1 - x0, NAV_RB);
    x.save(); x.beginPath(); x.rect(x0, 0, x1 - x0, NAV_RB); x.clip();
    x.fillStyle = text; x.textAlign = "left";
    x.fillText(r.n || ("Region " + r.x), x0 + 4, NAV_RB / 2 + 0.5);
    x.restore();
  }
  // the time selection
  if (nv.t1 > nv.t0) { x.fillStyle = "rgba(255,255,255,0.10)"; x.fillRect(X(nv.t0), top, X(nv.t1) - X(nv.t0), lh); }

  const lanes = nav.lanes || [], n = Math.max(1, lanes.length);
  const lph = lh / n, gap = lph >= 5 ? 1 : 0;
  const colOf = new Map((layout && layout.tracks || []).map(t => [t.i, t.c]));
  const bw = W / nav.n * (nav.L / ext);
  lanes.forEach((ln, k) => {
    const y = top + k * lph;
    x.fillStyle = withA(colOf.get(ln.i) || dim, 0.85);
    for (let j = 0; j < ln.s.length; j += 2) {
      const x0 = ln.s[j] * bw, x1 = (ln.s[j + 1] + 1) * bw;
      x.fillRect(x0, y, Math.max(1, x1 - x0), Math.max(1, lph - gap));
    }
  });
  // markers: a line, and the number and name on a dark tab in the region
  // band, cut short where the next marker's tab begins
  const mks = (nav.mk || []).slice().sort((a, b) => a.p - b.p);
  mks.forEach((m, k) => {
    const mx = Math.round(X(m.p)) + 0.5;
    const col = m.c || "#d94a4a";
    x.fillStyle = withA(col, 0.9);
    x.fillRect(mx - 0.5, 0, 1, H);
    const room = (k + 1 < mks.length ? X(mks[k + 1].p) : W) - mx - 4;
    let label = m.n ? m.x + " " + m.n : String(m.x);
    if (x.measureText(label).width + 8 > room) {
      while (label.length > String(m.x).length && x.measureText(label + "…").width + 8 > room) label = label.slice(0, -1);
      if (label !== String(m.x)) label = label.trimEnd() + "…";
    }
    const tw = x.measureText(label).width + 8;
    x.fillStyle = "rgba(0,0,0,0.55)"; x.fillRect(mx + 0.5, 1, tw, NAV_RB - 2);
    x.fillStyle = withA(col, 0.9); x.fillRect(mx + 0.5, 1, 2, NAV_RB - 2);
    x.textAlign = "left"; x.fillStyle = text;
    x.fillText(label, mx + 5, NAV_RB / 2 + 0.5);
  });
  // the arrange view's box
  const bx = navBox();
  if (bx) {
    const x0 = X(bx.a), x1 = Math.max(x0 + 6, X(bx.b));
    x.fillStyle = withA(css("--accent"), 0.14); x.fillRect(x0, 0, x1 - x0, H);
    x.strokeStyle = css("--accent"); x.lineWidth = 1.5; x.strokeRect(x0 + 0.75, 0.75, x1 - x0 - 1.5, H - 1.5);
  }
  // the edit cursor, and the playhead while playing
  x.fillStyle = withA(dim, 0.9); x.fillRect(Math.round(X(nv.c)), 0, 1, H);
  if (nv.pl) { x.fillStyle = text; x.fillRect(Math.round(X(nv.p)) - 0.5, 0, 2, H); }
}
(function wireNav() {
  const el = $("nav"), cv = el.querySelector("canvas");
  const at = e => {
    const r = cv.getBoundingClientRect();
    return { t: Math.max(0, (e.clientX - r.left) / Math.max(1, r.width) * navExt()), y: e.clientY - r.top, px: e.clientX };
  };
  const moveBox = p => {
    const bx = navBox(); if (!bx) return;
    const w = bx.b - bx.a;
    const a = Math.max(0, Math.min(navExt() - w, p.t - navDrag.off));
    navHold = { a, t: Date.now() };
    send("navview", a.toFixed(3));
    drawNav();
  };
  el.addEventListener("pointerdown", e => {
    if (!nav || !vals || !vals.nv) return;
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const p = at(e), bx = navBox();
    const tol = 12 / Math.max(1, cv.clientWidth) * navExt();
    const inBox = bx && p.y >= NAV_RB && p.t >= bx.a - tol && p.t <= bx.b + tol;
    navDrag = { x0: p.px, moved: false, band: p.y < NAV_RB, box: inBox, off: inBox ? p.t - bx.a : 0 };
  });

    if (!navDrag || !el.hasPointerCapture(e.pointerId)) return;
    const p = at(e);
    if (!navDrag.moved && Math.abs(p.px - navDrag.x0) > 8) {
      navDrag.moved = true;

    }

    if (!navDrag) return;
    const d = navDrag; navDrag = null;
    if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
    if (d.moved || e.type === "pointercancel") return;
    const p = at(e);
    if (d.band) {
      const r = (nav.rg || []).find(r => p.t >= r.s && p.t <= r.e);
      if (r) { send("navgo", r.s.toFixed(3)); return; }
    }
    send("navgo", p.t.toFixed(3));
  };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
})();
setInterval(() => { if (showNav) send("nav", 1); }, 3000);

// ---------------------------------------------------------------------------
// the mixer
// ---------------------------------------------------------------------------
// Below the plugins, behind a divider: drag it and it snaps to closed, half
// or full; tap it to open to half or close. Remembered per device. The
// bridge only sends the mixer's values while it's open (verb mix).
let mixState = "closed";
try { mixState = localStorage.getItem("tscv.mix") || "closed"; } catch (e) {}

  const avail = app.classList.contains("mixfull") ? $("mix").offsetHeight + $("main").offsetHeight : mixAvail();
  let px;
  if (typeof stateOrPx === "number") px = stateOrPx;
  else {
    mixState = stateOrPx;
    try { localStorage.setItem("tscv.mix", mixState); } catch (e) {}
    px = mixState === "full" ? avail : mixState === "half" ? Math.round(avail / 2) : 0;
  }

  if (typeof stateOrPx !== "number") app.classList.toggle("mixopen", mixState !== "closed");
  mix.style.height = px + "px";
  mix.classList.toggle("open", px > 0);

setInterval(() => { if (mixState !== "closed") send("mix", 1); }, 3000);
(function wireDivider() {

  d.addEventListener("pointermove", e => {

const lvPct = db => Math.max(0, Math.min(100, (db + 60) / 60 * 100));

// A slim pan control for a collapsed strip: a bar, a centre mark, the fill

function miniPan(onSet, onReset) {

  node.append(h("div", "mc"), mf, md);

  const show = v => {

    mf.style.left = `calc(2px + (100% - 4px) * ${Math.min(v, 0.5)})`;
    mf.style.width = `calc((100% - 4px) * ${Math.abs(v - 0.5)})`;

    last = now;
    node.setPointerCapture(e.pointerId); on = true;
    sx = e.clientX; sy = e.clientY; sv = cur;
