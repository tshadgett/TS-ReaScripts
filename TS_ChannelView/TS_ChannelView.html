// Mixer strips collapse one by one, per device, with a double tap where a
// single tap selects -- to the folded strip's narrow layout. Keyed by the
// track's GUID (the master by "master") so a collapse survives reordering.
let mxShut = new Set();
try { mxShut = new Set(JSON.parse(localStorage.getItem("tscv.mxshut") || "[]")); } catch (e) {}
const stripKey = t => t.m || t.i === 0 ? "master" : (t.g || ("n" + t.i));
function setMxShut(key, v) {
  if (v) mxShut.add(key); else mxShut.delete(key);
  try { localStorage.setItem("tscv.mxshut", JSON.stringify([...mxShut])); } catch (e) {}
  buildMixer(); buildTracks(); render();
}
// The tap that selects also starts the double tap. Remembered here, not on
// the strip: selecting can rebuild the mixer between the two taps.
let lastStripTap = null;
function stripTap(key, i, onDouble) {
  const now = Date.now();
  if (lastStripTap && lastStripTap.key === key && now - lastStripTap.t < 400) {
    lastStripTap = null; onDouble();
  } else {
    lastStripTap = { key, t: now };
    send("sel", i);
  }
}

function buildMixer() {
  const mix = $("mix");
  mix.innerHTML = "";
  ui.mix = new Map();
  if (mixState === "closed" || !layout) return;
  // A collapsed folder's child: the desktop's collapsed strip -- open the
  // folder, mute, solo, and the meter with the fader laid over it.
  // `user`: collapsed by a double tap, not by its folder -- opening it
  // undoes that rather than opening the folder.
  const folded = (t, user) => {
    const i = t.i, master = i === 0, key = stripKey(t);
    const el = h("div", "mxs fold");
    applyTint(el, t, "--panel", true);
    const nm = h("div", "mxc");
    if (t.c) nm.style.setProperty("--c", t.c);
    const ex = h("button", "fexp");
    ex.innerHTML = `<svg viewBox="0 0 24 24">${ICON.next}</svg>`;
    ex.setAttribute("aria-label", user ? "Open this strip" : "Open the folder");
    const open = () => {
      if (user) setMxShut(key, false);
      else for (const p of t.fb || []) send("fold", p, 0);
    };
    ex.addEventListener("click", open);
    const mp = miniPan(v => { touch("mp" + i, v); send("tpan", i, (v * 2 - 1).toFixed(3)); },
                       () => send("tpan0", i));
    const r1 = h("div", "mrow");
    const bm = h("button", "m", "M"), bs = h("button", "s", "S");
    bm.dataset.sw = "mute"; bm.dataset.i = i; bs.dataset.sw = "solo"; bs.dataset.i = i;
    r1.append(bm, bs);
    let br = null, bmo = null;
    if (master) { bmo = monoButton(); r1.append(bmo); }
    else { br = h("button", "r", "R"); br.dataset.sw = "arm"; br.dataset.i = i; r1.append(br); }
    const fm = h("div", "fm");
    const ml = h("div", "mtr"), mlv = h("div", "lv"); ml.append(mlv);
    const mr = h("div", "mtr"), mrv = h("div", "lv"); mr.append(mrv);
    const fdr = makeFader(30, ...faderLook(t.fl));
    fm.append(ml, mr, fdr.node);
    const vdb = h("div", "vdb", "");
    el.append(nm, ex, mp.node, fm, vdb, r1);
    let fvv = 0.7;
    dragger(fdr.node, () => fvv, v => { fvv = v; fdr.set(v); touch("mv" + i, v); send("tvol", i, v.toFixed(4)); },
      { travel: () => fdr.node.clientHeight, reset: () => send("tvol0", i) });
    el.addEventListener("click", e => {
      const tg = e.target;
      if (fdr.node.contains(tg) || (tg.closest && tg.closest("button, .mp"))) return;
      stripTap(key, i, open);
    });
    mix.append(el);
    ui.mix.set(i, { el, fdr, mlv, mrv, vdb, bm, bs, br, bmo, setVol: v => { fvv = v; },
      mp });
  };
  const strip = (i, name, col, key, fl, t) => {
    const master = i === 0;
    const el = h("div", "mxs");
    applyTint(el, t, "--panel", true);
    const nm = h("div", "mxc");
    if (col) nm.style.setProperty("--c", col);
    const pan = makeKnob(30, "arc", null, true);
    const pb = h("div", "knob"); pb.append(pan.svg);
    const pv = h("div", "val", "C");
    const pr = h("div", "pr"); pr.append(pb, pv);
    const fr = h("div", "sfr");
    const fdr = makeFader(Math.round(30 * fdK()), ...faderLook(fl));
    const ml = h("div", "mtr"), mlv = h("div", "lv"); ml.append(mlv);
    const mr = h("div", "mtr"), mrv = h("div", "lv"); mr.append(mrv);
    const mm = h("div", "mm"); mm.append(ml, mr);
    fr.append(fdr.node, mm);
    const vdb = h("div", "vdb", "");
    const r1 = h("div", "mrow");
    const bm = h("button", "m", "M"), bs = h("button", "s", "S");
    const sw = (b, key) => { b.dataset.sw = key; b.dataset.i = i; };
    sw(bm, "mute"); sw(bs, "solo");
    r1.append(bm, bs);
    let br = null, bp = null, bi = null, r2 = null, bmo = null;
    if (master) {
      // mono in the second row, so the master's fader and buttons sit on
      // the same lines as every other strip's
      r2 = h("div", "mrow");
      bmo = monoButton(); r2.append(bmo);
    } else {
      br = h("button", "r", "R"); sw(br, "arm");
      r1.append(br);
      r2 = h("div", "mrow");
      bp = h("button", "p", "ø"); bp.addEventListener("click", () => send("tset", i, "phase"));
      bi = h("button", "i", "–"); bi.addEventListener("click", () => send("tmon", i));
      r2.append(bp, bi);
    }
    el.append(nm, pr, fr, vdb, r1);
    if (r2) el.append(r2);
    let pvv = 0.5, fvv = 0.7;
    dragger(pb, () => pvv, v => { pvv = v; pan.set(v); touch("mp" + i, v); send("tpan", i, (v * 2 - 1).toFixed(3)); },
      { travel: 200, reset: () => send("tpan0", i) });
    dragger(fdr.node, () => fvv, v => { fvv = v; fdr.set(v); touch("mv" + i, v); send("tvol", i, v.toFixed(4)); },
      { travel: () => fdr.node.clientHeight, reset: () => send("tvol0", i) });
    // A tap anywhere on the strip but a control selects its track, as the
    // track's button underneath does. (A swipe that scrolls the mixer
    // doesn't count as a tap: the browser sends no click for it.)
    // ...and a double tap there collapses the strip.
    el.addEventListener("click", e => {
      const t = e.target;
      if (pb.contains(t) || fdr.node.contains(t) || (t.closest && t.closest("button"))) return;
      stripTap(key, i, () => setMxShut(key, true));
    });
    mix.append(el);
    ui.mix.set(i, { el, pan, pv, fdr, mlv, mrv, vdb, bm, bs, br, bp, bi, bmo,
      setPan: v => { pvv = v; }, setVol: v => { fvv = v; } });
  };
  if (mxShut.has("master")) folded({ i: 0, c: layout.mc, m: true, fl: layout.mfl }, true);
  else strip(0, "MASTER", layout.mc, "master", layout.mfl);
  for (const t of layout.tracks || []) {
    if (t.hm || t.fh) continue;
    if (t.sp) mix.append(h("div", "tsp"));
    if (t.fo) folded(t, false);
    else if (mxShut.has(stripKey(t))) folded(t, true);
    else strip(t.i, t.i + " " + t.n, t.c, stripKey(t), t.fl, t);
  }
}

// Mute, solo and record arm take a swipe, as on the desktop: press one and
// drag along the row, and every one of the same kind you cross follows the
// first. Not phase or monitoring -- a stray drag flipping six tracks'
// polarity is a bad afternoon.
(function wireSwipe() {
  const mix = $("mix");
  let sw = null;
  const hit = (key, x, y) => {
    const el = document.elementFromPoint(x, y);
    const b = el && el.closest && el.closest("[data-sw]");
    return b && b.dataset.sw === key ? b : null;
  };
  const apply = b => {
    const i = +b.dataset.i;
    if (sw.done.has(i)) return;
    sw.done.add(i);
    b.classList.toggle("on", sw.want);
    touch("sw" + sw.key + i, sw.want);
    send("tset", i, sw.key, sw.want ? 1 : 0);
  };
  mix.addEventListener("pointerdown", e => {
    const b = e.target.closest && e.target.closest("[data-sw]");
    if (!b) return;
    e.preventDefault();
    mix.setPointerCapture(e.pointerId);
    sw = { key: b.dataset.sw, want: !b.classList.contains("on"), done: new Set(), id: e.pointerId };
    apply(b);
  });
  mix.addEventListener("pointermove", e => {
    if (!sw || e.pointerId !== sw.id) return;
    const b = hit(sw.key, e.clientX, e.clientY);
    if (b) apply(b);
  });
  const end = e => { if (sw && e.pointerId === sw.id) sw = null; };
  mix.addEventListener("pointerup", end);
  mix.addEventListener("pointercancel", end);
})();

function renderMixer() {
  if (!ui.mix || !ui.mix.size || !vals || !vals.mx) return;
  for (const t of vals.mx) {
    const S = ui.mix.get(t.i);
    if (!S) continue;
    const pl = held("mp" + t.i), vl = held("mv" + t.i);
    const pan = pl ? pl.v : (t.pan + 1) / 2;
    if (S.pan) { S.pan.set(pan); S.setPan(pan); S.pv.textContent = panText(t.pan); }
    if (S.mp) S.mp.set(pan);
    const f = vl ? vl.v : t.f;
    S.fdr.set(f); S.setVol(f);
    S.vdb.textContent = t.db;
    S.mlv.style.height = lvPct(t.pl) + "%"; S.mrv.style.height = lvPct(t.pr) + "%";
    S.mlv.style.background = lvCol(t.pl); S.mrv.style.background = lvCol(t.pr);
    const hv = (k, v) => { const l = held("sw" + k + t.i); return l ? l.v : v; };
    S.bm.classList.toggle("on", hv("mute", !!t.m)); S.bs.classList.toggle("on", hv("solo", !!t.s));
    if (S.br) S.br.classList.toggle("on", hv("arm", !!t.r));
    if (S.bp) S.bp.classList.toggle("on", !!t.ph);
    if (S.bi) {
      S.bi.textContent = MON_TXT[t.mo || 0];
      S.bi.classList.toggle("on", t.mo === 1); S.bi.classList.toggle("au", t.mo === 2);
    }
    if (S.bmo) paintMono(S.bmo, monoOn());
    S.el.classList.toggle("sel", !!t.sel);
  }
}

// A track's fader look from the bridge ({ s: style, c: colour }, or none)
// as makeFader's style and cap.
const faderLook = fl => [fl && fl.s || "flat", fl && fl.c || null];

// Slim: a thin groove filled up to a small cap (out from the middle when
// centred) in the cap's colour -- TS_CV_Widgets.fader's slim, made for rows
// of narrow faders
function makeSlim(across, cap, bip) {
  const node = h("div", "fdr");
  Object.assign(node.style, { position: "relative", flexShrink: "0" });
  const fillCol = cap || "var(--accent)", face = cap || "var(--cap)";
  const groove = h("div"), fill = h("div"), c = h("div", "fcap"), line = h("div");
  if (across) {
    Object.assign(groove.style, { position: "absolute", top: "50%", left: "6px", right: "6px", height: "2px", marginTop: "-1px", background: "#0d0e0f" });
    Object.assign(fill.style, { position: "absolute", top: "50%", height: "3px", marginTop: "-1.5px", background: fillCol });
    Object.assign(c.style, { position: "absolute", top: "50%", width: "12px", height: "22px", marginTop: "-11px", borderRadius: "3px",
      background: face, border: "1px solid rgba(0,0,0,0.6)" });
    Object.assign(line.style, { position: "absolute", top: "3px", bottom: "3px", left: "50%", width: "1px",
      background: lum(cap || "#c9ccd0") > 0.55 ? "#1d1e20" : "#f0f0ee" });
  } else {
    Object.assign(groove.style, { position: "absolute", left: "50%", top: "6px", bottom: "6px", width: "2px", marginLeft: "-1px", background: "#0d0e0f" });
    Object.assign(fill.style, { position: "absolute", left: "50%", width: "3px", marginLeft: "-1.5px", background: fillCol });
    Object.assign(c.style, { position: "absolute", left: "0", right: "0", height: "12px", borderRadius: "3px",
      background: face, border: "1px solid rgba(0,0,0,0.6)" });
    Object.assign(line.style, { position: "absolute", left: "3px", right: "3px", top: "50%", height: "1px",
      background: lum(cap || "#c9ccd0") > 0.55 ? "#1d1e20" : "#f0f0ee" });
  }
  c.append(line);
  node.append(groove, fill, c);
  return { node, set(v) {
    if (across) {
      const W = node.clientWidth || 160, T = W - 12 - 12, at = u => 6 + 6 + u * T;
      c.style.left = (6 + v * T) + "px";
      const a = bip ? at(0.5) : 6, b = at(v);
      fill.style.left = Math.min(a, b) + "px"; fill.style.width = Math.abs(b - a) + "px";
    } else {
      const H = node.clientHeight || 200, T = H - 12 - 12, at = u => 6 + 6 + (1 - u) * T;
      c.style.top = (6 + (1 - v) * T) + "px";
      const a = bip ? at(0.5) : H - 6, b = at(v);
      fill.style.top = Math.min(a, b) + "px"; fill.style.height = Math.abs(b - a) + "px";
    }
  } };
}

// A concentric knob (TS_CV_Widgets.dual_face): a dark knurled ring with a
// white pointer for the first parameter, a matte cap-coloured knob in its
// middle for the second. Drawn where the ring's edge is 40 units, scaled so
// it fills the dial's size the way the other knobs' bodies do.
function makeDual(D, cap, md1, md2, st) {
  if (st === "arc" || !layout.tex) return makeDualArc(D, cap, md1, md2);
  const svg = el("svg", { width: D, height: D, viewBox: "0 0 100 100", class: "kn" });
  svg.style.overflow = "visible";
  svg.style.setProperty("--kr", (D * 0.4).toFixed(1) + "px");
  const tk = el("path", { d: radial(11, 53, 60, -135, 135), fill: "none", stroke: "var(--ring)",
    "stroke-width": 3, "stroke-linecap": "round" }, svg);
  const id = "dl" + (++gradN), id2 = "dl" + (++gradN);
  const defs = el("defs", {}, svg);
  // lit as the desktop's: the ring's edge catching the light top left, the inner a satin dome
  const lg = el("linearGradient", { id, x1: "0.2", y1: "0.1", x2: "0.8", y2: "0.9" }, defs);
  el("stop", { offset: 0, "stop-color": "#4a4d52" }, lg); el("stop", { offset: 0.5, "stop-color": "#1b1c1f" }, lg);
  el("stop", { offset: 1, "stop-color": "#0d0e10" }, lg);
  const rg = el("radialGradient", { id: id2, cx: "0.36", cy: "0.3", r: "0.8" }, defs);
  el("stop", { offset: 0, "stop-color": "#fff", "stop-opacity": 0.22 }, rg);
  el("stop", { offset: 0.55, "stop-color": "#fff", "stop-opacity": 0 }, rg);
  el("stop", { offset: 1, "stop-color": "#000", "stop-opacity": 0.32 }, rg);
  const g = el("g", { transform: "translate(50 50) scale(1.25) translate(-50 -50)" }, svg);
  el("circle", { cx: 50, cy: 50, r: 40, fill: `url(#${id})` }, g);
  const ring = el("circle", { cx: 50, cy: 50, r: 36, fill: "#1b1c1f" }, g);
  const kn = el("g", {}, g);
  el("path", { d: radial(36, 36.5, 39.6, 0, 350), fill: "none", stroke: "rgba(12,13,14,0.55)", "stroke-width": 1.4 }, kn);
  el("circle", { cx: 50, cy: 50, r: 36, fill: `url(#${id2})`, opacity: 0.5 }, g);
  el("circle", { cx: 50, cy: 50, r: 40, fill: "none", stroke: "rgba(0,0,0,0.6)", "stroke-width": 1.2 }, g);
  const r1 = el("g", {}, g);
  el("line", { x1: 50, y1: 14, x2: 50, y2: 23, stroke: "#f3f3f1", "stroke-width": 4, "stroke-linecap": "round" }, r1);
  el("circle", { cx: 50, cy: 50, r: 24.5, fill: "#0b0c0d" }, g);
  el("circle", { cx: 51.2, cy: 51.6, r: 23.5, fill: "rgba(0,0,0,0.35)" }, g);      // the inner's shadow on the ring
  const c = cap || PAL.knob_fill || "#4aa3df";
  const inner = el("circle", { cx: 50, cy: 50, r: 22.5, fill: c, stroke: "rgba(0,0,0,0.5)", "stroke-width": 1.2 }, g);
  el("circle", { cx: 50, cy: 50, r: 22.5, fill: `url(#${id2})` }, g);
  const r2 = el("g", {}, g);
  el("line", { x1: 50, y1: 31, x2: 50, y2: 43, stroke: lum(c) > 0.55 ? "#1d1e20" : "#f3f3f1", "stroke-width": 3.5, "stroke-linecap": "round" }, r2);
  if (md2) { const col = modCol(c); el("circle", { cx: 50, cy: 50, r: 6.5, fill: lum(col) > 0.55 ? "rgba(0,0,0,0.7)" : "rgba(255,255,255,0.7)" }, g); el("circle", { cx: 50, cy: 50, r: 4.5, fill: col }, g); }
  if (md1) { const col = modCol("#1b1c1f"); el("circle", { cx: 50, cy: 81, r: 3.6, fill: lum(col) > 0.55 ? "rgba(0,0,0,0.7)" : "rgba(255,255,255,0.7)" }, g); el("circle", { cx: 50, cy: 81, r: 2.6, fill: col }, g); }
  lightWash(svg, 50);
  return { svg,
    set(a, b) { const t1 = -135 + 270 * a, t2 = -135 + 270 * b;
      kn.setAttribute("transform", `rotate(${f2(t1)} 50 50)`); r1.setAttribute("transform", `rotate(${f2(t1)} 50 50)`);
      r2.setAttribute("transform", `rotate(${f2(t2)} 50 50)`); },
    hot(z) { ring.setAttribute("fill", z === "outer" ? "#2a2c30" : "#1b1c1f");
      inner.setAttribute("fill", z === "inner" ? mixHex(c, "#ffffff", 0.1) : c); } };
}

// The flat concentric knob (TS_CV_Widgets dual_arc), as the Arc knob: the
// outer value's arc round the outside, a flat knob inside with the inner
// value's arc in the cap colour, and two pointers -- the long one the
// outer's, reaching out to its arc.
function makeDualArc(D, cap, md1, md2) {
  const svg = el("svg", { width: D, height: D, viewBox: "0 0 100 100", class: "kn flat" });
  svg.style.overflow = "visible";
  const RK = 39, RI = 31;
  el("path", { d: arcPath(46, A0, A1), fill: "none", stroke: "var(--track)", "stroke-width": 7 }, svg);
  const f1 = el("path", { fill: "none", stroke: "var(--fill)", "stroke-width": 7 }, svg);
  el("circle", { cx: 50, cy: 50, r: RK, fill: "var(--body)", stroke: "var(--ring)", "stroke-width": 2 }, svg);
  const body = el("circle", { cx: 50, cy: 50, r: RK - 1, fill: "#fff", "fill-opacity": 0 }, svg);   // lit when hovered
  el("path", { d: arcPath(RI, A0, A1), fill: "none", stroke: "var(--track)", "stroke-width": 6 }, svg);
  const f2p = el("path", { fill: "none", stroke: cap || "var(--fill-bi)", "stroke-width": 6 }, svg);
  const p1 = el("g", {}, svg), p2 = el("g", {}, svg);
  el("line", { x1: 50, y1: 50 - (RK - 2), x2: 50, y2: 1, stroke: "var(--pointer)", "stroke-width": 5, "stroke-linecap": "round" }, p1);
  el("line", { x1: 50, y1: 50 - RK * 0.2, x2: 50, y2: 50 - (RI - 7), stroke: "var(--pointer)", "stroke-width": 5, "stroke-linecap": "round" }, p2);
  if (md2) { const col = modCol(cap || "#d9893a"); el("circle", { cx: 50, cy: 50, r: 5, fill: col }, svg); }
  if (md1) { const col = modCol("#4aa3df"); el("circle", { cx: 50, cy: 96, r: 4, fill: col }, svg); }
  return { svg,
    set(a, b) { const t1 = A0 + (A1 - A0) * a, t2 = A0 + (A1 - A0) * b;
      f1.setAttribute("d", arcPath(46, A0, t1)); f2p.setAttribute("d", arcPath(RI, A0, t2));
      p1.setAttribute("transform", `rotate(${f2(t1)} 50 50)`); p2.setAttribute("transform", `rotate(${f2(t2)} 50 50)`); },
    hot(z) { body.setAttribute("fill-opacity", z ? 0.07 : 0); } };
}

// An XY pad (TS_CV_Widgets.xypad): set into the panel, a faint grid with
// the centre lines stronger, a crosshair and a dot in the cap colour.
function makeXY(W, H, cap) {
  const node = h("div", "xyp");
  node.style.width = W + "px"; node.style.height = H + "px";
  const col = cap || PAL.knob_fill || "#4aa3df";
  node.style.setProperty("--xc", col);
  const vx = h("div", "xv"), hz = h("div", "xh"), dot = h("div", "xd");
  node.append(vx, hz, dot);
  return { node, set(a, b) {
    const d = 7, w = node.clientWidth || W, hh = node.clientHeight || H;
    const x = d + a * (w - 2 * d), y = d + (1 - b) * (hh - 2 * d);
    vx.style.left = x + "px"; hz.style.top = y + "px";
    dot.style.left = x + "px"; dot.style.top = y + "px";
  } };
}

// A fader lying across: the same caps on their side, left the bottom.
function makeHFader(style, cap, bip) {
  if (style === "slim") return makeSlim(true, cap, bip);
  const node = h("div", "fdr");
  Object.assign(node.style, { position: "relative", flexShrink: "0" });
  const slot = h("div"); Object.assign(slot.style, { position: "absolute", top: "50%", left: "6px", right: "6px",
    height: "4px", marginTop: "-2px", background: "#0d0e0f", borderRadius: "2px", border: "1px solid var(--ring)" });
  const capW = style === "console" ? 36 : style === "rail" ? 44 : 20;
  const c = h("div", "fcap"); Object.assign(c.style, { position: "absolute", top: "50%", transform: "translateY(-50%)",
    height: style === "rail" ? "min(26px, calc(100% - 8px))" : "min(28px, 100%)", width: capW + "px", borderRadius: style === "rail" ? "5px" : "3px", border: "1px solid rgba(0,0,0,0.6)" });
  if (style === "console") c.style.background = `linear-gradient(90deg,#4c5056,#2a2d31 50%,#1a1c1f)`;
  else if (style === "rail") c.style.background = `linear-gradient(180deg, rgba(255,255,255,0.3), transparent 45%, rgba(0,0,0,0.3)), ${cap || "#8d9298"}`;

    x.fillText(m1, W / 2, H / 2 - (m2 ? 6 : 0));

  } else {
    const N = t.o.length, ix0 = 2, pw = W - 4, cw = pw / N;

    if (t.b > 1) {

      for (let b = 1; b < t.b; b++) x.fillRect(Math.floor(ix0 + pw * b / t.b), 1, 1, H - 2);

    const q = (s, k) => (B64V[s.charCodeAt(k)] || 0) / 63;

    for (let k = 0; k < N; k++) {
      const e = Math.min(1, q(t.i, k)) * hh;

    x.fillStyle = withA(gc, 0.14);

  x.fillStyle = K.dim;

}

// Press and hold a panel's header, then drag it along the row. The marker
// shows where it will land; letting go there moves it.
function wirePanelDrag(pnl, p) {
  const head = pnl.querySelector(".ph");
  let timer = null, dragging = false, sx = 0, sy = 0, gap = null, pid = null;
  const row = $("row");
  // the panel under the finger decides, as on the desktop: its left half
  // drops before it, its right half after it, in whatever container it's
  // in; past the last panel is the end of the chain
  const all = () => [...row.querySelectorAll(".pnl")].map(el => ({ el, p: (layout.fx || []).find(f => f.g === el.dataset.g) }))
    .filter(t => t.p && t.p.ix != null);
  const gapAt = x => {
    const ts = all();
    for (const t of ts) {
      const r = t.el.getBoundingClientRect();
      if (x < r.right + 8) {
        const before = x < r.left + r.width / 2;
        return { level: t.p.pp || "", gap: t.p.ix + (before ? 0 : 1), x: before ? r.left : r.right + 4, into: !!t.p.bx };
      }
    }
    const last = ts[ts.length - 1];
    if (!last) return null;
    const r = last.el.getBoundingClientRect();
    return { level: "", gap: topCount(), x: r.right + 4, into: false };
  };
  const cancel = () => { clearTimeout(timer); timer = null; };
  head.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    sx = e.clientX; sy = e.clientY; pid = e.pointerId;
    cancel();
    timer = setTimeout(() => {
      dragging = true;
      head.setPointerCapture(pid);
      pnl.classList.add("lift");
      if (navigator.vibrate) navigator.vibrate(10);
    }, 380);
  });
  head.addEventListener("pointermove", e => {
    if (!dragging) {
      if (Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel();
      return;
    }
    e.preventDefault();
    const g = gapAt(e.clientX);
    const drop = $("drop");
    if (!g) return;
    gap = g;
    const rr = row.getBoundingClientRect();
    drop.style.left = (g.x - rr.left + row.scrollLeft - 4) + "px";
    drop.style.background = g.into ? "var(--brkc)" : "";
    drop.style.display = "block";
    // keep the row scrolling under a finger near either edge
    if (e.clientX > rr.right - 40) row.scrollLeft += 12;
    else if (e.clientX < rr.left + 40) row.scrollLeft -= 12;
  });
  const end = () => {
    cancel();
    if (!dragging) return;
    dragging = false;
    pnl.classList.remove("lift");
    $("drop").style.display = "none";
    if (gap && !((gap.level === (p.pp || "")) && (gap.gap === p.ix || gap.gap === p.ix + 1)))
      send("fxmv", p.g, gap.level, gap.gap);
    gap = null;
  };
  head.addEventListener("pointerup", end);
  head.addEventListener("pointercancel", end);
}

// The add-a-plugin sheet: search plus your FX folders, categories and
// developers, as the desktop picker has. `at` is the top-level slot to
// insert before, or -1 for the end.
let fxSeq = 0;
function pickPlugin(at, level = "") {
  let kind = "", val = "", timer = null;
  openSheet(sh => {
    sh.classList.add("pk");
    sh.append(h("h3", null, level ? "Add into the container" : at < 0 ? "Add plugin" : "Insert plugin"));
    const q = h("input", "fld"); q.placeholder = "Search plugins (e.g. fab sat)";
    q.setAttribute("autocapitalize", "off"); q.setAttribute("autocorrect", "off");
    const flt = h("div", "flt");
    const sel = h("select");
    sel.append(new Option("All plugins", ""));
    flt.append(sel);
    const res = h("div", "res");
    sh.append(q, flt, res);
    let treeLoaded = false;
    const fillTree = tree => {
      if (treeLoaded || !tree) return;
      treeLoaded = true;
      const group = (label, list, k, useId) => {
        if (!list || !list.length) return;
        const g = document.createElement("optgroup"); g.label = label;
        for (const it of list) g.append(new Option(`${it.n}  (${it.c})`, k + "\t" + (useId ? it.id : it.n)));
        sel.append(g);
      };
      group("FX folders", tree.folders, "folder", true);
      group("Categories", tree.cats, "cat");
      group("Developers", tree.devs, "dev");
    };
    let searched = null;   // the query the list on screen is for
    const go = async () => {
      const mine = ++fxSeq;
      const clean = t => String(t).replace(/[|~]/g, " ");
      send("fxfind", mine, clean(q.value), kind, clean(val));
      const asked = q.value;
      for (let k = 0; k < 30 && mine === fxSeq; k++) {
        await new Promise(r => setTimeout(r, 120));
        try {
          const r = await reaper(`GET/EXTSTATE/${NS}/fxfound`);
          const f = r.ext.fxfound ? JSON.parse(r.ext.fxfound) : null;
          if (!f || f.s !== mine) continue;
          fillTree(f.tree);
          searched = asked;
          res.innerHTML = "";
          let recentHdr = false, allHdr = false;
          if (!f.r.length) res.append(h("div", "lbl", "Nothing found"));
          for (const e of f.r) {
            if (e.r && !recentHdr) { res.append(h("div", "hdr", "Recent")); recentHdr = true; }
            if (!e.r && recentHdr && !allHdr) { res.append(h("div", "hdr", "All")); allHdr = true; }
            const o = h("button", "opt");
            if (e.f) {
              const fm = h("span", "fm", e.f), fc = layout && layout.fmt && (layout.fmt[e.f] || layout.fmt.__other);
              if (fc) { fm.style.background = fc.bg; fm.style.color = fc.fg; fm.style.borderColor = fc.bg; }
              o.append(fm);
            }
            o.append(h("span", null, e.n), h("span", "vn", e.v || ""));
            o.addEventListener("click", () => { send("fxadd", encodeURIComponent(e.id), at, level); closeSheet(); });
            res.append(o);
          }
          return;
        } catch (err) {}
      }
    };
    q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(go, 200); });
    // Enter adds the first plugin found (searching first if it hasn't yet)
    q.addEventListener("keydown", async e => {
      if (e.key !== "Enter") return;
      clearTimeout(timer);
      if (searched !== q.value) await go();
      const first = res.querySelector("button.opt");
      if (first) first.click();
    });
    sel.addEventListener("change", () => {
      const [k, v] = sel.value.split("\t");
      kind = sel.value ? k : ""; val = sel.value ? v : "";
      go();
    });
    go();
    setTimeout(() => q.focus(), 60);
  });
}

// ---------------------------------------------------------------------------
// ReaEQ -- the canvas the desktop draws (TS_CV_EQPanel), at touch size
// ---------------------------------------------------------------------------
// The curve is computed here from the bands the bridge reads: RBJ cookbook
// biquads, with ReaEQ's inverted Q, exactly as TS_CV_ReaEQ.coeffs does.
const BT = { HP: 0, LS: 1, BELL: 2, NOTCH: 3, HS: 4, LP: 5, BP: 6, PBP: 7 };
const BT_NAME = { 0: "High pass", 1: "Low shelf", 2: "Bell", 3: "Notch", 4: "High shelf", 5: "Low pass", 6: "Band pass", 7: "Band pass" };
const BT_MENU = [0, 1, 2, 3, 4, 5];
const HAS_GAIN = { 1: true, 2: true, 4: true };

function coeffs(bt, f, g, q, sr) {
  f = Math.max(1, Math.min(sr * 0.499, f)); q = Math.max(0.05, q || 1);

  else if (bt === BT.LP) { b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = b0; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha; }
  else if (bt === BT.NOTCH) { b0 = 1; b1 = -2 * cw; b2 = 1; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha; }
  else if (bt === BT.BP || bt === BT.PBP) { b0 = alpha; b1 = 0; b2 = -alpha; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha; }
  else if (bt === BT.LS || bt === BT.HS) {
    const sa = sw / 2 * Math.sqrt(Math.max(0, (A + 1 / A) * (q - 1) + 2)), sq = Math.sqrt(A);
    if (bt === BT.LS) {
      b0 = A * ((A + 1) - (A - 1) * cw + 2 * sq * sa); b1 = 2 * A * ((A - 1) - (A + 1) * cw);
      b2 = A * ((A + 1) - (A - 1) * cw - 2 * sq * sa); a0 = (A + 1) + (A - 1) * cw + 2 * sq * sa;
      a1 = -2 * ((A - 1) + (A + 1) * cw); a2 = (A + 1) + (A - 1) * cw - 2 * sq * sa;
    } else {
      b0 = A * ((A + 1) + (A - 1) * cw + 2 * sq * sa); b1 = -2 * A * ((A - 1) + (A + 1) * cw);
      b2 = A * ((A + 1) + (A - 1) * cw - 2 * sq * sa); a0 = (A + 1) - (A - 1) * cw + 2 * sq * sa;
      a1 = 2 * ((A - 1) - (A + 1) * cw); a2 = (A + 1) - (A - 1) * cw - 2 * sq * sa;
    }
  } else { b0 = 1 + alpha * A; b1 = -2 * cw; b2 = 1 - alpha * A; a0 = 1 + alpha / A; a1 = -2 * cw; a2 = 1 - alpha / A; }

}

  if (!b.e) return 0;
  const [b0, b1, b2, a1, a2] = coeffs(b.t, b.f, b.g, b.q, sr);
  const w = 2 * Math.PI * f / sr, c1 = Math.cos(w), s1 = Math.sin(w), c2 = Math.cos(2 * w), s2 = Math.sin(2 * w);

  return 20 * Math.log10(Math.max(1e-9, Math.sqrt(nr * nr + ni * ni) / Math.max(1e-12, Math.sqrt(dr * dr + di * di))));

const bandHue = i => (200 + i * 137.5) % 360;
const bandCol = (i, a) => `hsla(${bandHue(i)}, 62%, 58%, ${a == null ? 1 : a})`;
const fmtHz = f => f >= 1000 ? (f / 1000).toFixed(f >= 10000 ? 1 : 2) + " kHz" : Math.round(f) + " Hz";

function buildEq(p, bodyH) {
  const w = EQ_W + PAD * 2;
  const pnl = h("div", "pnl");
  pnl.style.width = w + "px";
  const head = h("div", "ph");
  const byp = h("button", "hb"); byp.innerHTML = `<svg viewBox="0 0 24 24">${ICON.power}</svg>`;
  byp.addEventListener("click", () => send("byp", p.g));
  const flt = h("button", "hb fl"); flt.innerHTML = `<svg viewBox="0 0 24 24">${ICON.float}</svg>`;
  flt.addEventListener("click", () => send("float", p.g));
  const col = h("button", "hb col"); col.innerHTML = `<svg viewBox="0 0 24 24">${ICON.collapse}</svg>`;
  const fold = () => {
    if (shut.has(p.g)) shut.delete(p.g); else shut.add(p.g);
    saveShut(); pnl.classList.toggle("shut", shut.has(p.g));
  };
  col.addEventListener("click", fold);
  doubleTap(head, fold);
  if (shut.has(p.g)) pnl.classList.add("shut");
  const wet = wetChip(p, w);
  head.append(h("span", "ix", p.i), h("span", "nm", p.n), ...(wet ? [wet] : []), moreBtn(p), col, flt, byp);
  const body = h("div", "pb");
  pnl.append(head, body);
  const cv = h("canvas", "eqc");
  const ch = Math.max(120, bodyH - EQ_STRIP - 8);
  const dpr = window.devicePixelRatio || 1;
  cv.width = EQ_W * dpr; cv.height = ch * dpr; cv.style.height = ch + "px"; cv.style.width = EQ_W + "px";
  const strip = h("div", "eqs");
  body.append(cv, strip);

  const R = layout.eqr || { lo: 20, hi: 20000, g: 18 }, sr = layout.sr || 48000;
  const st = { bands: [], master: 0, sel: null, drag: null, over: new Map(), tap: null };
  const key = b => b.t + ":" + b.i;
  const X = f => Math.log(Math.max(R.lo, Math.min(R.hi, f)) / R.lo) / Math.log(R.hi / R.lo) * EQ_W;
  const F = x => R.lo * Math.pow(R.hi / R.lo, Math.max(0, Math.min(1, x / EQ_W)));
  const top = 10, gh = ch - 20;
  const Y = db => top + gh / 2 - (db / R.g) * gh / 2;
  const G = y => (top + gh / 2 - y) / (gh / 2) * R.g;

  // A band as the user is moving it wins over what the bridge last read,
  // until the bridge catches up or the finger has been still a moment.
  function bandsNow() {
    const now = Date.now();
    return st.bands.map(b => {
      const o = st.over.get(key(b));
      if (o && now - o.t < 700) return Object.assign({}, b, o.v);
      return b;
    });
  }

  function draw() {
    const c = cv.getContext("2d");
    c.setTransform(dpr, 0, 0, dpr, 0, 0);
    c.clearRect(0, 0, EQ_W, ch);
    c.fillStyle = "rgba(0,0,0,0.22)"; c.fillRect(0, 0, EQ_W, ch);
    // The track's spectrum behind it all, as the desktop draws it: from
    // Track Analyser's probe when it's running (vals.sp), filled to the
    // bottom of the canvas -- a level backdrop, not another gain curve.
    const sp = vals && vals.sp;
    if (sp && sp.d && sp.d.length > 1) {
      const n = sp.d.length, sc = css("--spec");
      c.beginPath(); c.moveTo(0, ch);
      for (let i = 0; i < n; i++) {
        const f = sp.lo * Math.pow(sp.hi / sp.lo, (i + 0.5) / n);
        c.lineTo(X(f), ch - Math.max(0, B64V[sp.d.charCodeAt(i)]) / 63 * ch);
      }
      c.lineTo(EQ_W, ch); c.closePath();
      c.fillStyle = withA(sc, 0.19); c.fill();
      c.beginPath();
      for (let i = 0; i < n; i++) {
        const f = sp.lo * Math.pow(sp.hi / sp.lo, (i + 0.5) / n);
        const y = ch - Math.max(0, B64V[sp.d.charCodeAt(i)]) / 63 * ch;
        if (i) c.lineTo(X(f), y); else c.moveTo(X(f), y);
      }
      c.strokeStyle = withA(sc, 0.56); c.lineWidth = 1; c.stroke();
    }
    c.lineWidth = 1;
    c.strokeStyle = css("--ring"); c.globalAlpha = 0.5;
    c.font = "11px -apple-system, system-ui, sans-serif"; c.fillStyle = css("--dim");
    for (const f of [50, 100, 200, 500, 1000, 2000, 5000, 10000]) {
      const x = Math.round(X(f)) + 0.5;
      c.beginPath(); c.moveTo(x, 0); c.lineTo(x, ch); c.stroke();
      c.globalAlpha = 0.9; c.fillText(f >= 1000 ? f / 1000 + "k" : String(f), x + 3, ch - 4); c.globalAlpha = 0.5;
    }
    for (let d = -R.g; d <= R.g; d += 6) {
      const y = Math.round(Y(d)) + 0.5;
      c.globalAlpha = d === 0 ? 0.9 : 0.4;
      c.beginPath(); c.moveTo(0, y); c.lineTo(EQ_W, y); c.stroke();
      if (d !== 0) { c.globalAlpha = 0.9; c.fillText((d > 0 ? "+" : "") + d, 4, y - 3); }
    }
    c.globalAlpha = 1;
    const bands = bandsNow();
    const N = 220, xs = [], y0 = Y(0);
    for (let i = 0; i < N; i++) xs.push(i / (N - 1) * EQ_W);
    bands.forEach((b, bi) => {
      if (!b.e) return;
      const ys = xs.map(x => Y(Math.max(-R.g * 1.5, Math.min(R.g * 1.5, bandDb(b, F(x), sr)))));
      c.beginPath(); c.moveTo(xs[0], y0);
      xs.forEach((x, i) => c.lineTo(x, ys[i]));
      c.lineTo(xs[N - 1], y0); c.closePath();
      c.fillStyle = bandCol(bi, 0.16); c.fill();
      c.beginPath(); xs.forEach((x, i) => i ? c.lineTo(x, ys[i]) : c.moveTo(x, ys[i]));
      c.strokeStyle = bandCol(bi, 0.7); c.lineWidth = 1.2; c.stroke();
    });
    const tot = xs.map(x => { let d = st.master; for (const b of bands) d += bandDb(b, F(x), sr); return Y(Math.max(-R.g * 1.5, Math.min(R.g * 1.5, d))); });
    c.beginPath(); xs.forEach((x, i) => i ? c.lineTo(x, tot[i]) : c.moveTo(x, tot[i]));
    c.strokeStyle = css("--accent"); c.lineWidth = 2.4; c.stroke();

      if (!b.e) return;
      const x = X(b.f), y = HAS_GAIN[b.t] ? Y(Math.max(-R.g, Math.min(R.g, b.g))) : Y(0);
      const sel = st.sel === key(b);

      c.fillStyle = bandCol(bi); c.fill();

    });

  let stripSig = null;
  function paintStrip() {
    const bands = bandsNow();
    const bi = bands.findIndex(b => key(b) === st.sel && b.e);
    // Only rebuilt when something it shows changed: a rebuild between a
    // finger going down and coming up would swallow the tap.
    const sb = bi >= 0 ? bands[bi] : null;
    const sig = sb ? [st.sel, sb.t, sb.f.toFixed(0), sb.g.toFixed(1), sb.q.toFixed(2)].join("|") : "none";
    if (sig === stripSig) return;
    stripSig = sig;
    strip.innerHTML = "";
    if (bi < 0) {
      st.sel = null;
      strip.append(h("span", null, "Double-tap to add a band · drag a node to move it · tap one to select"));
      return;
    }
    const b = bands[bi];
    const dot = h("span", "dot"); dot.style.background = bandCol(bi);
    const tb = h("button", null, BT_NAME[b.t] || "Band");
    tb.addEventListener("click", () => openSheet(sh => {
      sh.append(h("h3", null, "Band type"));
      for (const t of BT_MENU) {
        const o = h("button", "opt" + (t === b.t ? " cur" : ""), BT_NAME[t]);
        o.addEventListener("click", () => { if (t !== b.t) { send("eqtype", p.g, b.t, b.i, t); st.sel = null; } closeSheet(); });
        sh.append(o);
      }
    }));
    const qd = h("div", "qd", "Q " + b.q.toFixed(2));
    let q0 = b.q, x0 = 0;
    qd.addEventListener("pointerdown", e => { e.preventDefault(); qd.setPointerCapture(e.pointerId); x0 = e.clientX; q0 = bandsNow()[bi].q; st.qdrag = true; });
    qd.addEventListener("pointerup", () => { st.qdrag = false; });
    qd.addEventListener("pointercancel", () => { st.qdrag = false; });
    qd.addEventListener("pointermove", e => {
      if (!qd.hasPointerCapture(e.pointerId)) return;
      const q = Math.max(0.05, Math.min(20, q0 * Math.pow(2, (e.clientX - x0) / 90)));
      st.over.set(key(b), { t: Date.now(), v: Object.assign({}, (st.over.get(key(b)) || {}).v, { q }) });
      qd.textContent = "Q " + q.toFixed(2);
      send("eqq", p.g, b.t, b.i, q.toFixed(3)); draw();
    });
    const rd = h("span", "rd", fmtHz(b.f) + (HAS_GAIN[b.t] ? "   " + (b.g > 0 ? "+" : "") + b.g.toFixed(1) + " dB" : ""));
    const rm = h("button", "rm", "Remove");
    rm.addEventListener("click", () => { send("eqrem", p.g, b.t, b.i); st.sel = null; stripSig = null; paintStrip(); });
    strip.append(dot, tb, qd, rd, rm);
  }

  function hit(x, y) {
    let best = null, bd = 26;
    bandsNow().forEach(b => {
      if (!b.e) return;
      const bx = X(b.f), by = HAS_GAIN[b.t] ? Y(Math.max(-R.g, Math.min(R.g, b.g))) : Y(0);
      const d = Math.hypot(bx - x, by - y);
      if (d < bd) { bd = d; best = b; }
    });

function mapLimitCanvas(p, P, hold, CW, bodyH) {
  const I = p.mc.i || {};
  if (!Object.keys(I).length) { mapSetupNote(hold, "This limiter layout has no roles yet. Set it up in ChannelView on the desktop."); return; }
  const g = roleCanvas(hold, CW, bodyH), { cv, W_, ch, dpr, gw } = g;
  const VIA_IN = I.t == null && I.in != null;
  const st = { v: null, drag: null };
  function lv(v) {
    let ceil = 0, thr = null;
    if (I.ce != null) ceil = RT.isDb(v, "ce") ? v.v.ce : -12 + (v.n.ce || 0) * 12;
    if (I.t != null) thr = RT.isDb(v, "t") ? v.v.t : -30 + (v.n.t || 0) * 30;
    // a gain into the ceiling (no threshold): the ceiling its threshold,
    // the gain a bar of its own
    const D = VIA_IN ? driveOf(p, v, ceil, "limit", (verb, k, val) => send(verb, p.g, k, val)) : null;
    const TOP = Math.max(3, ceil + 3), BOT = D ? Math.max(-72, Math.min(-30, ceil - 36))
      : Math.max(-72, Math.min(-30, (thr == null ? -12 : thr) - 18));
    return { ceil, thr, D, TOP, BOT, Y: db => (TOP - db) / (TOP - BOT) * ch };
  }
  function draw() {
    const v = st.v, c = cv.getContext("2d");
    c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W_, ch);
    c.fillStyle = "rgba(0,0,0,0.22)"; c.fillRect(0, 0, W_, ch);
    if (!v) return;
    const L = lv(v); st.L = L;
    c.font = "11px -apple-system, system-ui, sans-serif";
    c.strokeStyle = css("--ring"); c.globalAlpha = 0.4;
    for (let d = 0; d >= -72; d -= 6) { const y = Math.round(L.Y(d)) + 0.5; if (y > ch) break; c.beginPath(); c.moveTo(0, y); c.lineTo(gw, y); c.stroke(); }

    if (gr > 0.05) { c.fillStyle = withA(css("--fill-bi") || "#d9a33a", 0.2); c.fillRect(0, 0, gw, Math.min(ch * 0.4, gr / 18 * ch)); }
    const red = "#e05a5a";
    RT.hline(c, L.Y(L.ceil), gw, red, true); if (I.ce != null) RT.pill(c, gw - 40, L.Y(L.ceil), red);
    c.fillStyle = red; c.fillText("Ceiling " + (I.ce != null ? (v.x.ce || "") : "0 dB"), 8, L.Y(L.ceil) + 14);
    if (L.D) {
      L.barY = driveBar(c, L.D, L.Y, gw, ch, v.x.in, "ceiling");
    } else if (L.thr != null) {
      RT.hline(c, L.Y(L.thr), gw, css("--accent"), false); RT.pill(c, gw - 40, L.Y(L.thr), css("--accent"));
      c.fillStyle = css("--value");
      c.fillText((v.x.t || "") + "  Threshold  ·  gain " + ((L.ceil - L.thr) >= 0 ? "+" : "") + (L.ceil - L.thr).toFixed(1) + " dB", 8, L.Y(L.thr) - 6);
    }
    st.rel = null;
    if (I.l != null) {
      const bx = 8, bw = 176, bh = 44, by = ch - bh - 8;
      c.fillStyle = withA(css("--panel") || "#202327", 0.85); c.fillRect(bx, by, bw, bh);
      c.strokeStyle = css("--ring"); c.lineWidth = 1; c.strokeRect(bx + 0.5, by + 0.5, bw, bh);
      c.fillStyle = css("--dim"); c.fillText("Release", bx + 8, by + 15);
      c.fillStyle = css("--value"); c.textAlign = "right"; c.fillText(v.x.l || "", bx + bw - 8, by + 15); c.textAlign = "left";
      const t0 = bx + 10, t1 = bx + bw - 10, ty = by + bh - 13, f = RT.frac(p, v, "l", RT.REL);
      c.lineWidth = 4; c.strokeStyle = css("--ring"); c.beginPath(); c.moveTo(t0, ty); c.lineTo(t1, ty); c.stroke();
      c.strokeStyle = css("--accent"); c.beginPath(); c.moveTo(t0, ty); c.lineTo(t0 + (t1 - t0) * f, ty); c.stroke();
      c.fillStyle = css("--text"); c.beginPath(); c.arc(t0 + (t1 - t0) * f, ty, 7, 0, Math.PI * 2); c.fill();
      st.rel = { t0, t1, ty, f };
    }
    RT.meter(c, g, v);
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener("pointerdown", e => {
    const v = st.v, L = st.L; if (!v || !L) return;
    const [x, y] = pos(e);
    const grab = d => { e.preventDefault(); cv.setPointerCapture(e.pointerId); st.drag = Object.assign({ x0: x, y0: y }, d); };
    if (st.rel && y > st.rel.ty - 16 && y < st.rel.ty + 16 && x > st.rel.t0 - 10 && x < st.rel.t1 + 10) return grab({ k: "l", f0: st.rel.f, w: st.rel.t1 - st.rel.t0 });
    if (x < gw && I.ce != null && Math.abs(L.Y(L.ceil) - y) < 14) return grab({ k: "ce", v0: L.ceil, n0: v.n.ce, span: L.TOP - L.BOT });
    if (x < gw && L.D && Math.abs(L.barY - y) < 16) return grab({ k: "g", v0: Math.max(L.BOT, Math.min(L.TOP, L.D.bar)), D: L.D, span: L.TOP - L.BOT });

  });

    const d = st.drag, v = st.v; if (!d || !cv.hasPointerCapture(e.pointerId)) return;

// ---------------------------------------------------------------------------
// De-esser, Delay, Reverb, Envelope and Modulation layouts (as the desktop
// draws them, TS_CV_RolePanel.lua). Each draw registers its handles; a
// press takes the handle under it with the values it was drawn from, so a
// drag works from where it started.
// ---------------------------------------------------------------------------
const RR = {
  noteBeats(t) {
    const s = String(t || "").trim().toLowerCase();
    let m = s.match(/^(\d+)\s*bars?\b/); if (m) return +m[1] * 4;
    m = s.match(/^(\d+)\s*\/\s*(\d+)(.*)$/) || s.match(/^(\d+)-(\d+\.?\d*)(.*)$/); if (!m || +m[2] === 0) return null;
    let b = 4 * +m[1] / +m[2]; const rest = m[3] || "";
    if (/^\s*\./.test(rest) || /^\s*d\b/.test(rest) || /dot/.test(rest)) b *= 1.5;
    else if (/^\s*t\b/.test(rest) || /trip/.test(rest)) b *= 2 / 3;
    return b;
  },
  timeMs(v, k, bpm) {
    if (v.u[k] === "ms" && v.v[k] != null) return v.v[k];
    const b = RR.noteBeats(v.x[k]); return b == null ? null : b * 60000 / (bpm > 1 ? bpm : 120);
  },
  // a value in its unit, or along its range; { val, along }
  val(p, v, k, unit, lo, hi, log) {
    if (v.v[k] != null && v.u[k] === unit && Math.abs(v.v[k]) < 1e9) return { val: v.v[k], along: false };
    let n = v.n[k] || 0; if ((p.mc.rr || {})[k]) n = 1 - n;
    return { val: log ? lo * Math.pow(hi / lo, n) : lo + n * (hi - lo), along: true };
  },
  set(p, k, x, along, lo, hi, log) {
    if (!along) return send("mcv", p.g, k, (+x).toFixed(4));
    let n = log ? Math.log(Math.max(lo, x) / lo) / Math.log(hi / lo) : (x - lo) / (hi - lo);
    n = Math.max(0, Math.min(1, n)); if ((p.mc.rr || {})[k]) n = 1 - n;
    send("mcn", p.g, k, n.toFixed(5));
  },
  nearest(list, fn, target, log) {
    let best = null, bd = 1e18;
    for (const s of list || []) { const x = fn(s.t); if (x == null) continue; const d = log ? Math.abs(Math.log(Math.max(1e-6, x)) - Math.log(Math.max(1e-6, target))) : Math.abs(x - target); if (d < bd) { bd = d; best = s.n; } }
    return best;
  },
  on: (v, k) => (v.n[k] || 0) >= 0.5,
  pct(v, k, p) { if (v.u[k] === "pct" && v.v[k] != null) return Math.max(0, Math.min(1.2, v.v[k] / 100)); let n = v.n[k] || 0; return (p.mc.rr || {})[k] ? 1 - n : n; },
};

function roleFrame(p, P, hold, CW, bodyH, drawFn, opts) {
  if (!Object.keys(p.mc.i || {}).length) { mapSetupNote(hold, "This layout has no roles yet. Set it up in ChannelView on the desktop."); return; }
  const g = roleCanvas(hold, CW, bodyH);
  if (!(opts && opts.meter)) g.gw = g.W_;
  const { cv, W_, ch, dpr } = g;
  const st = { v: null, drag: null, hits: [] };
  const api = {
    node(x, y, onDrag, r, onTap) { st.hits.push({ kind: "node", x, y, r: r || 22, onDrag, onTap }); },
    // a press on nothing at all
    empty(onTap) { st.empty = onTap; },
    redraw() { draw(); },
    hline(y, x0, x1, onDrag) { st.hits.push({ kind: "line", y, x0, x1, onDrag }); },
    chip(x, y, w, h, onClick) { st.hits.push({ kind: "chip", x, y, w, h, onClick }); },
  };
  function draw() {
    const v = st.v, c = cv.getContext("2d");
    c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, W_, ch);
    c.fillStyle = "rgba(0,0,0,0.22)"; c.fillRect(0, 0, W_, ch);
    if (!v) return;
    c.font = "11px -apple-system, system-ui, sans-serif"; c.textAlign = "left";
    st.hits = []; st.empty = null;
    drawFn(c, v, api, g);
    if (opts && opts.meter) RT.meter(c, g, v);
  }
  const pos = e => { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; };
  cv.addEventListener("pointerdown", e => {
    if (!st.v) return;
    const [x, y] = pos(e);
    for (const h_ of st.hits) if (h_.kind === "chip" && x >= h_.x && x <= h_.x + h_.w && y >= h_.y && y <= h_.y + h_.h) { e.preventDefault(); h_.onClick(); return; }
    let best = null, bd = 1e9;
    for (const h_ of st.hits) if (h_.kind === "node") { const d = Math.hypot(h_.x - x, h_.y - y); if (d < h_.r && d < bd) { bd = d; best = h_; } }
    if (!best) for (const h_ of st.hits) if (h_.kind === "line" && x >= h_.x0 && x <= h_.x1 && Math.abs(h_.y - y) < 16) { best = h_; break; }
    if (!best) { if (st.empty) st.empty(x, y); return; }
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    st.drag = { h: best, x0: x, y0: y, moved: false };
  });
  cv.addEventListener("pointermove", e => {
    const d = st.drag; if (!d || !cv.hasPointerCapture(e.pointerId)) return;
    const [x, y] = pos(e);
    if (Math.hypot(x - d.x0, y - d.y0) > 3) d.moved = true;
    if (d.moved) d.h.onDrag(x - d.x0, y - d.y0);
  });
  cv.addEventListener("pointerup", () => { const d = st.drag; st.drag = null; if (d && !d.moved && d.h.onTap) d.h.onTap(); });
  P.mc = ev => { if (!ev) return; st.v = ev; draw(); };
}

// small drawing helpers on a 2d context
const RD = {
  dot(c, x, y, r, fill, ring) { c.fillStyle = fill; c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); if (ring) { c.strokeStyle = ring; c.lineWidth = 1.5; c.stroke(); } },
  text(c, s, x, y, col, align) { c.fillStyle = col || css("--value"); c.textAlign = align || "left"; c.fillText(s, x, y); c.textAlign = "left"; },
  vgrid(c, x, y0, y1) { c.strokeStyle = css("--ring"); c.globalAlpha = 0.35; c.lineWidth = 1; c.beginPath(); c.moveTo(Math.round(x) + 0.5, y0); c.lineTo(Math.round(x) + 0.5, y1); c.stroke(); c.globalAlpha = 1; },
  hgrid(c, y, x0, x1) { c.strokeStyle = css("--ring"); c.globalAlpha = 0.35; c.lineWidth = 1; c.beginPath(); c.moveTo(x0, Math.round(y) + 0.5); c.lineTo(x1, Math.round(y) + 0.5); c.stroke(); c.globalAlpha = 1; },
  chips(c, api, list, cur, x, y, wMax, onPick) {
    let cx = x;
    for (const s of list) {
      const w = c.measureText(s.t).width + 14; if (cx + w > x + wMax) break;
      const on = cur >= s.lo - 1e-6 && cur <= s.hi + 1e-6;
      c.fillStyle = on ? css("--accent") : "rgba(255,255,255,0.08)"; c.fillRect(cx, y, w, 22);
      RD.text(c, s.t, cx + 7, y + 15, on ? "#fff" : css("--value"));
      const n = s.n; api.chip(cx, y, w, 22, () => onPick(n));
      cx += w + 4;
    }
    return cx;
  },
  toggle(c, api, label, on, x, y, onClick) {
    const w = c.measureText(label).width + 16;
    c.fillStyle = on ? css("--accent") : "rgba(255,255,255,0.08)"; c.fillRect(x, y, w, 22);
    RD.text(c, label, x + 8, y + 15, on ? "#fff" : css("--value")); api.chip(x, y, w, 22, onClick);
    return x + w + 4;
  },
};
const F_LO = 20, F_HI = 20000;
const niceStep = span => { for (const s of [50, 100, 250, 500, 1000, 2000]) if (span / s <= 8) return s; return 5000; };
const msLabel = t => t === 0 ? "0" : t >= 1000 ? (t / 1000) + " s" : t + " ms";


// What a de-esser is reducing, over its band: one depth (its gain
// reduction) across the band, soft at the edges -- drawn as roughly as
// it's known. Swells at once, settles over half a second; the scale steps
// 6 / 12 / 24 dB, shallower after three quiet seconds.
const DEESS = {
  st: new Map(),
  fill(c, key, X, gw, y0, y1, lo, hi, gr) {
    const now = performance.now() / 1000;
    let s = DEESS.st.get(key); if (!s) { s = { g: 0, t: now, rng: 6, rt: now }; DEESS.st.set(key, s); }
    const dt = Math.max(0, Math.min(0.2, now - s.t)); s.t = now;
    s.g += (gr - s.g) * Math.min(1, dt * (gr > s.g ? 30 : 5)); if (s.g < 0.05) s.g = 0;
    let want = 6; while (want < s.g * 1.15 && want < 48) want *= 2;
    if (want > s.rng) { s.rng = want; s.rt = now; } else if (want === s.rng) s.rt = now; else if (now - s.rt > 3) { s.rng = want; s.rt = now; }
    const rng = s.rng;
    RD.text(c, "0 dB", 4, y0 + 10, css("--dim")); RD.text(c, "−" + rng + " dB", 11, y1 - 2, css("--dim"));
    c.strokeStyle = "rgba(230,207,121,0.5)"; c.lineWidth = 1; c.beginPath(); c.moveTo(0, y1); c.lineTo(8, y1); c.stroke();
    if (s.g < 0.3 || !(lo && hi)) return;
    const yy = y0 + Math.min(rng, s.g) * (y1 - y0) / rng;
    const a = X(lo), open = hi >= F_HI, b = gw + 2, ew = Math.max(6, gw / 30);
    const Y = "230,207,121", ia = a + ew, ib = open ? b : Math.max(ia, X(hi) - ew);
    const vg = c.createLinearGradient(0, y0, 0, yy);
    vg.addColorStop(0, `rgba(${Y},0.44)`); vg.addColorStop(1, `rgba(${Y},0.12)`);
    c.fillStyle = vg; c.fillRect(ia, y0, ib - ia, yy - y0);
    // soft edges, a fade either side of each edge
    const edge = (x0, x1) => { const hg = c.createLinearGradient(x0, 0, x1, 0); hg.addColorStop(0, `rgba(${Y},0)`); hg.addColorStop(1, `rgba(${Y},0.3)`); c.fillStyle = hg; c.fillRect(Math.min(x0, x1), y0, Math.abs(x1 - x0), yy - y0); };
    edge(a - ew, ia);
    if (!open) edge(X(hi) + ew, ib);
    c.strokeStyle = `rgba(${Y},0.7)`; c.lineWidth = 1.6; c.beginPath(); c.moveTo(a, yy); c.lineTo(open ? gw : X(hi), yy); c.stroke();
  },
};

function mapDeessCanvas(p, P, hold, CW, bodyH) {
  const I = p.mc.i || {};
  roleFrame(p, P, hold, CW, bodyH, (c, v, api, g) => {
    const gw = g.gw, ch = g.ch, sh = Math.max(64, Math.floor(ch * 0.5));
    const X = f => Math.log(Math.max(F_LO, Math.min(F_HI, f)) / F_LO) / Math.log(F_HI / F_LO) * gw;
    for (const f of [100, 1000, 10000]) { RD.vgrid(c, X(f), 0, sh); RD.text(c, f >= 1000 ? f / 1000 + "k" : String(f), X(f) + 3, sh - 4, css("--dim")); }
    const F = I.fq != null ? RR.val(p, v, "fq", "hz", 1000, 16000, true) : null;
    const LO = I.lo != null ? RR.val(p, v, "lo", "hz", 1000, 16000, true) : null;
    const HI = I.hi != null ? RR.val(p, v, "hi", "hz", 2000, 20000, true) : null;
    let lo = LO && LO.val, hi = HI && HI.val;
    if (!(lo && hi) && F) {
      if (I.wd == null && p.mc.ds !== "around") { lo = F.val; hi = F_HI; }   // split-band: everything above it
      else if (I.wd != null && v.u.wd === "hz" && v.v.wd != null) { lo = Math.max(F_LO, F.val - v.v.wd / 2); hi = F.val + v.v.wd / 2; }
      else { let oct = 1; if (I.wd != null) oct = (v.u.wd === "" && v.v.wd > 0 && v.v.wd < 8) ? v.v.wd : 0.3 + RR.pct(v, "wd", p) * 2.7; lo = F.val / Math.pow(2, oct / 2); hi = F.val * Math.pow(2, oct / 2); }
    } else if (lo && !hi) hi = F_HI; else if (hi && !lo) lo = F_LO;
    const grc = css("--fill-bi") || "#d9a33a";
    if (lo && hi) { c.fillStyle = withA(grc, 0.16); c.fillRect(X(lo), 0, X(hi) - X(lo), sh); c.strokeStyle = grc; c.lineWidth = 1.2; c.strokeRect(X(lo) + 0.5, 0.5, X(hi) - X(lo), sh - 1); }
    DEESS.fill(c, p.g, X, gw, 2, sh - 4, lo, hi, v.g || 0);
    const fdrag = (k, o, lo_, hi_) => (dx) => RR.set(p, k, o.val * Math.pow(F_HI / F_LO, dx / gw), o.along, lo_, hi_, true);
    if (F) { const nx = X(F.val), ny = sh * 0.38; RD.dot(c, nx, ny, 7, grc, "#fff"); RD.text(c, v.x.fq || "", (lo ? X(lo) : nx) - 6, 14, css("--value"), "right"); if (I.wd != null) RD.text(c, "width " + (v.x.wd || ""), (lo ? X(lo) : nx) - 6, 28, css("--dim"), "right"); api.node(nx, ny, fdrag("fq", F, 1000, 16000)); }
    if (LO) { RD.dot(c, X(LO.val), sh - 10, 5, grc); api.node(X(LO.val), sh - 10, fdrag("lo", LO, 1000, 16000)); }
    if (HI) { RD.dot(c, X(HI.val), sh - 10, 5, grc); api.node(X(HI.val), sh - 10, fdrag("hi", HI, 2000, 20000)); }
    // under it: the reduction now, and the threshold on a level scale
    const wy0 = sh + 4, wh = ch - wy0, mid = wy0 + wh / 2, half = wh / 2 - 4;
    c.fillStyle = "rgba(0,0,0,0.15)"; c.fillRect(0, wy0, gw, wh);
    const gr = v.g || 0;
    if (I.t != null) {
      const T = RR.val(p, v, "t", "db", -60, 0, false), thr = Math.max(-60, T.val), a = (thr + 60) / 60;
      const ty = mid - a * half, by = mid + a * half;
      c.setLineDash([5, 3]); c.strokeStyle = css("--accent"); c.lineWidth = 1.3;
      c.beginPath(); c.moveTo(0, ty); c.lineTo(gw, ty); c.moveTo(0, by); c.lineTo(gw, by); c.stroke(); c.setLineDash([]);
      RT.pill(c, gw - 92, ty, css("--accent")); RD.text(c, "Threshold " + (v.x.t || ""), 8, ty - 6);
      api.hline(ty, 0, gw, (dx, dy) => RR.set(p, "t", Math.max(-60, Math.min(0, thr - dy * 60 / half)), T.along, -60, 0, false));
    }
    if (I.rg != null) RD.text(c, "Range " + (v.x.rg || ""), 8, ch - 8, css("--value"));
  });   // no reduction meter: the band's fill and the line above show it
}

const DLSEL = new Map();   // a delay canvas's selected tap, by plugin
// The echoes along a timeline, left above the line and right below (a mono
// delay's even both ways), as the bridge works them out (TS_CV_Delay, the
// same model the desktop draws): one or two lines, or a multi-tap's taps
// (numbered, the pattern repeating at the faint yellow lines). With sync
// on the timeline is in note values. A drag hands its handle and the time
// or value it's reached back to the bridge (dla), which sets whichever of

      const need = up.reduce((t, x) => t + c.measureText(x.t).width + 18, 0), cur = v.n.st || 0;

function mbState(t, n) {
