<link rel="manifest" href="TS_ChannelView.webapp.json">
<!--
  TS_ChannelView.html -- ChannelView in a browser, for a tablet beside the desk.

  Served by REAPER's own web interface (Preferences > Control/OSC/web > Add >
  Web browser interface). Transport and actions go straight to REAPER; the
  plugin panels go through TS_ChannelView_Web.lua, which must be running in
  REAPER (see its header for the ExtState protocol).
-->
<style>
:root {
  --win: #15171a; --panel: #202327; --border: #2d3136; --head: #1a1c20; --head-byp: #3a2420;
  --text: #dfe2e6; --dim: #868b92; --label: #a6abb2; --value: #dfe2e6;
  --track: #34383d; --fill: #4aa3df; --fill-bi: #d9893a; --body: #2a2d32; --pointer: #f0f1f2;
  --ring: #454a50; --toff: #2c3035; --ton: #4aa3df; --ttext: #e4e6e9; --accent: #4aa3df;
  --strip: #181a1d; --sel: #4aa3df; --grm: #d2609b; --cap: #c9ccd0; --byp: #d9673a;
  --mute: #d9673a; --solo: #d9b23a; --rec: #d9433a; --warn: #d9673a; --mon: #4f9c62; --mauto: #4a8fd9; --spec: #5d6f80; --lo: #4f9c62; --clip: #d9493a; --over: #ff3a3a;
  --sw: 100px; --tb-h: 64px; --mac-h: 58px; --trk-h: 54px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--win); color: var(--text);
  font-family: -apple-system, "SF Pro Text", "Segoe UI", system-ui, sans-serif; font-size: 13px;
  overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
button { font: inherit; color: inherit; }
/* The bottom safe area (the home indicator) goes to the track bar, which
   carries its background down into it, rather than to an empty band. */
#app { display: flex; flex-direction: column; height: 100%;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }

/* transport */
/* three parts: the location and markers on the left, the transport itself
   centred, the view switches on the right */
#tb { height: var(--tb-h); flex-shrink: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  gap: 6px; padding: 0 10px; background: var(--strip); border-bottom: 1px solid var(--border); }
#tb .tl, #tb .tc, #tb .tr { display: flex; align-items: center; gap: 6px; min-width: 0; }
#tb .tr { justify-content: flex-end; }
.tbtn { width: 48px; height: 46px; border-radius: 6px; border: 1px solid var(--border); background: var(--panel);
  display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; flex-shrink: 0; }
.tbtn svg { width: 22px; height: 22px; stroke: var(--text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.tbtn.on { background: var(--accent); border-color: var(--accent); }
.tbtn.on svg { stroke: #fff; }
.tbtn.rec.on { background: var(--rec); border-color: var(--rec); }
.tbtn.play.on { background: var(--lo); border-color: var(--lo); }
.tbtn:active { filter: brightness(1.3); }
.tsep { width: 10px; flex-shrink: 0; }
/* The transport as the desktop theme draws it: square buttons, a big round
   play with record and loop hugging it on concave edges, filled colour
   when on (record red, play green, loop blue, pause amber). */
.tb2 { width: 50px; height: 46px; padding: 0; border: 0; background: none; flex-shrink: 0; cursor: pointer; }
.tb2 svg, .tcl { display: block; overflow: visible; }
.tcl { flex-shrink: 0; margin: 0 2px; }
.tcl g { cursor: pointer; }
.tsh { fill: var(--panel); stroke: var(--border); stroke-width: 1.2; }
.tic { fill: var(--label); }
.tics { fill: none; stroke: var(--label); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.trec .tic { fill: var(--rec); }
.on.trec .tsh { fill: var(--rec); stroke: rgba(0,0,0,0.35); }
.on.tplay .tsh { fill: var(--lo); stroke: rgba(0,0,0,0.35); }
.on.tloop .tsh { fill: var(--accent); stroke: rgba(0,0,0,0.35); }
.on.tpause .tsh { fill: var(--solo); stroke: rgba(0,0,0,0.35); }
.on .tic { fill: #111; } .on .tics { stroke: #111; }
.tb2:active svg, .tcl g:active { filter: brightness(1.35); }
#clock { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-width: 140px;
  margin-right: 6px; flex-shrink: 0; }
#clock .big { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: 0.02em; }
#clock .small { font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
#status { width: 12px; height: 12px; border-radius: 50%; background: var(--dim); flex-shrink: 0; margin-left: 4px; }
#status.ok { background: var(--lo); } #status.bad { background: var(--rec); }

/* macros */
/* centred, and onto a second row (or more) when they don't fit in one */
#mac { flex-shrink: 0; min-height: var(--mac-h); box-sizing: border-box; display: flex; flex-wrap: wrap;
  align-items: center; justify-content: center; gap: 6px; padding: 7px 10px;
  background: var(--head); border-bottom: 1px solid var(--border); }
#mac.hidden { display: none; }
/* the navigator: the whole session in a strip, above the transport */
#nav { height: 116px; flex-shrink: 0; position: relative; background: var(--strip);
  border-bottom: 1px solid var(--border); touch-action: none; }
#nav.hidden { display: none; }
#nav canvas { position: absolute; left: 10px; right: 10px; top: 6px; bottom: 6px; width: calc(100% - 20px);
  height: calc(100% - 12px); display: block; }
.mbtn { height: 42px; min-width: 84px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--panel); flex-shrink: 0; cursor: pointer; position: relative; border-bottom-width: 3px; }
.mbtn.on { background: var(--accent); color: #fff; }
.mbtn .x { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%;
  background: var(--rec); color: #fff; font-size: 13px; line-height: 22px; text-align: center; display: none; }
#mac.edit .mbtn .x { display: block; }

<script>
"use strict";
// ---------------------------------------------------------------------------
// talking to REAPER
// ---------------------------------------------------------------------------
const NS = "TS_CV_WEB";
const unesc = s => s.replace(/\\(.)/g, (m, c) => c === "t" ? "\t" : c === "n" ? "\n" : c);

async function reaper(cmds) {
  const r = await fetch("/_/" + cmds, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const out = { ext: {}, cmd: {} };
  for (const line of (await r.text()).split("\n")) {
    const f = line.split("\t");
    if (f[0] === "TRANSPORT") out.transport = f;
    else if (f[0] === "BEATPOS") out.beat = f;
    else if (f[0] === "EXTSTATE") out.ext[f[2]] = unesc(f.slice(3).join("\t"));
    else if (f[0] === "CMDSTATE") out.cmd[f[1]] = +f[2];

const run = id => reaper(encodeURIComponent(String(id))).catch(() => {});
// The master's mono switch: REAPER's "Master track: Toggle stereo/mono
// (L+R)", read back as that action's toggle state with every poll.
const MONO_CMD = "40917";
const monoOn = () => macroStates && macroStates[MONO_CMD] === 1;
// An open circle on red while the master is mono, two linked circles on the
// plain button while it's stereo.
const MONO_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg>';
const STEREO_SVG = '<svg viewBox="0 0 24 24"><circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/></svg>';
function paintMono(b, on) {
  if (b.classList.contains("on") === on && b.innerHTML) return;
  b.classList.toggle("on", on);
  b.innerHTML = on ? MONO_SVG : STEREO_SVG;
  b.setAttribute("aria-label", on ? "Master in mono" : "Master in stereo");
}
function monoButton() {
  const b = h("button", "mo");
  paintMono(b, monoOn());
  b.addEventListener("click", () => { run(MONO_CMD); paintMono(b, !b.classList.contains("on")); });
  return b;
}
// The MIDI mode on a send: a MIDI socket, as on the desktop.
const MIDI_SVG = '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.8"/>' +
  '<circle cx="7.6" cy="12" r="1.3" fill="currentColor"/><circle cx="16.4" cy="12" r="1.3" fill="currentColor"/>' +
  '<circle cx="8.9" cy="8.9" r="1.3" fill="currentColor"/><circle cx="15.1" cy="8.9" r="1.3" fill="currentColor"/>' +
  '<circle cx="12" cy="7.6" r="1.3" fill="currentColor"/><rect x="10.6" y="18.2" width="2.8" height="2.2" fill="currentColor"/></svg>';

// Commands for the bridge, resent until acknowledged. A run of moves on the
// same control collapses to its latest value.
let seqBase = Date.now();
const outbox = [];
function send(verb, ...args) {
  // A run of moves on one control collapses to its latest: the target is
  // the verb and every argument but the value.
  const coalesce = ["p", "vol", "pan", "svol", "eqf", "eqg", "eqq", "grset", "tvol", "tpan", "mix", "nav", "navview"].includes(verb);
  const target = verb + "|" + args.slice(0, -1).join("|");
  if (coalesce) {
    const i = outbox.findIndex(o => o.target === target);
    if (i >= 0) outbox.splice(i, 1);
  }
  outbox.push({ seq: ++seqBase, target, text: [verb, ...args].join("|") });
  kick();
}
// Send now rather than waiting for the next poll: a knob should answer the
// finger, not the timer.
let kickTimer = null;
function kick() { if (!kickTimer) kickTimer = setTimeout(() => { kickTimer = null; poll(); }, 0); }
function outboxText() {
  return outbox.map(o => o.seq + "|" + o.text).join("~");
}

// ---------------------------------------------------------------------------
// state
// ---------------------------------------------------------------------------
let layout = null, layoutSeq = -1, vals = null, transport = null, beat = null;
let macros = [], macroEdit = false, macroStates = {};
let aliveVal = null, aliveAt = 0, reachable = true;
const local = new Map();     // control id -> { v, t }: what the user is doing right now
const LOCAL_HOLD = 450;      // ms a touched control ignores the echo
const ui = { panels: new Map(), strip: null };

let showMacros = true;
let showNav = false;
try { showNav = localStorage.getItem("tscv.nav") === "1"; } catch (e) {}
// The space below the transport changed (a bar shown or hidden): the mixer
// keeps its share and the panels are laid out again for their new height.
function relayout() { applyMix(mixState, false); if (layout) build(); }
let shut = new Set();
try { shut = new Set(JSON.parse(localStorage.getItem("tscv.shut") || "[]")); } catch (e) {}
function saveShut() { try { localStorage.setItem("tscv.shut", JSON.stringify([...shut])); } catch (e) {} }
// Gain-reduction traces open on this device: guid -> window ("" = the
// layout's own). Per device, like collapsing; the bridge is told which, and
// told again every few seconds so it can drop them when the page goes away.
let grv = new Map();
try { grv = new Map(Object.entries(JSON.parse(localStorage.getItem("tscv.grv") || "{}"))); } catch (e) {}
function saveGrv() {
  try { localStorage.setItem("tscv.grv", JSON.stringify(Object.fromEntries(grv))); } catch (e) {}
  sendGrv();
}
function sendGrv() { send("grset", [...grv].map(([g, w]) => g + "=" + w).join(",")); }
setInterval(() => { if (grv.size) sendGrv(); }, 3000);
setTimeout(() => { if (grv.size) sendGrv(); }, 300);
try { showMacros = localStorage.getItem("tscv.macros") !== "0"; } catch (e) {}

// ---------------------------------------------------------------------------
// polling
// ---------------------------------------------------------------------------
let busy = false;
// A heartbeat for ChannelView's header: about once a second this page writes
// "<id>.<n>" to TS_CV_WEB/seen. Every page writes the same key, so the
// random id is what tells them apart; ChannelView counts a page as
// connected while its id keeps turning up.
const PAGE_ID = Math.random().toString(36).slice(2, 8) || "p";
let seenN = 0, seenAt = 0;
async function poll() {
  if (busy) return;
  busy = true;
  try {
    let q = `GET/EXTSTATE/${NS}/vals;GET/EXTSTATE/${NS}/alive;TRANSPORT;BEATPOS;GET/40364;GET/1068;GET/${MONO_CMD}`;
    for (const m of macros) if (m.a) q += ";GET/" + encodeURIComponent(m.a);
    if (Date.now() - seenAt > 1000) {
      seenAt = Date.now(); seenN = (seenN + 1) % 1000;
      q = `SET/EXTSTATE/${NS}/seen/${PAGE_ID}.${seenN};` + q;
    }
    if (outbox.length) q = `SET/EXTSTATE/${NS}/cmd/` + encodeURIComponent(outboxText()) + ";" + q;
    const r = await reaper(q);
    reachable = true;
    transport = r.transport; beat = r.beat;
    macroStates = r.cmd;
    const alive = r.ext.alive || "";
    if (alive !== aliveVal) { aliveVal = alive; aliveAt = Date.now(); }
    if (r.ext.vals) {
      try { vals = JSON.parse(r.ext.vals); } catch (e) {}
      if (vals) {
        while (outbox.length && outbox[0].seq <= vals.A) outbox.shift();
        if (vals.L !== layoutSeq) await fetchLayout();
        if (vals.nv && vals.nv.N !== navSeq) await fetchNav();

    }
    render();
  } catch (e) {
    reachable = false;
    renderStatus();
  }
  busy = false;
}
async function fetchLayout() {
  const r = await reaper(`GET/EXTSTATE/${NS}/layout`);
  if (!r.ext.layout) return;
  try {
    layout = JSON.parse(r.ext.layout);
    CELL_W = cellW(layout.cw);
    layoutSeq = vals ? vals.L : -1;
    applyPalette(layout.pal || {});
    build();
  } catch (e) { console.error(e); }
}
let nav = null, navSeq = -1;
async function fetchNav() {
  const r = await reaper(`GET/EXTSTATE/${NS}/nav`);
  if (!r.ext.nav) return;
  try { nav = JSON.parse(r.ext.nav); navSeq = vals.nv.N; } catch (e) {}
}
async function loadMacros() {
  try {
    const r = await reaper(`GET/EXTSTATE/${NS}/macros`);
    macros = r.ext.macros ? JSON.parse(r.ext.macros) : [];
  } catch (e) { macros = []; }
  buildMacros();
}
function saveMacros() {
  reaper(`SET/EXTSTATEPERSIST/${NS}/macros/` + encodeURIComponent(JSON.stringify(macros))).catch(() => {});
  buildMacros();
}

// ---------------------------------------------------------------------------
// palette
// ---------------------------------------------------------------------------
const PAL_VARS = { win_bg: "--win", panel_bg: "--panel", panel_border: "--border", header_bg: "--head",
  header_bg_byp: "--head-byp", header_text: "--text", header_dim: "--dim", label: "--label", value: "--value",
  knob_track: "--track", knob_fill: "--fill", knob_fill_bi: "--fill-bi", knob_body: "--body",
  knob_pointer: "--pointer", knob_ring: "--ring", toggle_off: "--toff", toggle_on: "--ton",
  toggle_text: "--ttext", accent: "--accent", strip_bg: "--strip", strip_sel: "--sel",
  gr_measured: "--grm", fader_cap: "--cap", bypass_on: "--byp", mute_on: "--mute", solo_on: "--solo",
  rec_on: "--rec", warn: "--warn", mon_on: "--mon", mon_auto: "--mauto", eq_spectrum: "--spec", level_lo: "--lo", level_clip: "--clip", level_over: "--over" };
let PAL = {};
function applyPalette(p) {
  PAL = p;
  const st = document.documentElement.style;
  for (const k in PAL_VARS) if (p[k]) st.setProperty(PAL_VARS[k], p[k]);
}
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

// ---------------------------------------------------------------------------
// knob faces -- the same four as the desktop (TS_CV_Widgets.knob_face)
// ---------------------------------------------------------------------------
const SVGNS = "http://www.w3.org/2000/svg";
const A0 = -135, A1 = 135;
const rad = d => d * Math.PI / 180;
const pt = (r, d) => [50 + r * Math.sin(rad(d)), 50 - r * Math.cos(rad(d))];
const f2 = n => n.toFixed(2);
function arcPath(r, a0, a1) {
  if (Math.abs(a1 - a0) < 0.5) return "M50 50";
  if (a1 < a0) [a0, a1] = [a1, a0];
  const p0 = pt(r, a0), p1 = pt(r, a1);
  return `M${f2(p0[0])} ${f2(p0[1])} A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${f2(p1[0])} ${f2(p1[1])}`;
}
function radial(n, r0, r1, a0, a1) {
  let d = "";
  for (let i = 0; i < n; i++) {
    const t = a0 + (a1 - a0) * i / (n - 1), p = pt(r0, t), q = pt(r1, t);
    d += `M${f2(p[0])} ${f2(p[1])}L${f2(q[0])} ${f2(q[1])}`;
  }
  return d;
}
const lum = hex => { const h = hex.replace("#", ""); const c = i => parseInt(h.substr(i, 2), 16) / 255;
  return 0.2126 * c(0) + 0.7152 * c(2) + 0.0722 * c(4); };
const CAP_DEFAULT = { skirted: "#26282b", pointer: "#26282b", trim: "#8d9298", nose: "#26282b", bar: "#c9ccd0",
  fluted: "#26282b", bezel: "#26282b", rbezel: "#c9ccd0", hifi: "#c9ccd0" };
const BODY = { skirted: 38, pointer: 43, trim: 47, nose: 40, bar: 37, fluted: 38, bezel: 38, rbezel: 38, hifi: 38, led: 40 };
// Light falls from the top left on every hardware face (SVG degrees: 0 is
// up, clockwise), and how much of it a surface facing `d` catches
const LIGHT_D = -36.87;
const litD = d => (Math.cos((d - LIGHT_D) * Math.PI / 180) + 1) / 2;
const mixHex = (a, b, t) => { const p = x => parseInt(x.replace("#", "").slice(0, 6), 16);
  const A = p(a), B = p(b);
  return "#" + [16, 8, 0].map(s => Math.round(((A >> s) & 255) + (((B >> s) & 255) - ((A >> s) & 255)) * t)
    .toString(16).padStart(2, "0")).join(""); };
// a lit ring between radii ri and R: lo facing away from the light to hi
// facing it (sharpened by pw), a weaker glint opposite -- a polished cone
function litRing(g, R, ri, lo, hi, pw, glintAmt) {
  for (let i = 0; i < 48; i++) {
    const d0 = i * 7.5, d1 = d0 + 7.5, dm = d0 + 3.75;
    const glint = Math.pow(Math.max(0, Math.cos((dm - LIGHT_D - 180) * Math.PI / 180)), 6) * glintAmt;
    const fill = mixHex(lo, hi, Math.max(Math.pow(litD(dm), pw), glint));
    const a = pt(R, d0), b = pt(R, d1 + 0.4), c = pt(ri, d1 + 0.4), e = pt(ri, d0);
    el("path", { d: `M${a.map(f2).join(" ")}L${b.map(f2).join(" ")}L${c.map(f2).join(" ")}L${e.map(f2).join(" ")}Z`, fill }, g);
  }
}
// a turned metal cap: lit top left, the bow-tie sheen of brushed metal
// across it (fixed to the light), a few machining rings
function metalCap(g, defs, r, cap, id) {
  el("circle", { cx: 50, cy: 50, r, fill: mixHex(cap, "#000000", 0.28) }, g);
  el("circle", { cx: 50 - r * 0.06, cy: 50 - r * 0.08, r: r * 0.9, fill: cap }, g);
  const s = LIGHT_D + 90, w = 14, rr = r * 0.9, P = d => pt(rr, d).map(f2).join(" ");
  const op = lum(cap) > 0.55 ? 0.33 : 0.15;

      to = macroDropAt(ev.clientX, ev.clientY);
      if (to) {
        const br = bar.getBoundingClientRect();
        mark.style.left = (to.x - br.left) + "px";
        mark.style.top = (to.r.top - br.top) + "px";
        mark.style.height = to.r.height + "px";
      }
    };
    const end = () => {
      el.removeEventListener("pointermove", move);
      el.removeEventListener("pointerup", end);
      el.removeEventListener("pointercancel", end);
      if (!dragging) return;
      macroDragAt = Date.now();
      el.classList.remove("drag");
      if (mark) mark.remove();
      if (to) {
        let j = to.idx;
        if (j > i) j--;                   // the item leaves its own place first
        if (j !== i) {
          const [it] = macros.splice(i, 1);
          macros.splice(j, 0, it);
          saveMacros();
        }
      }
    };
    try { el.setPointerCapture(e.pointerId); } catch (err) {}
    el.addEventListener("pointermove", move);
    el.addEventListener("pointerup", end);
    el.addEventListener("pointercancel", end);
  });
}

const CAPS = ["#4aa3df", "#c8453c", "#d98a2f", "#d9be45", "#4f9c62", "#3f74b8", "#8d9298", "#e6e0d2", "#26282b"];

function openSheet(build) {

let findSeq = 0, findTimer = null;
function editMacro(i) {
  const m = i >= 0 ? Object.assign({}, macros[i]) : { l: "", a: "", c: "" };
  openSheet(sh => {
    sh.append(h("h3", null, i >= 0 ? "Edit macro" : "New macro"));
    const lab = h("input", "fld"); lab.placeholder = "Label"; lab.value = m.l || "";

    const res = h("div", "res");

    const paint = () => [...sw.children].forEach((b, k) => b.classList.toggle("cur", CAPS[k] === m.c));
    CAPS.forEach(c => { const b = h("button"); b.style.background = c;
      b.addEventListener("click", () => { m.c = (m.c === c) ? "" : c; paint(); }); sw.append(b); });
    paint();
    act.addEventListener("input", () => {
      m.a = act.value.trim();
      clearTimeout(findTimer);
      findTimer = setTimeout(() => searchActions(act.value, res, (id, name) => {

    const ok = h("button", "pri", "Save");
    left.addEventListener("click", () => { if (i > 0) { [macros[i - 1], macros[i]] = [macros[i], macros[i - 1]]; i--; saveMacros(); } });
    right.addEventListener("click", () => { if (i >= 0 && i < macros.length - 1) { [macros[i + 1], macros[i]] = [macros[i], macros[i + 1]]; i++; saveMacros(); } });
    ok.addEventListener("click", () => {
      m.l = lab.value.trim(); m.a = act.value.trim();
      if (!m.a) return;
      const clean = { l: m.l, a: m.a, c: m.c };
      if (i >= 0) macros[i] = clean; else macros.push(clean);
      saveMacros(); closeSheet();
    });
    if (i >= 0) acts.append(left, right);
    else {

      gap.addEventListener("click", () => { macros.push({ sp: 1 }); saveMacros(); closeSheet(); });

    }

    for (const f of [lab, act]) f.addEventListener("keydown", e => { if (e.key === "Enter") ok.click(); });

}
const shortName = n => n.replace(/^[^:]+:\s*/, "").slice(0, 18);

// A spacer's own sheet: move it along the bar, or take it out.
function editSpacer(i) {

    right.addEventListener("click", () => { if (i < macros.length - 1) { [macros[i + 1], macros[i]] = [macros[i], macros[i + 1]]; i++; saveMacros(); } });

}

async function searchActions(q, res, pick) {
  if (q.trim().length < 2) { res.innerHTML = ""; return; }
  send("find", q.replace(/[|~]/g, " "));
  const mine = ++findSeq;
  for (let k = 0; k < 20 && mine === findSeq; k++) {
    await new Promise(r => setTimeout(r, 150));
    try {
      const r = await reaper(`GET/EXTSTATE/${NS}/found`);
      const f = r.ext.found ? JSON.parse(r.ext.found) : null;
      if (f && f.q === q.replace(/[|~]/g, " ")) {
        res.innerHTML = "";
        if (!f.r.length) res.append(h("div", "lbl", "Nothing found"));
        for (const a of f.r) {
          const o = h("button", "opt", a.n);
          o.append(h("small", null, a.id));
          o.addEventListener("click", () => pick(a.id, a.n));
          res.append(o);
        }
        return;
      }
    } catch (e) {}
  }
}

// Brushed grain on a surface of colour `bg`: a faint light line every 3
// px and a faint dark one every 7, lighter on a dark surface, where white
// lines show far more. As CSS background layers, or as an SVG pattern fill.
function grainAlpha(bg) {
  const light = lum(bg) > 0.55;
  return { hi: light ? 0.035 : 0.015, lo: light ? 0.025 : 0.045 };
}
function grainCss(bg, dir) {
  const { hi, lo } = grainAlpha(bg);
  dir = dir || "0deg";
  return `repeating-linear-gradient(${dir}, rgba(255,255,255,${hi}) 0 1px, transparent 1px 3px), repeating-linear-gradient(${dir}, rgba(0,0,0,${lo}) 0 1px, transparent 1px 7px)`;
}
// two patterns in `svg`'s defs, lined up with the grid's top (the lines
// fall where the desktop draws them); returns their fills
function grainFills(svg, bg) {
  const { hi, lo } = grainAlpha(bg);
  let defs = svg.querySelector("defs");
  if (!defs) defs = el("defs", {}, svg);
  const out = [];
  for (const [col, a, step, off] of [["#fff", hi, 3, 2], ["#000", lo, 7, 4]]) {
    const id = "grain" + (++gradN);
    const pat = el("pattern", { id, patternUnits: "userSpaceOnUse", width: 8, height: step }, defs);
    el("rect", { x: 0, y: off % step, width: 8, height: 1, fill: col, "fill-opacity": a }, pat);
    out.push(`url(#${id})`);
  }
  return out;
}

// Metal flake: a tile of fine speckle, bright and dark grains scattered
// evenly with no direction (brushed metal has one), the way metallic paint
// or powder coat looks close up. Seeded, so it's the same every time and
// never shimmers; one tile for light plates and one for dark, where white
// grains show far more.
const flakeCache = {};
// The flake's strength, and the 3D effect's shadows': the desktop's
// C.METAL_K, the one Tim settled on.
const METAL_K = 0.8;
// { url, css }: the tile as an image, and as a CSS background layer
function flakeTile(light) {
  const k = light ? "l" : "d";
  if (flakeCache[k]) return flakeCache[k];
  // drawn at the screen's own pixel density, so a grain is one real pixel
  const dpr = Math.max(1, Math.round(window.devicePixelRatio || 1));
  const T = 128, N = T * dpr, c = document.createElement("canvas"); c.width = c.height = N;
  const g = c.getContext("2d"), img = g.createImageData(N, N), d = img.data;
  let seed = 0x5eed1234;
  const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
  const K = METAL_K;
  const hiA = Math.min(0.9, (light ? 0.22 : 0.10) * K), loA = Math.min(0.9, (light ? 0.07 : 0.14) * K);
  const dens = 0.035 * Math.min(2.2, 0.6 + 0.4 * K);
  for (let i = 0; i < N * N; i++) {
    const r = rnd(), o = i * 4;
    let v = 0, a = 0;
    if (r < dens) { v = 255; a = hiA * (0.3 + 0.7 * rnd()); }           // a grain catching the light
    else if (r < dens * 2) { v = 0; a = loA * (0.3 + 0.7 * rnd()); }         // one turned away from it
    else { v = rnd() < 0.5 ? 255 : 0; a = 0.02 * K * rnd(); }                // the satin in between
    d[o] = d[o + 1] = d[o + 2] = v; d[o + 3] = Math.round(a * 255);
  }
  g.putImageData(img, 0, 0);
  const url = c.toDataURL();
  return (flakeCache[k] = { url, css: `url(${url}) 0 0 / ${T}px ${T}px` });
}
// metallic paint's sheen: a soft broad highlight high on the left
const METAL_SHEEN = `radial-gradient(140% 70% at 25% 0%, rgba(255,255,255,${(0.16 * Math.min(2, METAL_K)).toFixed(2)}), rgba(255,255,255,0) 65%),
  radial-gradient(120% 60% at 85% 100%, rgba(0,0,0,${(0.08 * Math.min(2.5, METAL_K)).toFixed(2)}), rgba(0,0,0,0) 70%)`;

// A panel's background: the plate, with the 3D effect's light (the
// gradient) and its own finish -- metallic, brushed, both or neither.
function plateFill(pl) {
  if (!pl) return "";
  const sh = pl.sheen || 1;
  const mix = (a, b, t) => { const p = x => parseInt(x.slice(1), 16);
    const A = p(a), B = p(b), out = [16, 8, 0].map(s => Math.round(((A >> s) & 255) + (((B >> s) & 255) - ((A >> s) & 255)) * t));
    return "#" + out.map(v => v.toString(16).padStart(2, "0")).join(""); };
  const g = layout.tex
    ? `linear-gradient(180deg, ${mix(pl.bg, "#ffffff", 0.08 * sh)} 0%, ${pl.bg} 40%, ${mix(pl.bg, "#000000", 0.12 * sh)} 100%)`
    : pl.bg;
  const layers = [];
  if (pl.brushed) layers.push(grainCss(pl.bg));
  if (pl.metal) layers.push(flakeTile(lum(pl.bg) > 0.45).css, METAL_SHEEN);
  layers.push(g);
  return layers.join(", ");
}

function build() {

// ---------------------------------------------------------------------------
// sends and receives (TS_CV_Sends on the desktop)
// ---------------------------------------------------------------------------
const MODE_LABEL = { direct: "DIR", sidechain: "SC", midi: "MIDI" };
const MODE_NEXT = { direct: "sidechain", sidechain: "midi", midi: "direct" };
const MODE_NAME = { direct: "Direct", sidechain: "Sidechain", midi: "MIDI" };
const isSpacer = n => /^[-_=~.*\s]+$/.test((n || "").trim()) && (n || "").trim() !== "";
let routeOpen = { 0: true, "-1": false, 1: true };
try { const r = JSON.parse(localStorage.getItem("tscv.route") || "null"); if (r) routeOpen = r; } catch (e) {}

function buildRoute() {
  const col = $("route");
  col.innerHTML = "";
  ui.sends = { 0: [], "-1": [], 1: [] };
  if (!layout.track) return;
  // With the master selected the first section is its hardware outputs
  // (category 1): the master has nothing to send to.
  const first = layout.outs ? [1, layout.sends || [], "Outputs", "output"] : [0, layout.sends || [], "Sends", "send"];
  // The master has no Receives section: every track feeds it.
  const secs = layout.track.m ? [first] : [first, [-1, layout.recv || [], "Receives", "receive"]];
  for (const [cat, list, title, noun] of secs) {
    if (routeOpen[cat] === undefined) routeOpen[cat] = true;
    const sec = h("div", "rsec" + (routeOpen[cat] ? "" : " shut"));
    const hd = h("div", "rhd", title);
    hd.append(h("span", "cnt", list.length ? String(list.length) : ""), h("span", "chev", "▾"));
    hd.addEventListener("click", () => {
      routeOpen[cat] = !routeOpen[cat];
      sec.classList.toggle("shut", !routeOpen[cat]);
      try { localStorage.setItem("tscv.route", JSON.stringify(routeOpen)); } catch (e) {}
    });
    const bd = h("div", "rbd");
    list.forEach((sd, i) => bd.append(buildSend(cat, i, sd, noun)));
    const add = h("button", "radd", "+ Add " + noun);
    add.addEventListener("click", () => addSend(cat, noun));
    bd.append(add);
    sec.append(hd, bd);
    col.append(sec);
  }
}

function buildSend(cat, i, sd, noun) {
  const box = h("div", "snd");
  const nm = h("div", "snm");
  if (sd.c) nm.style.setProperty("--c", sd.c);
  const more = h("button", null, "⋯");
  more.addEventListener("click", () => sendMenu(cat, i, sd, noun));
  nm.append(h("span", null, (sd.n ? sd.n + "  " : "") + sd.nm), more);
  const bd = h("div", "sbd");
  const kb = h("div", "sk");
  const k = makeKnob(46, "arc", null, false);
  const kn = h("div", "knob"); kn.append(k.svg);
  const val = h("div", "val", "");
  kb.append(kn, val);
  const bt = h("div", "sbt");
  const hw = cat === 1;
  const mu = h("button", "mu", "ON"), md = h("button", "md", hw ? "" : "DIR"), pp = h("button", "pp", "POST");
  mu.addEventListener("click", () => send("smute", cat, i));
  pp.addEventListener("click", () => send("spre", cat, i));
  let mode = "direct";
  // an output's middle button is where it goes; a tap moves it
  md.addEventListener("click", () => hw ? sendMenu(cat, i, sd, noun) : send("smode", cat, i, MODE_NEXT[mode]));
  bt.append(mu, md, pp);
  bd.append(kb, bt);
  box.append(nm, bd);
  const id = "s" + cat + ":" + i;
  let cur = 0;
  dragger(kn, () => cur, v => { cur = v; k.set(v); touch(id, v); send("svol", cat, i, v.toFixed(4)); },
    { reset: () => send("sv0", cat, i) });
  ui.sends[cat][i] = { set(sv) {
    const l = held(id);
    cur = l ? l.v : sv.f; k.set(cur);
    val.textContent = sv.db + " dB";
    mu.classList.toggle("on", !!sv.m); mu.textContent = sv.m ? "OFF" : "ON";
    if (hw) { md.textContent = sv.ch || ""; md.className = "md"; }
    else {
      mode = sv.md || "direct";
      if (mode === "midi") { if (!md.querySelector("svg")) md.innerHTML = MIDI_SVG; }
      else md.textContent = MODE_LABEL[mode];
      md.className = "md" + (mode === "sidechain" ? " sc" : mode === "midi" ? " midi" : "");
    }
    pp.classList.toggle("on", !!sv.pre); pp.textContent = sv.pre ? "PRE" : "POST";
  } };
  return box;
}

// The device's outputs as a list of options: the stereo pairs, then each
// channel on its own. `cur` (a label) is marked.
function outputOptions(sh, cur, pick) {
  const oc = layout.oc || { st: [], mo: [] };
  const list = (title, items) => {
    if (!items.length) return;
    sh.append(h("div", "lbl2", title));
    const box = h("div", "plist");
    for (const c of items) {
      const o = h("button", "opt" + (c.l === cur ? " cur" : ""), c.l + "   " + c.nm);
      o.addEventListener("click", () => { pick(c.d); closeSheet(); });
      box.append(o);
    }
    sh.append(box);
  };
  if (!oc.st.length && !oc.mo.length) sh.append(h("div", "note", "The audio device has no outputs."));
  list("Stereo", oc.st);
  list("Mono", oc.mo);
}

function sendMenu(cat, i, sd, noun) {
  if (cat === 1) {
    openSheet(sh => {
      sh.append(h("h3", null, "Output: " + sd.nm));
      const cur = vals && vals.s && vals.s[i];
      outputOptions(sh, cur && cur.ch, d => send("sdst", 1, i, d));
      const rm = h("button", "opt", "Remove output");
      rm.style.color = "var(--clip)";
      rm.addEventListener("click", () => { send("srem", 1, i); closeSheet(); });
      sh.append(h("div", "gap"), rm);
    });
    return;
  }
  openSheet(sh => {
    sh.append(h("h3", null, (cat === 0 ? "Send to " : "Receive from ") + sd.nm));
    const cur = vals && (cat === 0 ? vals.s : vals.r) && (cat === 0 ? vals.s : vals.r)[i];
    for (const m of ["direct", "sidechain", "midi"]) {
      const o = h("button", "opt" + (cur && cur.md === m ? " cur" : ""),
        m === "direct" ? "Direct (channels 1/2)" : m === "sidechain" ? "Sidechain (channels 3/4)" : "MIDI (all channels, no audio)");
      o.addEventListener("click", () => { send("smode", cat, i, m); closeSheet(); });
      sh.append(o);
    }
    const rm = h("button", "opt", "Remove " + noun);
    rm.style.color = "var(--clip)";
    rm.addEventListener("click", () => { send("srem", cat, i); closeSheet(); });
    sh.append(h("div", "gap"), rm);
  });
}

function addSend(cat, noun) {
  if (cat === 1) {
    openSheet(sh => {
      sh.append(h("h3", null, "Add a hardware output"));
      outputOptions(sh, null, d => send("oadd", d));
    });
    return;
  }
  let mode = "direct";
  openSheet(sh => {
    sh.append(h("h3", null, cat === 0 ? "Add a send to…" : "Add a receive from…"));
    const seg = h("div", "seg");
    const paint = () => [...seg.children].forEach(b => b.classList.toggle("cur", b.dataset.m === mode));
    for (const m of ["direct", "sidechain", "midi"]) {
      const b = h("button", null, MODE_NAME[m]); b.dataset.m = m;
      b.addEventListener("click", () => { mode = m; paint(); });
      seg.append(b);
    }
    paint();
    const tl = h("div", "tl");
    const nt = h("button", "opt", "New track");
    nt.addEventListener("click", () => { send("sadd", cat, 0, mode); closeSheet(); });
    tl.append(nt, h("div", "gap"));
    let gap = false;
    for (const t of layout.tracks || []) {
      if (isSpacer(t.n)) { gap = true; continue; }
      if ((gap || t.sp) && tl.children.length > 2) tl.append(h("div", "rule"));
      gap = false;
      const o = h("button", "opt");
      const sw = h("i"); if (t.c) sw.style.setProperty("--c", t.c);
      o.append(sw, h("span", null, t.i + "  " + (t.n || "Track " + t.i)));
      if (layout.track && t.i === layout.track.i) o.disabled = true;
      else o.addEventListener("click", () => { send("sadd", cat, t.i, mode); closeSheet(); });
      tl.append(o);
    }
    sh.append(seg, tl);
  });
}

function buildTracks() {
  const bar = $("trk");
  bar.innerHTML = "";
  const cur = layout.track ? layout.track.i : null;
  // A tap selects; with the mixer open, a double tap collapses or opens
  // that track's strip, as on the strip itself (a folder-folded child's
  // double tap opens its folder).
  const mk = (i, name, col, sel, t) => {
    const b = h("button", "trb" + (sel ? " sel" : ""), name);
    if (col) b.style.setProperty("--c", col);
    const key = t ? stripKey(t) : "master";
    b.addEventListener("click", () => stripTap(key, i, () => {
      if (mixState === "closed") return;
      if (t && t.fo) { for (const p of t.fb || []) send("fold", p, 0); return; }
      setMxShut(key, !mxShut.has(key));
    }));
    bar.append(b);
    return b;
  };
  const mixOn = mixState !== "closed";
  const mb = mk(0, mixOn && mxShut.has("master") ? "M" : "MASTER", null, layout.track && layout.track.m);
  if (mixOn && mxShut.has("master")) mb.classList.add("fold");
  let selEl = null;
  // The tracks REAPER shows in its mixer, as the desktop's track row: the
  // same columns as the mixer strips above them.
  for (const t of layout.tracks || []) {
    if (t.hm || t.fh) continue;
    if (t.sp) bar.append(h("div", "tsp"));
    const narrow = t.fo || (mixOn && mxShut.has(stripKey(t)));
    const b = mk(t.i, narrow ? String(t.i) : t.n, t.c, t.i === cur, t);
    if (narrow) b.classList.add("fold");
    else b.prepend(h("span", "tn", String(t.i)));
    if (t.fm != null) {
      const fi = h("span", "fic");
      fi.innerHTML = folderIcon(t.fm);
      fi.title = FOLDER_TIP[t.fm];
      fi.addEventListener("click", e => { e.stopPropagation(); send("fold", t.i); });
      b.prepend(fi);
    }
    if (t.i === cur) selEl = b;
  }
  ui.selTrack = selEl;
}

// The fader panel collapses (per device) to a narrow strip with a double tap
// on its background -- the folded mixer strip's layout: open button, mini

let stripShut = false;
try { stripShut = localStorage.getItem("tscv.stripshut") === "1"; } catch (e) {}
function setStripShut(v) {
  stripShut = v;

  buildStrip(); render();
}
(function wireStripTap() {
  const s = $("strip");

  s.addEventListener("click", e => {
    const t = e.target;

  });

function buildStripShut(s) {
  const tr = layout.track, master = !!tr.m;
  const name = h("div", "sname", "");
  if (tr.c) name.style.setProperty("--c", tr.c);
  name.title = master ? "MASTER" : (tr.n || ("Track " + tr.i));

  ex.innerHTML = `<svg viewBox="0 0 24 24">${ICON.next}</svg>`;
  ex.setAttribute("aria-label", "Open the fader panel");
  ex.addEventListener("click", () => setStripShut(false));
  const mp = miniPan(v => { touch("pan", v); send("pan", (v * 2 - 1).toFixed(3)); }, () => send("pan", 0));

// ---------------------------------------------------------------------------
// the navigator
// ---------------------------------------------------------------------------
// The session at a glance, as REAPER's Navigator: a lane per visible track
// with its items, regions along the top, markers, the time selection, the
// playhead, and a box for what the arrange view on the computer shows.
// Tap to put the edit cursor there (and the playhead, while playing); drag
// the box -- or drag anywhere else, and the box comes to the finger -- to
// scroll the arrange view. Tap a region's name to go to its start.
const NAV_RB = 17;                 // the region band along the top
let navDrag = null, navHold = null;
const navExt = () => Math.max(nav ? nav.L : 60, vals && vals.nv ? vals.nv.b : 0) * 1.02;
function navBox() {
  const nv = vals && vals.nv;
  if (!nv) return null;
  const w = nv.b - nv.a;
  if (navHold && Date.now() - navHold.t < 700) return { a: navHold.a, b: navHold.a + w };
  return { a: nv.a, b: nv.b };
}
function drawNav() {
  const cv = $("nav").querySelector("canvas"), dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  const x = cv.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, W, H);
  x.fillStyle = "rgba(0,0,0,0.25)";
  x.fillRect(0, 0, W, H);
  const nv = vals && vals.nv;
  if (!nav || !nv) {
    x.fillStyle = css("--dim"); x.font = "12px -apple-system, system-ui, sans-serif";
    x.textAlign = "center"; x.textBaseline = "middle";
    x.fillText("connecting…", W / 2, H / 2);
    return;
  }
  const ext = navExt(), X = t => t / ext * W;
  const top = NAV_RB + 2, lh = H - top;
  const ring = css("--ring"), dim = css("--dim"), text = css("--text");
  x.font = "11px -apple-system, system-ui, sans-serif"; x.textBaseline = "middle";
  // regions: a band with names, a faint wash down the lanes
  for (const r of nav.rg || []) {
    const x0 = X(r.s), x1 = Math.max(x0 + 2, X(r.e));
    const c = r.c || ring;
    x.fillStyle = withA(c, 0.07); x.fillRect(x0, top, x1 - x0, lh);
    x.fillStyle = withA(c, 0.55); x.fillRect(x0, 0, x1 - x0, NAV_RB);
    x.save(); x.beginPath(); x.rect(x0, 0, x1 - x0, NAV_RB); x.clip();
    x.fillStyle = text; x.textAlign = "left";
    x.fillText(r.n || ("Region " + r.x), x0 + 4, NAV_RB / 2 + 0.5);
    x.restore();
  }
  // the time selection
  if (nv.t1 > nv.t0) { x.fillStyle = "rgba(255,255,255,0.10)"; x.fillRect(X(nv.t0), top, X(nv.t1) - X(nv.t0), lh); }

  const lanes = nav.lanes || [], n = Math.max(1, lanes.length);
  const lph = lh / n, gap = lph >= 5 ? 1 : 0;
  const colOf = new Map((layout && layout.tracks || []).map(t => [t.i, t.c]));
  const bw = W / nav.n * (nav.L / ext);
  lanes.forEach((ln, k) => {
    const y = top + k * lph;
    x.fillStyle = withA(colOf.get(ln.i) || dim, 0.85);
    for (let j = 0; j < ln.s.length; j += 2) {
      const x0 = ln.s[j] * bw, x1 = (ln.s[j + 1] + 1) * bw;
      x.fillRect(x0, y, Math.max(1, x1 - x0), Math.max(1, lph - gap));
    }
  });

  // band, cut short where the next marker's tab begins
  const mks = (nav.mk || []).slice().sort((a, b) => a.p - b.p);
  mks.forEach((m, k) => {
    const mx = Math.round(X(m.p)) + 0.5;
    const col = m.c || "#d94a4a";
    x.fillStyle = withA(col, 0.9);
    x.fillRect(mx - 0.5, 0, 1, H);
    const room = (k + 1 < mks.length ? X(mks[k + 1].p) : W) - mx - 4;
    let label = m.n ? m.x + " " + m.n : String(m.x);
    if (x.measureText(label).width + 8 > room) {
      while (label.length > String(m.x).length && x.measureText(label + "…").width + 8 > room) label = label.slice(0, -1);
      if (label !== String(m.x)) label = label.trimEnd() + "…";
    }
    const tw = x.measureText(label).width + 8;
    x.fillStyle = "rgba(0,0,0,0.55)"; x.fillRect(mx + 0.5, 1, tw, NAV_RB - 2);
    x.fillStyle = withA(col, 0.9); x.fillRect(mx + 0.5, 1, 2, NAV_RB - 2);
    x.textAlign = "left"; x.fillStyle = text;
    x.fillText(label, mx + 5, NAV_RB / 2 + 0.5);
  });
  // the arrange view's box
  const bx = navBox();
  if (bx) {
    const x0 = X(bx.a), x1 = Math.max(x0 + 6, X(bx.b));
    x.fillStyle = withA(css("--accent"), 0.14); x.fillRect(x0, 0, x1 - x0, H);
    x.strokeStyle = css("--accent"); x.lineWidth = 1.5; x.strokeRect(x0 + 0.75, 0.75, x1 - x0 - 1.5, H - 1.5);
  }
  // the edit cursor, and the playhead while playing
  x.fillStyle = withA(dim, 0.9); x.fillRect(Math.round(X(nv.c)), 0, 1, H);
  if (nv.pl) { x.fillStyle = text; x.fillRect(Math.round(X(nv.p)) - 0.5, 0, 2, H); }
}
(function wireNav() {
  const el = $("nav"), cv = el.querySelector("canvas");
  const at = e => {
    const r = cv.getBoundingClientRect();
    return { t: Math.max(0, (e.clientX - r.left) / Math.max(1, r.width) * navExt()), y: e.clientY - r.top, px: e.clientX };
  };
  const moveBox = p => {
    const bx = navBox(); if (!bx) return;
    const w = bx.b - bx.a;
    const a = Math.max(0, Math.min(navExt() - w, p.t - navDrag.off));
    navHold = { a, t: Date.now() };
    send("navview", a.toFixed(3));
    drawNav();
  };
  el.addEventListener("pointerdown", e => {
    if (!nav || !vals || !vals.nv) return;
    e.preventDefault(); el.setPointerCapture(e.pointerId);
    const p = at(e), bx = navBox();
    const tol = 12 / Math.max(1, cv.clientWidth) * navExt();
    const inBox = bx && p.y >= NAV_RB && p.t >= bx.a - tol && p.t <= bx.b + tol;
    navDrag = { x0: p.px, moved: false, band: p.y < NAV_RB, box: inBox, off: inBox ? p.t - bx.a : 0 };
  });

    if (!navDrag || !el.hasPointerCapture(e.pointerId)) return;
    const p = at(e);
    if (!navDrag.moved && Math.abs(p.px - navDrag.x0) > 8) {
      navDrag.moved = true;
      if (!navDrag.box) { const bx = navBox(); navDrag.off = bx ? (bx.b - bx.a) / 2 : 0; }
    }
    if (navDrag.moved) moveBox(p);
  });
  const up = e => {
    if (!navDrag) return;
    const d = navDrag; navDrag = null;
    if (el.hasPointerCapture(e.pointerId)) el.releasePointerCapture(e.pointerId);
    if (d.moved || e.type === "pointercancel") return;
    const p = at(e);
    if (d.band) {
      const r = (nav.rg || []).find(r => p.t >= r.s && p.t <= r.e);
      if (r) { send("navgo", r.s.toFixed(3)); return; }
    }
    send("navgo", p.t.toFixed(3));
  };
  el.addEventListener("pointerup", up);
  el.addEventListener("pointercancel", up);
})();
setInterval(() => { if (showNav) send("nav", 1); }, 3000);

// ---------------------------------------------------------------------------
// the mixer
// ---------------------------------------------------------------------------
// Below the plugins, behind a divider: drag it and it snaps to closed, half
// or full; tap it to open to half or close. Remembered per device. The
// bridge only sends the mixer's values while it's open (verb mix).
let mixState = "closed";
try { mixState = localStorage.getItem("tscv.mix") || "closed"; } catch (e) {}
const mixAvail = () => $("main").offsetHeight + $("mix").offsetHeight;
function applyMix(stateOrPx, rebuild = true) {
  const mix = $("mix"), app = $("app");
  const avail = app.classList.contains("mixfull") ? $("mix").offsetHeight + $("main").offsetHeight : mixAvail();
  let px;
  if (typeof stateOrPx === "number") px = stateOrPx;
  else {
    mixState = stateOrPx;
    try { localStorage.setItem("tscv.mix", mixState); } catch (e) {}
    px = mixState === "full" ? avail : mixState === "half" ? Math.round(avail / 2) : 0;
  }
  app.classList.toggle("mixfull", typeof stateOrPx !== "number" && mixState === "full");
  if (typeof stateOrPx !== "number") app.classList.toggle("mixopen", mixState !== "closed");
  mix.style.height = px + "px";
  mix.classList.toggle("open", px > 0);
  if (rebuild && typeof stateOrPx !== "number") {
    send("mix", mixState === "closed" ? 0 : 1);

  }
}
setInterval(() => { if (mixState !== "closed") send("mix", 1); }, 3000);
(function wireDivider() {
  const d = $("mdiv");
  let sy = 0, sh = 0, avail = 0, moved = false;
  d.addEventListener("pointerdown", e => {
    e.preventDefault(); d.setPointerCapture(e.pointerId);
    sy = e.clientY; sh = $("mix").offsetHeight; moved = false;
    $("app").classList.remove("mixfull");
    avail = mixAvail();
  });
  d.addEventListener("pointermove", e => {
    if (!d.hasPointerCapture(e.pointerId)) return;
    const dy = sy - e.clientY;
    if (Math.abs(dy) > 6) moved = true;
    if (moved) applyMix(Math.max(0, Math.min(avail, sh + dy)), false);
  });
  const up = e => {
    if (!d.hasPointerCapture(e.pointerId)) return;
    d.releasePointerCapture(e.pointerId);
    if (!moved) { applyMix(mixState === "closed" ? "half" : "closed"); return; }
    const hpx = $("mix").offsetHeight, f = hpx / Math.max(1, avail);
    applyMix(f < 0.25 ? "closed" : f > 0.75 ? "full" : "half");
  };
  d.addEventListener("pointerup", up);
  d.addEventListener("pointercancel", up);
})();

const lvPct = db => Math.max(0, Math.min(100, (db + 60) / 60 * 100));
const lvCol = db => db >= 0 ? "var(--over)" : db >= -6 ? "var(--clip)" : "var(--lo)";
const panText = p => Math.abs(p) < 0.005 ? "C" : (Math.round(Math.abs(p) * 100) + (p < 0 ? "L" : "R"));
const MON_TXT = ["–", "IN", "AU"];

// A slim pan control for a collapsed strip: a bar, a centre mark, the fill
// from centre and a dot at the position. Drag sideways (or up and down, as
// a knob turns), double-tap for centre. `onSet(v)` gets 0..1.
function miniPan(onSet, onReset) {
  const node = h("div", "mp"), mf = h("div", "mf"), md = h("div", "md");
  node.append(h("div", "mc"), mf, md);
  let cur = 0.5;
  const show = v => {
    md.style.left = `calc(2px + (100% - 4px) * ${v})`;
    mf.style.left = `calc(2px + (100% - 4px) * ${Math.min(v, 0.5)})`;
    mf.style.width = `calc((100% - 4px) * ${Math.abs(v - 0.5)})`;
  };
  show(cur);
  let sx = 0, sy = 0, sv = 0, last = 0, on = false;
  node.addEventListener("pointerdown", e => {
    e.preventDefault(); e.stopPropagation();
    const now = Date.now();
    if (now - last < 300) { last = 0; onReset(); return; }
    last = now;
    node.setPointerCapture(e.pointerId); on = true;
    sx = e.clientX; sy = e.clientY; sv = cur;
  });
  node.addEventListener("pointermove", e => {
    if (!on) return;
    const v = Math.max(0, Math.min(1, sv + ((e.clientX - sx) - (e.clientY - sy)) / 160));
    cur = v; show(v); onSet(v);

  node.addEventListener("pointerup", end); node.addEventListener("pointercancel", end);
  node.addEventListener("click", e => e.stopPropagation());

      setPan: v => { pvv = v; }, setVol: v => { fvv = v; } });
  };
  if (mxShut.has("master")) folded({ i: 0, c: layout.mc, m: true }, true);
  else strip(0, "MASTER", layout.mc, "master");
  for (const t of layout.tracks || []) {
    if (t.hm || t.fh) continue;
    if (t.sp) mix.append(h("div", "tsp"));
    if (t.fo) folded(t, false);
    else if (mxShut.has(stripKey(t))) folded(t, true);
    else strip(t.i, t.i + " " + t.n, t.c, stripKey(t));
  }
}

// Mute, solo and record arm take a swipe, as on the desktop: press one and
// drag along the row, and every one of the same kind you cross follows the
// first. Not phase or monitoring -- a stray drag flipping six tracks'
// polarity is a bad afternoon.
(function wireSwipe() {
  const mix = $("mix");
  let sw = null;
  const hit = (key, x, y) => {
    const el = document.elementFromPoint(x, y);
    const b = el && el.closest && el.closest("[data-sw]");
    return b && b.dataset.sw === key ? b : null;
  };
  const apply = b => {
    const i = +b.dataset.i;
    if (sw.done.has(i)) return;
    sw.done.add(i);
    b.classList.toggle("on", sw.want);
    touch("sw" + sw.key + i, sw.want);
    send("tset", i, sw.key, sw.want ? 1 : 0);
  };
  mix.addEventListener("pointerdown", e => {
    const b = e.target.closest && e.target.closest("[data-sw]");
    if (!b) return;
    e.preventDefault();
    mix.setPointerCapture(e.pointerId);
    sw = { key: b.dataset.sw, want: !b.classList.contains("on"), done: new Set(), id: e.pointerId };
    apply(b);
  });
  mix.addEventListener("pointermove", e => {
    if (!sw || e.pointerId !== sw.id) return;
    const b = hit(sw.key, e.clientX, e.clientY);
    if (b) apply(b);
  });
  const end = e => { if (sw && e.pointerId === sw.id) sw = null; };
  mix.addEventListener("pointerup", end);
  mix.addEventListener("pointercancel", end);
})();

function renderMixer() {
  if (!ui.mix || !ui.mix.size || !vals || !vals.mx) return;
  for (const t of vals.mx) {
    const S = ui.mix.get(t.i);
    if (!S) continue;
    const pl = held("mp" + t.i), vl = held("mv" + t.i);
    const pan = pl ? pl.v : (t.pan + 1) / 2;
    if (S.pan) { S.pan.set(pan); S.setPan(pan); S.pv.textContent = panText(t.pan); }
    if (S.mp) S.mp.set(pan);
    const f = vl ? vl.v : t.f;
    S.fdr.set(f); S.setVol(f);
    S.vdb.textContent = t.db;
    S.mlv.style.height = lvPct(t.pl) + "%"; S.mrv.style.height = lvPct(t.pr) + "%";
    S.mlv.style.background = lvCol(t.pl); S.mrv.style.background = lvCol(t.pr);
    const hv = (k, v) => { const l = held("sw" + k + t.i); return l ? l.v : v; };
    S.bm.classList.toggle("on", hv("mute", !!t.m)); S.bs.classList.toggle("on", hv("solo", !!t.s));
    if (S.br) S.br.classList.toggle("on", hv("arm", !!t.r));
    if (S.bp) S.bp.classList.toggle("on", !!t.ph);
    if (S.bi) {
      S.bi.textContent = MON_TXT[t.mo || 0];
      S.bi.classList.toggle("on", t.mo === 1); S.bi.classList.toggle("au", t.mo === 2);
    }
    if (S.bmo) paintMono(S.bmo, monoOn());
    S.el.classList.toggle("sel", !!t.sel);
  }
}

function makeFader(w, style, cap) {
  const node = h("div", "fdr");
  node.style.width = w + "px";
  node.style.position = "relative";
  node.style.flexShrink = "0";
  const slot = h("div"); Object.assign(slot.style, { position: "absolute", left: "50%", top: "6px", bottom: "6px",
    width: "4px", marginLeft: "-2px", background: "#0d0e0f", borderRadius: "2px", border: "1px solid var(--ring)" });
  const capH = style === "console" ? 36 : style === "rail" ? 44 : 20;
  const c = h("div", "fcap"); Object.assign(c.style, { position: "absolute", left: style === "rail" ? "6px" : "0", right: style === "rail" ? "6px" : "0",
    height: capH + "px", borderRadius: style === "rail" ? "5px" : "3px", border: "1px solid rgba(0,0,0,0.6)" });
  if (style === "console") c.style.background = `linear-gradient(180deg,#4c5056,#2a2d31 50%,#1a1c1f), linear-gradient(${cap || "#e6e0d2"},${cap || "#e6e0d2"})`;
  else if (style === "rail") c.style.background = `linear-gradient(90deg, rgba(255,255,255,0.3), transparent 45%, rgba(0,0,0,0.3)), ${cap || "#8d9298"}`;
  else c.style.background = cap || "var(--cap)";
  const line = h("div"); Object.assign(line.style, { position: "absolute", left: "0", right: "0", top: "50%", height: style === "console" ? "3px" : "2px",
    marginTop: "-1px", background: style === "console" ? (cap || "#e6e0d2") : (lum(cap || "#c9ccd0") > 0.55 ? "#1d1e20" : "#f0f0ee") });
  c.append(line);
  node.append(slot, c);
  return { node, set(v) {
    const H = node.clientHeight || 200;
    c.style.top = (6 + (1 - v) * (H - 12 - capH)) + "px";
  } };
}

function touch(id, v) { local.set(id, { v, t: Date.now() }); }
function held(id) { const l = local.get(id); return l && Date.now() - l.t < LOCAL_HOLD ? l : null; }

function buildPanels() {
  const row = $("row");
  // A rebuild of the same track keeps the row where it was scrolled to;
  // only a different track starts from the first plugin.
  const trk = layout.track ? String(layout.track.i) + (layout.track.m ? "m" : "") : "";
  const keep = row.dataset.trk === trk ? row.scrollLeft : 0;
  row.innerHTML = "";
  ui.panels.clear();
  const fx = layout.fx || [];
  if (!layout.track) { row.append(h("div", "empty", "No track selected")); return; }
  const rowH = row.clientHeight - 16;
  const bodyH = rowH - HEAD - (layout.pbar ? 34 : 0) - PAD * 2;
  for (const p of fx) {
    const el = buildPanel(p, bodyH);
    if (layout.pbar) presetBar(el, p);
    el.dataset.g = p.g;
    if (p.ti != null) wirePanelDrag(el, p);
    row.append(el);
  }
  // the trailing tile adds to the end of the chain, as on the desktop
  const add = h("button", "addt", "+");
  add.setAttribute("aria-label", "Add plugin");
  add.addEventListener("click", () => pickPlugin(-1));
  row.append(add);
  if (!fx.length) row.append(h("div", "empty", "No plugins on this track yet"));
  const drop = h("div", "drop"); drop.id = "drop";
  row.append(drop);
  row.scrollLeft = keep;
  row.dataset.trk = trk;
}

// Rebuild after a trace opens or closes. The row stays where it was; if the
// panel has grown past the right edge, scroll just enough to bring its
// meter back in view without pushing the panel's own start off the left.
function rebuildKeeping(g) {
  const row = $("row");
  build();
  const P = ui.panels.get(g);
  if (!P || !P.grEl) return;
  const rr = row.getBoundingClientRect(), pr = P.grEl.pnl.getBoundingClientRect();
  const over = pr.right - (rr.right - 8);
  if (over > 0) row.scrollLeft += Math.max(0, Math.min(over, pr.left - rr.left - 8));
}

// A double tap on a panel's header (not on one of its buttons) collapses
// it, or opens it again -- the desktop's double-click on the name.
function doubleTap(node, fn) {
  let last = 0;
  node.addEventListener("click", e => {
    if (e.target.closest && e.target.closest("button")) return;
    const now = Date.now();
    if (now - last < 350) { last = 0; fn(); } else last = now;
  });
}

function buildPanel(p, bodyH) {
  if (p.eq) return buildEq(p, bodyH);
  // locked: arranged at its saved rows whatever the height, and scrolled
  // when that's taller than the panel
  const lay = placeControls(p.c || [], p.lk ? p.lk * CELL_H : bodyH);
  const scr = !!p.lk && lay.rows * CELL_H > bodyH;
  const SB = scr ? 10 : 0;
  const trOpen = !!p.gr && grv.has(p.g);
  const gr = p.gr ? GR_W + PAD + (trOpen ? TRACE_W + PAD : 0) : 0;
  const w = Math.max(MIN_W, lay.width + PAD * 2 + gr + SB);
  const pnl = h("div", "pnl");
  pnl.style.width = w + "px";
  const pl = p.plate;
  if (pl) {
    pnl.style.background = plateFill(pl);

    pnl.style.borderColor = pl.border;
    for (const [k, v] of [["--label", pl.text], ["--value", pl.dim], ["--dim", pl.dim], ["--text", pl.text], ["--ring", pl.tick]]) pnl.style.setProperty(k, v);
  }
  // the 3D effect: edges that catch the light, and knobs and buttons
  // casting shadows (any panel, faceplate or not)
  if (layout.tex) { pnl.classList.add("hw"); pnl.style.setProperty("--hwk", METAL_K); }
  const head = h("div", "ph");
  if (pl) { head.style.background = pl.head; head.style.borderColor = pl.border; }
  const byp = h("button", "hb"); byp.innerHTML = `<svg viewBox="0 0 24 24">${ICON.power}</svg>`;
  byp.addEventListener("click", () => send("byp", p.g));
  const flt = h("button", "hb fl"); flt.innerHTML = `<svg viewBox="0 0 24 24">${ICON.float}</svg>`;
  flt.addEventListener("click", () => send("float", p.g));
  const col = h("button", "hb col"); col.innerHTML = `<svg viewBox="0 0 24 24">${ICON.collapse}</svg>`;
  col.setAttribute("aria-label", "Collapse");
  const fold = () => {
    if (shut.has(p.g)) shut.delete(p.g); else shut.add(p.g);
    saveShut();
    pnl.classList.toggle("shut", shut.has(p.g));
  };
  col.addEventListener("click", fold);
  doubleTap(head, fold);
  if (shut.has(p.g)) pnl.classList.add("shut");
  head.append(h("span", "ix", p.i));
  // the padlock goes in the foot with the preset bar; without one, here
  if (p.lk && !layout.pbar) head.append(lockMark(p));
  head.append(h("span", "nm", p.n), moreBtn(p), col, flt, byp);
  const body = h("div", "pb");
  pnl.append(head, body);
  const gridX = PAD + Math.max(0, (w - PAD * 2 - gr - SB - lay.width) / 2);
  // what the grid goes in: the body, or a scrolling box in it that stops
  // short of the meters, holding the grid's whole height
  let gb = body;
  if (scr) {
    gb = h("div", "pg"); gb.style.right = gr + "px";
    const tall = h("div"); tall.style.height = (PAD * 2 + lay.rows * CELL_H) + "px"; tall.style.width = "1px";
    gb.append(tall); body.append(gb);
  }
  const ctl = [];
  // what sections and backgrounds sit on
  const under = (pl && pl.bg) || PAL.panel_bg || css("--panel") || "#202327";
  // styled sections, behind the controls
  for (const s of lay.sections || []) {
    const d = h("div", "sect " + s.by.sec);
    if (s.by.sec === "inset" && lum((pl && pl.bg) || PAL.panel_bg || css("--panel") || "#202327") <= 0.45) d.classList.add("dk");
    d.style.left = (gridX + s.x - 4) + "px"; d.style.top = (PAD - 4) + "px";
    d.style.width = (s.w + 8) + "px"; d.style.height = (lay.rows * CELL_H - 2) + "px";
    if (s.by.sp) { d.style.background = s.by.sp.bg; d.style.borderColor = s.by.sp.border; }
    // its finish: brushed grain, counted down from the grid's top as the
    // backgrounds' grain is (the box's inside starts 3 px above it: 4 up,
    // less the 1 px border), and/or the flake, tiled from the grid's origin
    const sbg = s.by.sp ? s.by.sp.bg : under;
    const imgs = [], pos = [], size = [];
    if (s.by.sb) { imgs.push(grainCss(sbg, "180deg")); pos.push("0 2px, 0 0"); size.push("auto, auto"); }
    if (s.by.sm) { imgs.push(`url(${flakeTile(lum(sbg) > 0.45).url})`); pos.push(`${-(s.x - 3)}px 3px`); size.push("128px 128px"); }
    if (imgs.length) {
      d.style.backgroundImage = imgs.join(", ");
      d.style.backgroundPosition = pos.join(", ");
      d.style.backgroundSize = size.join(", ");
    }
    gb.append(d);
  }
  // controls' own backgrounds, joined with their neighbours', over the
  // sections and rules
  // (a brushed or metallic one and a plain one of the same colour stay apart)
  const bkRects = [], bkPlate = {}, bkGrain = {}, bkMetal = {};
  for (const it of lay.items.concat(lay.spacers || [])) {
    const c = it.c;
    if (!c.bk || it.sx == null) continue;
    const key = c.bk + (c.bb ? "/b" : "") + (c.bm ? "/m" : "");
    bkRects.push([it.sx, it.y, it.sx + it.sw, it.y + (it.h || CELL_H * it.hu / 2), key]);
    if (c.bp) bkPlate[key] = c.bp;
    if (c.bb) bkGrain[key] = true;
    if (c.bm) bkMetal[key] = true;
  }
  const bkShapes = backShapes(bkRects, lay.gaps || [], 3);
  // an inset is a shade darker than what it's on, or lighter on a dark one
  const insetFill = lum(under) > 0.45 ? "rgba(0,0,0,0.12)" : "rgba(255,255,255,0.055)";
  const bkSvg = bkShapes.length ? el("svg", { width: lay.width + 8, height: lay.rows * CELL_H + 8 }) : null;
  for (const s of bkShapes) {
    const pl = bkPlate[s.key];
    const d = [s.outer, ...s.holes].map(l => roundedLoop(l, 6)).join(" ");
    el("path", { d, "fill-rule": "evenodd",
      fill: pl ? pl.bg : insetFill, stroke: pl ? pl.border : "rgba(0,0,0,0.35)", "stroke-width": 1,
      transform: "translate(4 4)" }, bkSvg);
    if (bkMetal[s.key]) {
      // the flake, as a pattern tiled from the grid's origin
      let defs = bkSvg.querySelector("defs");
      if (!defs) defs = el("defs", {}, bkSvg);
      const id = "flake" + (++gradN);
      const pat = el("pattern", { id, patternUnits: "userSpaceOnUse", width: 128, height: 128 }, defs);
      el("image", { href: flakeTile(lum(pl ? pl.bg : under) > 0.45).url, width: 128, height: 128 }, pat);
      el("path", { d, "fill-rule": "evenodd", fill: `url(#${id})`, transform: "translate(4 4)" }, bkSvg);
    }
    if (bkGrain[s.key]) {
      for (const f of grainFills(bkSvg, pl ? pl.bg : under))
        el("path", { d, "fill-rule": "evenodd", fill: f, transform: "translate(4 4)" }, bkSvg);
    }
  }
  if (bkSvg) { bkSvg.classList.add("bks"); bkSvg.style.left = (gridX - 4) + "px"; bkSvg.style.top = (PAD - 4) + "px"; }

  for (const rx of lay.rules) {
    const r = h("div", "rule"); r.style.left = (gridX + rx) + "px"; r.style.top = PAD + "px";
    r.style.height = (lay.rows * CELL_H - 8) + "px"; gb.append(r);
  }
  if (bkSvg) gb.append(bkSvg);
  for (const it of lay.items) {
    const c = it.c, cell = h("div", "cell");
    // the size it was given room for: small and large knobs (a size too
    // tall for the panel came back ordinary)
    const size = it.wu === 2 && it.hu === 1 ? "small" : it.wu === 3 && it.hu === 3 ? "large" : "medium";
    const cw = CELL_W * it.wu / 2;
    cell.style.left = (gridX + it.x) + "px"; cell.style.top = (PAD + it.y) + "px"; cell.style.width = cw + "px";
    // on its own background's plate, or else its section's, that plate's inks
    const sp = c.bp || (it.sec != null && lay.sections[it.sec].by.sp);
    if (sp) for (const [k, v] of [["--label", sp.text], ["--value", sp.dim], ["--dim", sp.dim], ["--text", sp.text], ["--ring", sp.tick]]) cell.style.setProperty(k, v);
    gb.append(cell);
    const id = p.g + ":" + c.idx;
    if (c.t === "blank") continue;
    if (c.t === "missing") { cell.append(h("div", "miss", "!")); continue; }
    const lbl = h("div", "lbl", c.l || ""); lbl.style.width = (cw - 4) + "px";
    const val = h("div", "val", ""); val.style.width = (cw - 4) + "px";
    const entry = { c, id, val };
    const sendV = v => { touch(id, v); send("p", p.g, c.p, v.toFixed(4)); };
    if (c.t === "knob" || c.t === "stepped") {
      // a numbered scale: the box takes the room the dial and its margins
      // had (a medium one the value line's too -- its value shows in place
      // of the name while it's turned), and the dial is as big as fits in
      // it with its numbers
      const sc = size !== "small" && c.sc && c.sc.m && c.sc.m.length ? c.sc : null;
      const D = KNOB_D[size];
      const mg = Math.max(0, (CELL_H * it.hu / 2 - CELL_H - (D - KNOB)) / 2);
      let k, box = h("div", "knob");
      if (sc) {
        const W = cw - 4, H = size === "medium" ? 6 + D + 4 + 14 : 10 + D + 2 * mg;
        const s = makeScale(W, H, D, sc);
        k = makeKnob(s.d, c.st, c.cap, c.bi, null, true);
        Object.assign(k.svg.style, { position: "absolute", left: s.x + "px", top: s.y + "px" });
        box.style.width = W + "px"; box.style.height = H + "px";
        box.append(k.svg, s.svg);
      } else {
        k = makeKnob(D, c.st, c.cap, c.bi);
        box.append(k.svg);
      }
      // the arc is a printed scale, not a knob standing on the plate: no shadow
      if (!BODY[STYLE_ALIAS[c.st] || c.st]) box.classList.add("flat");
      if (size === "small") {
        // a small name over a smaller dial: there's no hovering on a touch
        // screen, so the name has to be on the panel; no room for the value
        lbl.classList.add("sm");
        box.style.margin = "1px 0 0";
        box.title = c.l || "";
        cell.append(lbl, box);
        entry.val = null;
      } else {
        // the dial centred in what the bigger cell adds round it
        const m = mg;
        if (sc) {

            box.addEventListener("pointerup", up); box.addEventListener("pointercancel", up);

      dragger(box, () => cur, v => {

      // its own lit colour, when it has one, with ink that reads on it
      if (c.lit) { b.style.setProperty("--ton", c.lit); b.style.setProperty("--ton-ink", lum(c.lit) > 0.55 ? "#0d1116" : "#f4f4f2"); }
      if (small) cell.append(b); else cell.append(lbl, b);

      entry.set = (v, x) => { cur = v; b.classList.toggle("on", v >= 0.5);

      row.style.width = (cw - 6) + "px";
      const names = (c.ch && c.ch.length ? c.ch : Array.from({ length: c.nb }, (_, i) => String(i + 1))).slice(0, c.nb);
      const btns = names.map((nm, i) => {
        const b = h("button", "bb", nm); b.title = nm;
        if (BUTTON_FACES.has(c.st)) b.classList.add("bs-" + c.st);

        row.append(b);
        return b;
      });
      cell.append(lbl, row);
      entry.set = v => {
        const ref = c.ch && c.ch.length ? c : { ch: names };
        const k = nearestChoice(ref, v);
        btns.forEach((b, i) => b.classList.toggle("on", i === k));
      };
      entry.val = null;
    } else if (c.t === "combo") {
      const b = h("button", "cmb"); b.style.width = (CELL_W - 8) + "px";
      cell.append(lbl, b);
      let cur = 0, curText = "";
      b.addEventListener("click", () => pickChoice(c, cur, v => { cur = v; sendV(v); }));

      entry.val = null;
    } else if (c.t === "fader") {
      const H = (it.h || CELL_H * 3) - 34;
      const fd = makeFader(34, c.st || "flat", c.cap);
      fd.node.style.height = H + "px";
      fd.node.style.margin = "2px 0";
      cell.append(lbl, fd.node, val);
      let cur = 0;
      dragger(fd.node, () => cur, v => { cur = v; fd.set(v); sendV(v); }, { travel: H, reset: () => send("def", p.g, c.p) });
      entry.set = v => { cur = v; fd.set(v); };
    } else continue;
    ctl.push(entry);
  }
  let grEl = null;

const B64V = new Int16Array(128).fill(-1);
"ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_".split("").forEach((c, i) => B64V[c.charCodeAt(0)] = i);
const withA = (col, a) => {
  const m = /^#?([0-9a-f]{6})/i.exec(col || "");
  if (!m) return col;
  const n = parseInt(m[1], 16);
  return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`;
};

// The columns the bridge sends (TS_CV_Trace's, packed): output peaks and
// troughs and input peaks a character each as a share of full scale, the
// reduction two characters in 1/64 dB. Drawn as ChannelView's window draws it.
function drawTrace(G, t, gr, est, range, win) {
  const cv = G.cv, dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) {
    cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  }
  if (!G.col) {
    const cs = getComputedStyle(G.pnl);
    const v = n => cs.getPropertyValue(n).trim();
    G.col = { dim: v("--dim"), value: v("--value"), ring: v("--ring"), grm: v("--grm"), bi: v("--fill-bi") };
  }
  const K = G.col, x = cv.getContext("2d");
  x.setTransform(dpr, 0, 0, dpr, 0, 0);
  x.clearRect(0, 0, W, H);
  x.fillStyle = "rgba(0,0,0,0.22)";
  x.beginPath(); x.roundRect ? x.roundRect(0.5, 0.5, W - 1, H - 1, 2) : x.rect(0.5, 0.5, W - 1, H - 1); x.fill();
  x.strokeStyle = withA(K.ring, 0.56); x.lineWidth = 1; x.stroke();
  x.font = "10px -apple-system, system-ui, sans-serif";
  x.textBaseline = "middle"; x.textAlign = "center";
  if (!t || t.m) {
    x.fillStyle = K.dim;
    const m1 = t ? t.m : "connecting…", m2 = t && t.m2;
    x.fillText(m1, W / 2, H / 2 - (m2 ? 6 : 0));
    if (m2) x.fillText(m2, W / 2, H / 2 + 7);
  } else {
    const N = t.o.length, ix0 = 2, pw = W - 4, cw = pw / N;
    const mid = H / 2, hh = (H - 6) / 2, top = 2, gh = H - 4;
    if (t.b > 1) {
      x.fillStyle = withA(K.ring, 0.38);
      for (let b = 1; b < t.b; b++) x.fillRect(Math.floor(ix0 + pw * b / t.b), 1, 1, H - 2);
    }
    x.fillStyle = withA(K.ring, 0.31); x.fillRect(ix0, Math.floor(mid), pw, 1);
    const q = (s, k) => (B64V[s.charCodeAt(k)] || 0) / 63;
    x.fillStyle = withA(K.dim, 0.27);
    for (let k = 0; k < N; k++) {
      const e = Math.min(1, q(t.i, k)) * hh;
      if (e > 0) x.fillRect(ix0 + k * cw, mid - e, cw + 0.3, 2 * e);
    }
    x.fillStyle = withA(K.value, 0.66);
    for (let k = 0; k < N; k++) {
      let y0 = mid - q(t.o, k) * hh, y1 = mid + q(t.u, k) * hh;
      if (y1 - y0 < 1) { y0 = mid - 0.5; y1 = mid + 0.5; }
      x.fillRect(ix0 + k * cw, y0, cw + 0.3, y1 - y0);
    }
    const gc = est ? K.grm : K.bi;
    const pts = [];
    x.fillStyle = withA(gc, 0.14);
    for (let k = 0; k < N; k++) {
      const a = B64V[t.g.charCodeAt(2 * k)], b = B64V[t.g.charCodeAt(2 * k + 1)];
      if (a < 0 || b < 0) continue;
      const db = (a * 64 + b) / 64;
      const gy = top + Math.min(1, Math.max(0, db) / range) * gh;
      const xx = ix0 + (k + 0.5) * cw;
      if (gy > top + 0.5) x.fillRect(ix0 + k * cw, top, cw + 0.3, gy - top);
      pts.push(xx, gy);
    }
    if (pts.length > 2) {
      x.strokeStyle = gc; x.lineWidth = 1.6; x.lineJoin = "round";
      x.beginPath(); x.moveTo(pts[0], pts[1]);
      for (let k = 2; k < pts.length; k += 2) x.lineTo(pts[k], pts[k + 1]);
      x.stroke();
    }
  }
  x.textAlign = "right"; x.textBaseline = "alphabetic";
  x.fillStyle = K.dim;
  x.fillText(grvLabel(win), W - 4, H - 4);
}

// Press and hold a panel's header, then drag it along the row. The marker
// shows where it will land; letting go there moves it.
function wirePanelDrag(pnl, p) {
  const head = pnl.querySelector(".ph");
  let timer = null, dragging = false, sx = 0, sy = 0, gap = null, pid = null;
  const row = $("row");
  const tops = () => [...row.querySelectorAll(".pnl")].map(el => ({ el, p: (layout.fx || []).find(f => f.g === el.dataset.g) }))
    .filter(t => t.p && t.p.ti != null);
  const gapAt = x => {
    const ts = tops();
    for (const t of ts) {
      const r = t.el.getBoundingClientRect();
      if (x < r.left + r.width / 2) return { gap: t.p.ti, x: r.left };
    }
    const last = ts[ts.length - 1];
    if (!last) return null;
    const r = last.el.getBoundingClientRect();
    return { gap: last.p.ti + 1, x: r.right + 4 };
  };
  const cancel = () => { clearTimeout(timer); timer = null; };
  head.addEventListener("pointerdown", e => {
    if (e.target.closest("button")) return;
    sx = e.clientX; sy = e.clientY; pid = e.pointerId;
    cancel();
    timer = setTimeout(() => {
      dragging = true;
      head.setPointerCapture(pid);
      pnl.classList.add("lift");
      if (navigator.vibrate) navigator.vibrate(10);
    }, 380);
  });
  head.addEventListener("pointermove", e => {
    if (!dragging) {
      if (Math.hypot(e.clientX - sx, e.clientY - sy) > 10) cancel();
      return;
    }
    e.preventDefault();
    const g = gapAt(e.clientX);
    const drop = $("drop");
    if (!g) return;
    gap = g.gap;
    const rr = row.getBoundingClientRect();
    drop.style.left = (g.x - rr.left + row.scrollLeft - 4) + "px";
    drop.style.display = "block";
    // keep the row scrolling under a finger near either edge
    if (e.clientX > rr.right - 40) row.scrollLeft += 12;
    else if (e.clientX < rr.left + 40) row.scrollLeft -= 12;
  });
  const end = () => {
    cancel();
    if (!dragging) return;
    dragging = false;
    pnl.classList.remove("lift");
    $("drop").style.display = "none";
    if (gap != null && gap !== p.ti && gap !== p.ti + 1) send("fxmove", p.g, gap);
    gap = null;
  };
  head.addEventListener("pointerup", end);
  head.addEventListener("pointercancel", end);
}

// The add-a-plugin sheet: search plus your FX folders, categories and
// developers, as the desktop picker has. `at` is the top-level slot to
// insert before, or -1 for the end.
let fxSeq = 0;
function pickPlugin(at) {
  let kind = "", val = "", timer = null;
  openSheet(sh => {
    sh.classList.add("pk");
    sh.append(h("h3", null, at < 0 ? "Add plugin" : "Insert plugin"));
    const q = h("input", "fld"); q.placeholder = "Search plugins (e.g. fab sat)";
    q.setAttribute("autocapitalize", "off"); q.setAttribute("autocorrect", "off");
    const flt = h("div", "flt");
    const sel = h("select");
    sel.append(new Option("All plugins", ""));
    flt.append(sel);
    const res = h("div", "res");
    sh.append(q, flt, res);
    let treeLoaded = false;
    const fillTree = tree => {
      if (treeLoaded || !tree) return;
      treeLoaded = true;
      const group = (label, list, k, useId) => {
        if (!list || !list.length) return;
        const g = document.createElement("optgroup"); g.label = label;
        for (const it of list) g.append(new Option(`${it.n}  (${it.c})`, k + "\t" + (useId ? it.id : it.n)));
        sel.append(g);
      };
      group("FX folders", tree.folders, "folder", true);
      group("Categories", tree.cats, "cat");
      group("Developers", tree.devs, "dev");
    };
    let searched = null;   // the query the list on screen is for
    const go = async () => {
      const mine = ++fxSeq;
      const clean = t => String(t).replace(/[|~]/g, " ");
      send("fxfind", mine, clean(q.value), kind, clean(val));
      const asked = q.value;
      for (let k = 0; k < 30 && mine === fxSeq; k++) {
        await new Promise(r => setTimeout(r, 120));
        try {
          const r = await reaper(`GET/EXTSTATE/${NS}/fxfound`);
          const f = r.ext.fxfound ? JSON.parse(r.ext.fxfound) : null;
          if (!f || f.s !== mine) continue;
          fillTree(f.tree);
          searched = asked;
          res.innerHTML = "";
          let recentHdr = false, allHdr = false;
          if (!f.r.length) res.append(h("div", "lbl", "Nothing found"));
          for (const e of f.r) {
            if (e.r && !recentHdr) { res.append(h("div", "hdr", "Recent")); recentHdr = true; }
            if (!e.r && recentHdr && !allHdr) { res.append(h("div", "hdr", "All")); allHdr = true; }
            const o = h("button", "opt");
            if (e.f) {
              const fm = h("span", "fm", e.f), fc = layout && layout.fmt && (layout.fmt[e.f] || layout.fmt.__other);
              if (fc) { fm.style.background = fc.bg; fm.style.color = fc.fg; fm.style.borderColor = fc.bg; }
              o.append(fm);
            }
            o.append(h("span", null, e.n), h("span", "vn", e.v || ""));
            o.addEventListener("click", () => { send("fxadd", encodeURIComponent(e.id), at); closeSheet(); });
            res.append(o);
          }
          return;
        } catch (err) {}
      }
    };
    q.addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(go, 200); });
    // Enter adds the first plugin found (searching first if it hasn't yet)
    q.addEventListener("keydown", async e => {
      if (e.key !== "Enter") return;
      clearTimeout(timer);
      if (searched !== q.value) await go();
      const first = res.querySelector("button.opt");
      if (first) first.click();
    });
    sel.addEventListener("change", () => {
      const [k, v] = sel.value.split("\t");
      kind = sel.value ? k : ""; val = sel.value ? v : "";
      go();
    });
    go();
    setTimeout(() => q.focus(), 60);
  });
}
