# Builds ReaPack's catalogue (index.xml) on GitHub, so releasing is nothing
# more than: bump the @version in a file, commit, push.
#
# reapack-index reads the git HISTORY to work out which versions exist and
# what changed, which is why this checks out the full history rather than
# the usual shallow clone. It then commits index.xml back to the repo.
name: Build ReaPack index

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # reapack-index needs every commit, not just the last

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - run: gem install reapack-index

      # reapack-index converts each package's @about from Markdown to RTF for
      # ReaPack's About panel, and shells out to pandoc to do it. Without this
      # every package carrying an @about fails -- which is why ChannelView
      # failed while Track Analyser, which has no @about, passed.
      - run: sudo apt-get update && sudo apt-get install -y pandoc

      # Printed before anything is generated, and it names every file it can
      # and cannot read metadata from. Without this a file with a header
      # reapack-index does not understand is simply absent from the
      # catalogue, with nothing in the log to say so -- which is exactly how
      # ChannelView went missing from the first build.
      - name: Validate package metadata
        run: reapack-index --check --no-progress

      - name: Generate and commit index.xml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # --rebuild: clear the index and rescan the whole history, every time.
          #
          # Without it reapack-index only writes a version's sources when that
          # version is NEW -- so Track Analyser 1.0.0, first indexed with
          # broken URLs, kept them even after the URL bug was fixed, because
          # 1.0.0 was no longer new. A wrong entry would have stayed wrong
          # until the next version bump.
          #
          # Rebuilding makes index.xml a pure function of the repo's contents:
          # fix a file, push, and the catalogue is correct. It rescans all
          # history each run, which costs nothing at this size.
          reapack-index --no-progress --commit --rebuild --name 'TS-ReaScripts'
          git push
